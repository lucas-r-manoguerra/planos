<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#FAF9F6" rx="8"/>
  <text x="400" y="24" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="bold" fill="#1A1A1A">Seguridad en Andamios</text>

  <!-- Base / ground -->
  <rect x="80" y="410" width="640" height="6" rx="2" fill="#D9D0C4"/>

  <!-- Estabilizadores / patas ajustables -->
  <rect x="120" y="398" width="16" height="18" rx="2" fill="#5A6A7A"/>
  <rect x="115" y="410" width="26" height="8" rx="2" fill="#4A5A6A"/>
  <rect x="380" y="398" width="16" height="18" rx="2" fill="#5A6A7A"/>
  <rect x="375" y="410" width="26" height="8" rx="2" fill="#4A5A6A"/>
  <rect x="640" y="398" width="16" height="18" rx="2" fill="#5A6A7A"/>
  <rect x="635" y="410" width="26" height="8" rx="2" fill="#4A5A6A"/>

  <!-- Escalera vertical izquierda -->
  <rect x="128" y="120" width="8" height="280" fill="#6B7B8D" rx="2"/>
  <!-- Peldaños escalera -->
  <rect x="128" y="140" width="8" height="4" fill="#5A6A7A" rx="1"/>
  <rect x="128" y="170" width="8" height="4" fill="#5A6A7A" rx="1"/>
  <rect x="128" y="200" width="8" height="4" fill="#5A6A7A" rx="1"/>
  <rect x="128" y="230" width="8" height="4" fill="#5A6A7A" rx="1"/>
  <rect x="128" y="260" width="8" height="4" fill="#5A6A7A" rx="1"/>
  <rect x="128" y="290" width="8" height="4" fill="#5A6A7A" rx="1"/>
  <rect x="128" y="320" width="8" height="4" fill="#5A6A7A" rx="1"/>
  <rect x="128" y="350" width="8" height="4" fill="#5A6A7A" rx="1"/>
  <rect x="128" y="380" width="8" height="4" fill="#5A6A7A" rx="1"/>

  <!-- Escalera vertical derecha -->
  <rect x="650" y="120" width="8" height="280" fill="#6B7B8D" rx="2"/>
  <!-- Peldaños escalera derecha -->
  <rect x="650" y="140" width="8" height="4" fill="#5A6A7A" rx="1"/>
  <rect x="650" y="170" width="8" height="4" fill="#5A6A7A" rx="1"/>
  <rect x="650" y="200" width="8" height="4" fill="#5A6A7A" rx="1"/>
  <rect x="650" y="230" width="8" height="4" fill="#5A6A7A" rx="1"/>
  <rect x="650" y="260" width="8" height="4" fill="#5A6A7A" rx="1"/>
  <rect x="650" y="290" width="8" height="4" fill="#5A6A7A" rx="1"/>
  <rect x="650" y="320" width="8" height="4" fill="#5A6A7A" rx="1"/>
  <rect x="650" y="350" width="8" height="4" fill="#5A6A7A" rx="1"/>
  <rect x="650" y="380" width="8" height="4" fill="#5A6A7A" rx="1"/>

  <!-- Vertical central (mid support) -->
  <rect x="390" y="120" width="8" height="280" fill="#6B7B8D" rx="2"/>

  <!-- Horizontal superior (baranda superior) -->
  <rect x="120" y="122" width="544" height="6" rx="2" fill="#E74C3C"/>
  <!-- Horizontal intermedia -->
  <rect x="120" y="220" width="544" height="6" rx="2" fill="#E74C3C" opacity="0.7"/>
  <!-- Horizontal plataforma -->
  <rect x="120" y="360" width="544" height="8" rx="2" fill="#6B7B8D"/>

  <!-- Cruces de San Andrés (diagonales) -->
  <!-- Diagonal 1: left panel -->
  <line x1="136" y1="128" x2="386" y2="358" stroke="#6B7B8D" stroke-width="3" opacity="0.6"/>
  <line x1="386" y1="128" x2="136" y2="358" stroke="#6B7B8D" stroke-width="3" opacity="0.6"/>
  <!-- Diagonal 2: right panel -->
  <line x1="398" y1="128" x2="646" y2="358" stroke="#6B7B8D" stroke-width="3" opacity="0.6"/>
  <line x1="646" y1="128" x2="398" y2="358" stroke="#6B7B8D" stroke-width="3" opacity="0.6"/>

  <!-- Rodapié -->
  <rect x="120" y="352" width="544" height="6" rx="1" fill="#8B4513"/>

  <!-- Plataforma de trabajo (tablones) -->
  <rect x="140" y="362" width="120" height="14" rx="2" fill="#C17A57"/>
  <rect x="268" y="362" width="120" height="14" rx="2" fill="#B87050"/>
  <rect x="396" y="362" width="120" height="14" rx="2" fill="#C17A57"/>
  <rect x="524" y="362" width="120" height="14" rx="2" fill="#B87050"/>

  <!-- Líneas de separación entre tablones -->
  <line x1="260" y1="362" x2="260" y2="376" stroke="#8B5E3C" stroke-width="1.5"/>
  <line x1="388" y1="362" x2="388" y2="376" stroke="#8B5E3C" stroke-width="1.5"/>
  <line x1="516" y1="362" x2="516" y2="376" stroke="#8B5E3C" stroke-width="1.5"/>

  <!-- Arnés de seguridad anclado (trabajador fig) -->
  <!-- Punto de anclaje separado arriba -->
  <circle cx="300" cy="50" r="6" fill="#FF6347" stroke="#CC4030" stroke-width="2"/>
  <line x1="300" y1="56" x2="300" y2="80" stroke="#FF6347" stroke-width="2"/>
  <!-- Línea de vida -->
  <line x1="300" y1="80" x2="300" y2="160" stroke="#FF6347" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Trabajador simplificado -->
  <circle cx="300" cy="170" r="10" fill="#2D2D2D"/>
  <rect x="294" y="180" width="12" height="20" rx="3" fill="#FFD700"/>
  <rect x="294" y="180" width="12" height="20" rx="3" fill="#FF8C00" opacity="0.5"/>
  <line x1="300" y1="200" x2="290" y2="220" stroke="#2D2D2D" stroke-width="3"/>
  <line x1="300" y1="200" x2="310" y2="220" stroke="#2D2D2D" stroke-width="3"/>
  <rect x="288" y="220" width="4" height="12" rx="1" fill="#2D2D2D"/>
  <rect x="308" y="220" width="4" height="12" rx="1" fill="#2D2D2D"/>
  <!-- Línea de arnés desde trabajador -->
  <line x1="300" y1="180" x2="300" y2="160" stroke="#FF6347" stroke-width="1.5"/>

  <!-- Etiquetas -->
  <!-- Superior -->
  <rect x="448" y="106" width="130" height="18" rx="4" fill="#FDE8E4"/>
  <text x="513" y="119" text-anchor="middle" font-family="system-ui" font-size="9" fill="#CC4030">Baranda superior 1m</text>

  <!-- Intermedia -->
  <rect x="448" y="204" width="140" height="18" rx="4" fill="#FDE8E4" opacity="0.8"/>
  <text x="518" y="217" text-anchor="middle" font-family="system-ui" font-size="9" fill="#CC4030">Baranda intermedia 0.50m</text>

  <!-- Rodapié -->
  <rect x="20" y="346" width="68" height="18" rx="4" fill="#F0E0D0"/>
  <text x="54" y="359" text-anchor="middle" font-family="system-ui" font-size="9" fill="#5C2D0A">Rodapié</text>

  <!-- Diagonal -->
  <rect x="16" y="240" width="102" height="18" rx="4" fill="#E8EDF0"/>
  <text x="67" y="253" text-anchor="middle" font-family="system-ui" font-size="9" fill="#4A5A6A">Diagonal rigidizante</text>

  <!-- Arnés -->
  <rect x="200" y="106" width="108" height="18" rx="4" fill="#FDE8E4"/>
  <text x="254" y="119" text-anchor="middle" font-family="system-ui" font-size="9" fill="#CC4030">Arnés de seguridad</text>

  <!-- Plataforma -->
  <rect x="160" y="352" width="100" height="16" rx="3" fill="#F0E0D0"/>
  <text x="210" y="364" text-anchor="middle" font-family="system-ui" font-size="8" fill="#5C2D0A">Plataforma de trabajo</text>

  <!-- Escalera -->
  <rect x="60" y="128" width="70" height="18" rx="4" fill="#E8EDF0"/>
  <text x="95" y="141" text-anchor="middle" font-family="system-ui" font-size="9" fill="#4A5A6A">Escalera de acceso</text>

  <!-- Anclaje -->
  <rect x="200" y="36" width="120" height="18" rx="4" fill="#FDE8E4"/>
  <text x="260" y="49" text-anchor="middle" font-family="system-ui" font-size="9" fill="#CC4030">Punto de anclaje (500 kg min)</text>

  <!-- Estabilizador -->
  <rect x="340" y="396" width="90" height="16" rx="3" fill="#E8EDF0"/>
  <text x="385" y="408" text-anchor="middle" font-family="system-ui" font-size="8" fill="#4A5A6A">Estabilizador / pata ajustable</text>

  <!-- Nota footer -->
  <rect x="120" y="440" width="560" height="24" rx="4" fill="#F5F3EF" stroke="#E0DDD6"/>
  <text x="400" y="456" text-anchor="middle" font-family="system-ui" font-size="9" fill="#6B6B6B">Andamio tubular con barandas, rodapié y arnés de seguridad — Resolución SRT 567/21</text>

  <!-- Indicador de altura -->
  <line x1="70" y1="124" x2="70" y2="360" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="65" y1="124" x2="75" y2="124" stroke="#999" stroke-width="1"/>
  <line x1="65" y1="360" x2="75" y2="360" stroke="#999" stroke-width="1"/>
  <text x="62" y="248" text-anchor="middle" font-family="system-ui" font-size="8" fill="#999" transform="rotate(-90, 62, 248)">Altura trabajo</text>
</svg>
