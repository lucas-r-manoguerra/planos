<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#FAF9F6" rx="8"/>
  <text x="400" y="28" text-anchor="middle" font-family="system-ui" font-size="15" font-weight="bold" fill="#1A1A1A">Tipos de Cielorraso</text>

  <!-- === 3×2 GRID — each cell: 240×130, starting at x=20, x=280, x=540; y=50, y=200 === -->

  <!-- 1. Durlock (Placa de Yeso) -->
  <g transform="translate(20, 50)">
    <rect x="0" y="0" width="240" height="130" fill="#F8F6F2" stroke="#E0DDD6" stroke-width="1.5" rx="6"/>
    <!-- Placa de yeso blanca con perfiles en el borde -->
    <rect x="20" y="15" width="200" height="50" fill="#F5F5F0" stroke="#D0CCC4" stroke-width="1.5" rx="1"/>
    <!-- Lineas de junta (juntas tomadas) -->
    <line x1="86" y1="15" x2="86" y2="65" stroke="#E8E0D0" stroke-width="2"/>
    <line x1="153" y1="15" x2="153" y2="65" stroke="#E8E0D0" stroke-width="2"/>
    <!-- Perfil metálico borde inferior (sección) -->
    <rect x="20" y="65" width="200" height="8" fill="#6B7B8D" rx="1"/>
    <!-- Tornillos visibles -->
    <circle cx="40" cy="40" r="2" fill="#999"/>
    <circle cx="120" cy="40" r="2" fill="#999"/>
    <circle cx="200" cy="40" r="2" fill="#999"/>
    <!-- Label -->
    <text x="120" y="98" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="bold" fill="#1A1A1A">Durlock</text>
    <text x="120" y="113" text-anchor="middle" font-family="system-ui" font-size="9" fill="#666">Placa de yeso laminado</text>
    <text x="120" y="125" text-anchor="middle" font-family="system-ui" font-size="8" fill="#999">12,5 mm con perfiles metálicos</text>
  </g>

  <!-- 2. Suspendido (Registrable) -->
  <g transform="translate(280, 50)">
    <rect x="0" y="0" width="240" height="130" fill="#F8F6F2" stroke="#E0DDD6" stroke-width="1.5" rx="6"/>
    <!-- Parrilla T y placas modulares -->
    <!-- Perfil T horizontal principal -->
    <rect x="20" y="25" width="200" height="4" fill="#C0C0C0" rx="1"/>
    <!-- Perfiles T secundarios verticales -->
    <rect x="85" y="25" width="4" height="45" fill="#C0C0C0"/>
    <rect x="151" y="25" width="4" height="45" fill="#C0C0C0"/>
    <!-- Placas modulares -->
    <rect x="22" y="29" width="60" height="40" fill="#FFFFFF" stroke="#D0CCC4" stroke-width="1" rx="1"/>
    <rect x="91" y="29" width="56" height="40" fill="#FFFFFF" stroke="#D0CCC4" stroke-width="1" rx="1"/>
    <rect x="157" y="29" width="60" height="40" fill="#FFFFFF" stroke="#D0CCC4" stroke-width="1" rx="1"/>
    <!-- Placa levantada mostrando acceso -->
    <rect x="91" y="55" width="56" height="40" fill="#FFFFFF" stroke="#D0CCC4" stroke-width="1" rx="1" transform="rotate(-8, 119, 75)"/>
    <!-- Label -->
    <text x="120" y="98" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="bold" fill="#1A1A1A">Suspendido</text>
    <text x="120" y="113" text-anchor="middle" font-family="system-ui" font-size="9" fill="#666">Sistema registrable</text>
    <text x="120" y="125" text-anchor="middle" font-family="system-ui" font-size="8" fill="#999">Perfiles T + placas modulares 60×60</text>
  </g>

  <!-- 3. Placas de Yeso (Aplicado Directo) -->
  <g transform="translate(540, 50)">
    <rect x="0" y="0" width="240" height="130" fill="#F8F6F2" stroke="#E0DDD6" stroke-width="1.5" rx="6"/>
    <!-- Placas cuadradas con junta decorativa -->
    <rect x="20" y="15" width="55" height="50" fill="#F0EDE8" stroke="#D5D0C8" stroke-width="1.5" rx="1"/>
    <rect x="85" y="15" width="55" height="50" fill="#F0EDE8" stroke="#D5D0C8" stroke-width="1.5" rx="1"/>
    <rect x="150" y="15" width="55" height="50" fill="#F0EDE8" stroke="#D5D0C8" stroke-width="1.5" rx="1"/>
    <rect x="20" y="20" width="55" height="5" fill="#E0DCD4" rx="1"/>
    <rect x="85" y="20" width="55" height="5" fill="#E0DCD4" rx="1"/>
    <rect x="150" y="20" width="55" height="5" fill="#E0DCD4" rx="1"/>
    <!-- Flecha indicando adhesión directa a la losa -->
    <line x1="120" y1="-5" x2="120" y2="7" stroke="#999" stroke-width="1.5" stroke-dasharray="3,2"/>
    <polygon points="116,5 120,10 124,5" fill="#999"/>
    <!-- Label -->
    <text x="120" y="98" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="bold" fill="#1A1A1A">Placas de Yeso</text>
    <text x="120" y="113" text-anchor="middle" font-family="system-ui" font-size="9" fill="#666">Aplicado directo</text>
    <text x="120" y="125" text-anchor="middle" font-family="system-ui" font-size="8" fill="#999">Fijación con pegamento a la losa</text>
  </g>

  <!-- 4. Listones de Madera -->
  <g transform="translate(20, 195)">
    <rect x="0" y="0" width="240" height="130" fill="#F8F6F2" stroke="#E0DDD6" stroke-width="1.5" rx="6"/>
    <!-- Listones de madera paralelos con separación -->
    <rect x="20" y="15" width="14" height="55" fill="#B8860B" rx="1"/>
    <rect x="40" y="15" width="14" height="55" fill="#C4941E" rx="1"/>
    <rect x="60" y="15" width="14" height="55" fill="#B8860B" rx="1"/>
    <rect x="80" y="15" width="14" height="55" fill="#A07818" rx="1"/>
    <rect x="100" y="15" width="14" height="55" fill="#C4941E" rx="1"/>
    <rect x="120" y="15" width="14" height="55" fill="#B8860B" rx="1"/>
    <rect x="140" y="15" width="14" height="55" fill="#A07818" rx="1"/>
    <rect x="160" y="15" width="14" height="55" fill="#C4941E" rx="1"/>
    <rect x="180" y="15" width="14" height="55" fill="#B8860B" rx="1"/>
    <rect x="200" y="15" width="14" height="55" fill="#A07818" rx="1"/>
    <!-- Fijaciones pequeñas -->
    <circle cx="27" cy="70" r="1.5" fill="#8B6914"/>
    <circle cx="67" cy="70" r="1.5" fill="#8B6914"/>
    <circle cx="107" cy="70" r="1.5" fill="#8B6914"/>
    <circle cx="147" cy="70" r="1.5" fill="#8B6914"/>
    <circle cx="187" cy="70" r="1.5" fill="#8B6914"/>
    <!-- Label -->
    <text x="120" y="98" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="bold" fill="#1A1A1A">Listones de Madera</text>
    <text x="120" y="113" text-anchor="middle" font-family="system-ui" font-size="9" fill="#666">Pino, cedro o lapacho</text>
    <text x="120" y="125" text-anchor="middle" font-family="system-ui" font-size="8" fill="#999">Separación variable para acústica</text>
  </g>

  <!-- 5. Metálico (Aluminio) -->
  <g transform="translate(280, 195)">
    <rect x="0" y="0" width="240" height="130" fill="#F8F6F2" stroke="#E0DDD6" stroke-width="1.5" rx="6"/>
    <!-- Paneles de aluminio ranurados -->
    <rect x="20" y="18" width="200" height="10" fill="#D8D8D8" stroke="#C0C0C0" stroke-width="1" rx="1"/>
    <rect x="20" y="32" width="200" height="10" fill="#C8C8C8" stroke="#B0B0B0" stroke-width="1" rx="1"/>
    <rect x="20" y="46" width="200" height="10" fill="#D8D8D8" stroke="#C0C0C0" stroke-width="1" rx="1"/>
    <rect x="20" y="60" width="200" height="10" fill="#C8C8C8" stroke="#B0B0B0" stroke-width="1" rx="1"/>
    <!-- Ranuras verticales en cada panel -->
    <line x1="50" y1="18" x2="50" y2="28" stroke="#A0A0A0" stroke-width="0.5"/>
    <line x1="80" y1="18" x2="80" y2="28" stroke="#A0A0A0" stroke-width="0.5"/>
    <line x1="110" y1="18" x2="110" y2="28" stroke="#A0A0A0" stroke-width="0.5"/>
    <line x1="140" y1="18" x2="140" y2="28" stroke="#A0A0A0" stroke-width="0.5"/>
    <line x1="170" y1="18" x2="170" y2="28" stroke="#A0A0A0" stroke-width="0.5"/>
    <!-- Perfil clip en borde -->
    <rect x="20" y="72" width="200" height="3" fill="#A0A0A0" rx="1"/>
    <!-- Label -->
    <text x="120" y="98" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="bold" fill="#1A1A1A">Metálico</text>
    <text x="120" y="113" text-anchor="middle" font-family="system-ui" font-size="9" fill="#666">Aluminio o chapa</text>
    <text x="120" y="125" text-anchor="middle" font-family="system-ui" font-size="8" fill="#999">Paneles ranurados, resistentes a humedad</text>
  </g>

  <!-- 6. PVC -->
  <g transform="translate(540, 195)">
    <rect x="0" y="0" width="240" height="130" fill="#F8F6F2" stroke="#E0DDD6" stroke-width="1.5" rx="6"/>
    <!-- Paneles blancos con unión machihembrada -->
    <rect x="20" y="15" width="56" height="55" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1.5" rx="1"/>
    <rect x="80" y="15" width="56" height="55" fill="#F8F8F8" stroke="#E0E0E0" stroke-width="1.5" rx="1"/>
    <rect x="140" y="15" width="56" height="55" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1.5" rx="1"/>
    <!-- Unión ranura y lengüeta (detalle pequeño) -->
    <circle cx="78" cy="42" r="3" fill="#E8E8E8" stroke="#D0D0D0" stroke-width="0.5"/>
    <circle cx="138" cy="42" r="3" fill="#E8E8E8" stroke="#D0D0D0" stroke-width="0.5"/>
    <!-- Línea de unión -->
    <line x1="76" y1="15" x2="76" y2="70" stroke="#D0D0D0" stroke-width="0.8"/>
    <line x1="136" y1="15" x2="136" y2="70" stroke="#D0D0D0" stroke-width="0.8"/>
    <!-- Label -->
    <text x="120" y="98" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="bold" fill="#1A1A1A">PVC</text>
    <text x="120" y="113" text-anchor="middle" font-family="system-ui" font-size="9" fill="#666">Panel de PVC blanco</text>
    <text x="120" y="125" text-anchor="middle" font-family="system-ui" font-size="8" fill="#999">Impermeable, liviano, bajo costo</text>
  </g>

  <!-- === LEGEND / NUMBERED REFS === -->
  <g transform="translate(30, 340)">
    <!-- Line to separate legend -->
    <line x1="0" y1="0" x2="740" y2="0" stroke="#E0DDD6" stroke-width="1"/>

    <!-- 6 mini color swatches -->
    <rect x="0" y="15" width="12" height="12" fill="#F5F5F0" stroke="#D0CCC4" stroke-width="1" rx="1"/>
    <text x="16" y="25" font-family="system-ui" font-size="9" fill="#666">1 Durlock</text>

    <rect x="95" y="15" width="12" height="12" fill="#FFFFFF" stroke="#D0CCC4" stroke-width="1" rx="1"/>
    <text x="111" y="25" font-family="system-ui" font-size="9" fill="#666">2 Suspendido</text>

    <rect x="210" y="15" width="12" height="12" fill="#F0EDE8" stroke="#D5D0C8" stroke-width="1" rx="1"/>
    <text x="226" y="25" font-family="system-ui" font-size="9" fill="#666">3 Placas de yeso</text>

    <rect x="330" y="15" width="12" height="12" fill="#B8860B" rx="1"/>
    <text x="346" y="25" font-family="system-ui" font-size="9" fill="#666">4 Listones</text>

    <rect x="425" y="15" width="12" height="12" fill="#D8D8D8" stroke="#C0C0C0" stroke-width="1" rx="1"/>
    <text x="441" y="25" font-family="system-ui" font-size="9" fill="#666">5 Metálico</text>

    <rect x="530" y="15" width="12" height="12" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1" rx="1"/>
    <text x="546" y="25" font-family="system-ui" font-size="9" fill="#666">6 PVC</text>
  </g>
</svg>
