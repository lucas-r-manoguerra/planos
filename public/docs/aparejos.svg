  <rect x="550" y="110" width="8" height="40" fill="#B8A99A" stroke="none"/>
  <rect x="610" y="110" width="8" height="40" fill="#B8A99A" stroke="none"/>
  <rect x="670" y="110" width="8" height="40" fill="#B8A99A" stroke="none"/>

