<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#FAF9F6" rx="8"/>
  <text x="400" y="30" text-anchor="middle" font-family="system-ui" font-size="15" font-weight="bold" fill="#1A1A1A">Comparativa de Normas Internacionales</text>
  <text x="400" y="48" text-anchor="middle" font-family="system-ui" font-size="11" fill="#6B6B6B">Sistemas de códigos de construcción en Iberoamérica y Europa</text>

  <!-- Card 1 - Argentina -->
  <rect x="25" y="65" width="175" height="400" fill="#FFFFFF" stroke="#E0DDD6" stroke-width="1.5" rx="6"/>
  <rect x="25" y="65" width="175" height="55" fill="#1B3A5C" rx="6"/>
  <rect x="25" y="110" width="175" height="10" fill="#1B3A5C"/>
  <text x="112" y="88" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="bold" fill="#FFFFFF">Argentina</text>
  <text x="112" y="105" text-anchor="middle" font-family="system-ui" font-size="10" fill="#A8C8E8">IRAM / CIRSOC</text>
  <!-- Flag bar -->
  <rect x="25" y="120" width="175" height="4" fill="#75AADB"/>
  <rect x="25" y="120" width="58" height="4" fill="#FFFFFF"/>
  <!-- Content -->
  <text x="112" y="150" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="bold" fill="#1A1A1A">Normas principales</text>
  <text x="35" y="170" font-family="system-ui" font-size="9" fill="#2D2D2D">• IRAM 11654 (térmica)</text>
  <text x="35" y="185" font-family="system-ui" font-size="9" fill="#2D2D2D">• IRAM 11603 (zonas bioambientales)</text>
  <text x="35" y="200" font-family="system-ui" font-size="9" fill="#2D2D2D">• CIRSOC 101 (cargas)</text>
  <text x="35" y="215" font-family="system-ui" font-size="9" fill="#2D2D2D">• CIRSOC 201 (hormigón)</text>
  <text x="35" y="230" font-family="system-ui" font-size="9" fill="#2D2D2D">• CIRSOC 301 (acero)</text>
  <text x="35" y="245" font-family="system-ui" font-size="9" fill="#2D2D2D">• CIRSOC 404 (sismorresistente)</text>
  <line x1="35" y1="260" x2="190" y2="260" stroke="#E0DDD6" stroke-width="1"/>
  <text x="112" y="280" text-anchor="middle" font-family="system-ui" font-size="10" font-weight="bold" fill="#1A1A1A">Organismo</text>
  <text x="112" y="296" text-anchor="middle" font-family="system-ui" font-size="9" fill="#5A5A5A">Instituto Argentino de</text>
  <text x="112" y="310" text-anchor="middle" font-family="system-ui" font-size="9" fill="#5A5A5A">Normalización y Certificación</text>
  <line x1="35" y1="325" x2="190" y2="325" stroke="#E0DDD6" stroke-width="1"/>
  <text x="112" y="345" text-anchor="middle" font-family="system-ui" font-size="10" font-weight="bold" fill="#1A1A1A">Enfoque</text>
  <text x="112" y="362" text-anchor="middle" font-family="system-ui" font-size="9" fill="#5A5A5A">Prescriptivo con</text>
  <text x="112" y="376" text-anchor="middle" font-family="system-ui" font-size="9" fill="#5A5A5A">recomendaciones de</text>
  <text x="112" y="390" text-anchor="middle" font-family="system-ui" font-size="9" fill="#5A5A5A">desempeño</text>

  <!-- Card 2 - Chile -->
  <rect x="215" y="65" width="175" height="400" fill="#FFFFFF" stroke="#E0DDD6" stroke-width="1.5" rx="6"/>
  <rect x="215" y="65" width="175" height="55" fill="#8B1A1A" rx="6"/>
  <rect x="215" y="110" width="175" height="10" fill="#8B1A1A"/>
  <text x="302" y="88" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="bold" fill="#FFFFFF">Chile</text>
  <text x="302" y="105" text-anchor="middle" font-family="system-ui" font-size="10" fill="#F8C8C8">NCh / OGUC</text>
