<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#FAF9F6" rx="8"/>
  <text x="400" y="30" text-anchor="middle" font-family="system-ui" font-size="15" font-weight="bold" fill="#1A1A1A">Tipos de Alambrado y Rejas</text>

  <!-- === 1. Alambrado Olímpico === -->
  <rect x="20" y="50" width="185" height="410" fill="#F5F3EF" stroke="#E0DDD6" rx="6"/>
  <text x="112" y="75" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="bold" fill="#1A1A1A">Alambrado Olímpico</text>

  <!-- Post left -->
  <rect x="40" y="100" width="12" height="280" fill="#6B6B6B" stroke="#2D2D2D" stroke-width="1.5" rx="2"/>
  <!-- Post right -->
  <rect x="165" y="100" width="12" height="280" fill="#6B6B6B" stroke="#2D2D2D" stroke-width="1.5" rx="2"/>
  <!-- Top rail -->
  <rect x="40" y="100" width="137" height="6" fill="#8A8A8A" stroke="#2D2D2D" stroke-width="1" rx="1"/>
  <!-- Bottom rail -->
  <rect x="40" y="200" width="137" height="6" fill="#8A8A8A" stroke="#2D2D2D" stroke-width="1" rx="1"/>
  <!-- Wire mesh (diamond pattern) -->
  <line x1="52" y1="106" x2="80" y2="200" stroke="#4A4A4A" stroke-width="1" opacity="0.6"/>
  <line x1="80" y1="106" x2="108" y2="200" stroke="#4A4A4A" stroke-width="1" opacity="0.6"/>
  <line x1="108" y1="106" x2="136" y2="200" stroke="#4A4A4A" stroke-width="1" opacity="0.6"/>
  <line x1="136" y1="106" x2="165" y2="200" stroke="#4A4A4A" stroke-width="1" opacity="0.6"/>
  <line x1="66" y1="106" x2="52" y2="200" stroke="#4A4A4A" stroke-width="1" opacity="0.6"/>
  <line x1="94" y1="106" x2="80" y2="200" stroke="#4A4A4A" stroke-width="1" opacity="0.6"/>
  <line x1="122" y1="106" x2="108" y2="200" stroke="#4A4A4A" stroke-width="1" opacity="0.6"/>
  <line x1="150" y1="106" x2="136" y2="200" stroke="#4A4A4A" stroke-width="1" opacity="0.6"/>
  <!-- Base -->
  <rect x="35" y="380" width="147" height="30" fill="#B8A99A" stroke="#4A4A4A" stroke-width="1.5" rx="2"/>
  <text x="108" y="395" text-anchor="middle" font-family="system-ui" font-size="8" fill="#2D2D2D">Base de hormigón</text>

  <text x="112" y="445" text-anchor="middle" font-family="system-ui" font-size="9" fill="#6B6B6B">Malla metálica</text>
  <text x="112" y="458" text-anchor="middle" font-family="system-ui" font-size="9" fill="#6B6B6B">Postes cada 2m</text>

  <!-- === 2. Reja de Hierro === -->
  <rect x="210" y="50" width="185" height="410" fill="#F5F3EF" stroke="#E0DDD6" rx="6"/>
  <text x="302" y="75" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="bold" fill="#1A1A1A">Reja de Hierro</text>

  <!-- Frame -->
  <rect x="230" y="100" width="145" height="280" fill="none" stroke="#2D2D2D" stroke-width="3" rx="2"/>
  <!-- Vertical bars -->
  <rect x="240" y="100" width="8" height="280" fill="#3D3D3D" stroke="none" rx="1"/>
  <rect x="258" y="100" width="8" height="280" fill="#3D3D3D" stroke="none" rx="1"/>
  <rect x="276" y="100" width="8" height="280" fill="#3D3D3D" stroke="none" rx="1"/>
  <rect x="294" y="100" width="8" height="280" fill="#3D3D3D" stroke="none" rx="1"/>
  <rect x="312" y="100" width="8" height="280" fill="#3D3D3D" stroke="none" rx="1"/>
  <rect x="330" y="100" width="8" height="280" fill="#3D3D3D" stroke="none" rx="1"/>
  <rect x="348" y="100" width="8" height="280" fill="#3D3D3D" stroke="none" rx="1"/>
  <!-- Horizontal bars -->
  <rect x="230" y="160" width="145" height="6" fill="#3D3D3D" stroke="none" rx="1"/>
  <rect x="230" y="230" width="145" height="6" fill="#3D3D3D" stroke="none" rx="1"/>
  <rect x="230" y="300" width="145" height="6" fill="#3D3D3D" stroke="none" rx="1"/>

  <!-- Base -->
  <rect x="225" y="380" width="155" height="30" fill="#B8A99A" stroke="#4A4A4A" stroke-width="1.5" rx="2"/>

  <!-- Ornamental top spikes -->
  <polygon points="244,100 248,88 252,100" fill="#3D3D3D"/>
  <polygon points="280,100 284,88 288,100" fill="#3D3D3D"/>
  <polygon points="316,100 320,88 324,100" fill="#3D3D3D"/>
  <polygon points="352,100 356,88 360,100" fill="#3D3D3D"/>

  <text x="302" y="445" text-anchor="middle" font-family="system-ui" font-size="9" fill="#6B6B6B">Barrotes de hierro</text>
  <text x="302" y="458" text-anchor="middle" font-family="system-ui" font-size="9" fill="#6B6B6B">Forja ornamental</text>

  <!-- === 3. Cerca de Madera === -->
  <rect x="400" y="50" width="185" height="410" fill="#F5F3EF" stroke="#E0DDD6" rx="6"/>
  <text x="492" y="75" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="bold" fill="#1A1A1A">Cerca de Madera</text>

  <!-- Rails -->
  <rect x="420" y="120" width="145" height="8" fill="#A0752E" stroke="#5D4015" stroke-width="1" rx="1"/>
  <rect x="420" y="260" width="145" height="8" fill="#A0752E" stroke="#5D4015" stroke-width="1" rx="1"/>

  <!-- Pickets -->
  <rect x="425" y="100" width="12" height="260" fill="#C4903B" stroke="#7A5A1E" stroke-width="1" rx="1"/>
  <rect x="445" y="100" width="12" height="260" fill="#C4903B" stroke="#7A5A1E" stroke-width="1" rx="1"/>
  <rect x="465" y="100" width="12" height="260" fill="#C4903B" stroke="#7A5A1E" stroke-width="1" rx="1"/>
  <rect x="485" y="100" width="12" height="260" fill="#C4903B" stroke="#7A5A1E" stroke-width="1" rx="1"/>
  <rect x="505" y="100" width="12" height="260" fill="#C4903B" stroke="#7A5A1E" stroke-width="1" rx="1"/>
  <rect x="525" y="100" width="12" height="260" fill="#C4903B" stroke="#7A5A1E" stroke-width="1" rx="1"/>
  <rect x="545" y="100" width="12" height="260" fill="#C4903B" stroke="#7A5A1E" stroke-width="1" rx="1"/>

  <!-- Post left -->
  <rect x="418" y="95" width="10" height="270" fill="#8B6914" stroke="#5D4015" stroke-width="1" rx="1"/>
  <!-- Post right -->
  <rect x="557" y="95" width="10" height="270" fill="#8B6914" stroke="#5D4015" stroke-width="1" rx="1"/>

  <!-- Picket tops (angled) -->
  <polygon points="425,100 431,90 437,100" fill="#C4903B" stroke="#7A5A1E" stroke-width="1"/>
  <polygon points="445,100 451,90 457,100" fill="#C4903B" stroke="#7A5A1E" stroke-width="1"/>
  <polygon points="465,100 471,90 477,100" fill="#C4903B" stroke="#7A5A1E" stroke-width="1"/>
  <polygon points="485,100 491,90 497,100" fill="#C4903B" stroke="#7A5A1E" stroke-width="1"/>
  <polygon points="505,100 511,90 517,100" fill="#C4903B" stroke="#7A5A1E" stroke-width="1"/>
  <polygon points="525,100 531,90 537,100" fill="#C4903B" stroke="#7A5A1E" stroke-width="1"/>
  <polygon points="545,100 551,90 557,100" fill="#C4903B" stroke="#7A5A1E" stroke-width="1"/>

  <!-- Base -->
  <rect x="415" y="360" width="155" height="30" fill="#B8A99A" stroke="#4A4A4A" stroke-width="1.5" rx="2"/>

  <text x="492" y="420" text-anchor="middle" font-family="system-ui" font-size="9" fill="#6B6B6B">Listones de madera</text>
  <text x="492" y="433" text-anchor="middle" font-family="system-ui" font-size="9" fill="#6B6B6B">Tratamiento a la intemperie</text>

  <!-- === 4. Bloque de Cemento === -->
  <rect x="590" y="50" width="185" height="410" fill="#F5F3EF" stroke="#E0DDD6" rx="6"/>
  <text x="682" y="75" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="bold" fill="#1A1A1A">Bloque de Cemento</text>

  <!-- Wall -->
  <rect x="610" y="100" width="148" height="290" fill="#B8A99A" stroke="#4A4A4A" stroke-width="1.5" rx="2"/>

  <!-- Block lines horizontal -->
  <line x1="610" y1="158" x2="758" y2="158" stroke="#7A6E5A" stroke-width="1.5"/>
  <line x1="610" y1="216" x2="758" y2="216" stroke="#7A6E5A" stroke-width="1.5"/>
  <line x1="610" y1="274" x2="758" y2="274" stroke="#7A6E5A" stroke-width="1.5"/>
  <line x1="610" y1="332" x2="758" y2="332" stroke="#7A6E5A" stroke-width="1.5"/>

  <!-- Block vertical lines (offset per row) -->
  <line x1="659" y1="100" x2="659" y2="158" stroke="#7A6E5A" stroke-width="1"/>
  <line x1="708" y1="100" x2="708" y2="158" stroke="#7A6E5A" stroke-width="1"/>
  <line x1="757" y1="100" x2="757" y2="158" stroke="#7A6E5A" stroke-width="1"/>

  <line x1="634" y1="158" x2="634" y2="216" stroke="#7A6E5A" stroke-width="1"/>
  <line x1="683" y1="158" x2="683" y2="216" stroke="#7A6E5A" stroke-width="1"/>
  <line x1="732" y1="158" x2="732" y2="216" stroke="#7A6E5A" stroke-width="1"/>

  <line x1="659" y1="216" x2="659" y2="274" stroke="#7A6E5A" stroke-width="1"/>
  <line x1="708" y1="216" x2="708" y2="274" stroke="#7A6E5A" stroke-width="1"/>
  <line x1="757" y1="216" x2="757" y2="274" stroke="#7A6E5A" stroke-width="1"/>

  <line x1="634" y1="274" x2="634" y2="332" stroke="#7A6E5A" stroke-width="1"/>
  <line x1="683" y1="274" x2="683" y2="332" stroke="#7A6E5A" stroke-width="1"/>
  <line x1="732" y1="274" x2="732" y2="332" stroke="#7A6E5A" stroke-width="1"/>

  <!-- Hollow core indication -->
  <rect x="620" y="105" width="28" height="48" fill="#C8B8A8" stroke="#7A6E5A" stroke-width="1" rx="1"/>
  <rect x="670" y="105" width="28" height="48" fill="#C8B8A8" stroke="#7A6E5A" stroke-width="1" rx="1"/>
  <rect x="720" y="105" width="28" height="48" fill="#C8B8A8" stroke="#7A6E5A" stroke-width="1" rx="1"/>

  <!-- Foundation -->
  <rect x="605" y="390" width="158" height="30" fill="#9A8A7A" stroke="#4A4A4A" stroke-width="1.5" rx="2"/>
  <text x="684" y="410" text-anchor="middle" font-family="system-ui" font-size="8" fill="white">Base de hormigón</text>

  <!-- Top finish -->
  <rect x="610" y="96" width="148" height="8" fill="#8A7A6A" stroke="#4A4A4A" stroke-width="1" rx="1"/>
  <text x="682" y="470" text-anchor="middle" font-family="system-ui" font-size="9" fill="#6B6B6B">Bloques huecos de hormigón</text>
  <text x="682" y="483" text-anchor="middle" font-family="system-ui" font-size="9" fill="#6B6B6B">Máxima resistencia</text>
</svg>
