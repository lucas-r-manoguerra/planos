<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" fill="none">
  <rect width="600" height="500" fill="#FAF9F6" rx="8"/>
  <text x="300" y="30" text-anchor="middle" font-family="system-ui" font-size="15" font-weight="bold" fill="#1A1A1A">Capas de Pintura — Corte Horizontal</text>

  <!-- Direction arrow -->
  <text x="60" y="215" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="bold" fill="#6B6B6B">MURO</text>
  <polygon points="85,205 95,215 85,225" fill="#6B6B6B"/>
  <line x1="70" y1="215" x2="85" y2="215" stroke="#6B6B6B" stroke-width="1.5"/>

  <text x="540" y="215" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="bold" fill="#6B6B6B">SUPERFICIE</text>
  <line x1="505" y1="215" x2="520" y2="215" stroke="#6B6B6B" stroke-width="1.5"/>
  <polygon points="520,205 530,215 520,225" fill="#6B6B6B"/>

  <!-- ============================================ -->
  <!-- LAYER 1: Pared (mampostería/hormigón) -->
  <!-- ============================================ -->
  <rect x="105" y="70" width="130" height="290" fill="#B8C0C8" stroke="#7A828A" stroke-width="2" rx="2"/>

  <!-- Vertical texture lines inside wall -->
  <line x1="125" y1="80" x2="125" y2="350" stroke="#A0A8B0" stroke-width="1" stroke-dasharray="3,5"/>
  <line x1="150" y1="80" x2="150" y2="350" stroke="#A0A8B0" stroke-width="1" stroke-dasharray="3,5"/>
  <line x1="175" y1="80" x2="175" y2="350" stroke="#A0A8B0" stroke-width="1" stroke-dasharray="3,5"/>
  <line x1="200" y1="80" x2="200" y2="350" stroke="#A0A8B0" stroke-width="1" stroke-dasharray="3,5"/>
  <line x1="225" y1="80" x2="225" y2="350" stroke="#A0A8B0" stroke-width="1" stroke-dasharray="3,5"/>

  <!-- ============================================ -->
  <!-- LAYER 2: Revoque -->
  <!-- ============================================ -->
  <rect x="235" y="70" width="35" height="290" fill="#D4C5B5" stroke="#A0896A" stroke-width="2" rx="1"/>

  <!-- Coarse texture dots -->
  <circle cx="248" cy="95" r="2" fill="#B8A99A" opacity="0.6"/>
  <circle cx="260" cy="130" r="2.5" fill="#B8A99A" opacity="0.6"/>
  <circle cx="245" cy="170" r="2" fill="#B8A99A" opacity="0.6"/>
  <circle cx="258" cy="210" r="3" fill="#B8A99A" opacity="0.6"/>
  <circle cx="248" cy="260" r="2" fill="#B8A99A" opacity="0.6"/>
  <circle cx="262" cy="310" r="2.5" fill="#B8A99A" opacity="0.6"/>

  <!-- ============================================ -->
  <!-- LAYER 3: Enduido / Plaste -->
  <!-- ============================================ -->
  <rect x="270" y="70" width="22" height="290" fill="#EDE8E2" stroke="#C4BDB5" stroke-width="2" rx="1"/>

  <!-- Smooth surface hints -->
  <line x1="275" y1="110" x2="288" y2="110" stroke="#D5D0C8" stroke-width="0.8"/>
  <line x1="275" y1="180" x2="288" y2="180" stroke="#D5D0C8" stroke-width="0.8"/>
  <line x1="275" y1="250" x2="288" y2="250" stroke="#D5D0C8" stroke-width="0.8"/>
  <line x1="275" y1="320" x2="288" y2="320" stroke="#D5D0C8" stroke-width="0.8"/>

  <!-- ============================================ -->
  <!-- LAYER 4: Imprimación (sealer) -->
  <!-- ============================================ -->
  <rect x="292" y="70" width="16" height="290" fill="#B3D9F2" stroke="#7BAFD4" stroke-width="2" rx="1"/>

  <!-- ============================================ -->
  <!-- LAYER 5: Pintura (2 manos) -->
  <!-- ============================================ -->
  <rect x="308" y="70" width="22" height="290" fill="#8DB580" stroke="#6B9E60" stroke-width="2" rx="1"/>

  <!-- Subtle split between two coats -->
  <line x1="308" y1="215" x2="330" y2="215" stroke="#6B9E60" stroke-width="1" stroke-dasharray="3,3" opacity="0.7"/>

  <!-- ============================================ -->
  <!-- LABELS WITH ARROWS (below) -->
  <!-- ============================================ -->

  <!-- Layer 1: Pared -->
  <line x1="170" y1="365" x2="170" y2="400" stroke="#7A828A" stroke-width="1.5"/>
  <polygon points="170,400 165,392 175,392" fill="#7A828A"/>
  <text x="170" y="414" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="bold" fill="#1A1A1A">Pared / Revoque</text>
  <text x="170" y="428" text-anchor="middle" font-family="system-ui" font-size="9" fill="#6B6B6B">mampostería + revoque</text>

  <!-- Layer 2: Revoque -->
  <line x1="252" y1="365" x2="252" y2="385" stroke="#A0896A" stroke-width="1.5"/>
  <polygon points="252,385 247,377 257,377" fill="#A0896A"/>
  <text x="252" y="399" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="bold" fill="#1A1A1A">Revoque</text>

  <!-- Layer 3: Enduido / Plaste -->
  <line x1="281" y1="365" x2="281" y2="385" stroke="#C4BDB5" stroke-width="1.5"/>
  <polygon points="281,385 276,377 286,377" fill="#C4BDB5"/>
  <text x="281" y="399" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="bold" fill="#1A1A1A">Enduido / Plaste</text>

  <!-- Layer 4: Imprimación -->
  <line x1="300" y1="365" x2="300" y2="410" stroke="#7BAFD4" stroke-width="1.5"/>
  <polygon points="300,410 295,402 305,402" fill="#7BAFD4"/>
  <text x="300" y="424" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="bold" fill="#1A1A1A">Imprimación</text>
  <text x="300" y="437" text-anchor="middle" font-family="system-ui" font-size="9" fill="#6B6B6B">(sealer)</text>

  <!-- Layer 5: Pintura -->
  <line x1="319" y1="365" x2="319" y2="410" stroke="#6B9E60" stroke-width="1.5"/>
  <polygon points="319,410 314,402 324,402" fill="#6B9E60"/>
  <text x="319" y="424" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="bold" fill="#1A1A1A">Pintura</text>
  <text x="319" y="437" text-anchor="middle" font-family="system-ui" font-size="9" fill="#6B6B6B">(2 manos)</text>

  <!-- ============================================ -->
  <!-- TOOLS SECTION (bottom) -->
  <!-- ============================================ -->
  <line x1="30" y1="458" x2="570" y2="458" stroke="#E0DDD6" stroke-width="1"/>

  <!-- Tool 1: Cinta de enmascarar -->
  <g transform="translate(100, 468)">
    <!-- Tape roll -->
    <circle cx="0" cy="0" r="14" fill="none" stroke="#2D2D2D" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="6" fill="none" stroke="#2D2D2D" stroke-width="1"/>
    <!-- Tape strip coming off -->
    <path d="M10 -10 Q18 -8 20 -2 Q22 4 18 8" stroke="#2D2D2D" stroke-width="1.2" fill="none"/>
    <path d="M10 -10 Q18 -8 20 -2 Q22 4 18 8" stroke="#E8D5B7" stroke-width="0.5" fill="none"/>
    <text x="0" y="24" text-anchor="middle" font-family="system-ui" font-size="9" font-weight="bold" fill="#1A1A1A">Cinta de</text>
    <text x="0" y="35" text-anchor="middle" font-family="system-ui" font-size="9" font-weight="bold" fill="#1A1A1A">enmascarar</text>
  </g>

  <!-- Tool 2: Rodillo -->
  <g transform="translate(300, 468)">
    <!-- Roller frame -->
    <rect x="-20" y="-10" width="40" height="16" fill="#8DB580" stroke="#2D2D2D" stroke-width="1.5" rx="3"/>
    <!-- Handle -->
    <rect x="-3" y="6" width="6" height="20" fill="#8B6914" stroke="#2D2D2D" stroke-width="1" rx="1"/>
    <!-- Grip -->
    <rect x="-4" y="20" width="8" height="8" fill="#2D2D2D" stroke="none" rx="2"/>
    <text x="0" y="39" text-anchor="middle" font-family="system-ui" font-size="9" font-weight="bold" fill="#1A1A1A">Rodillo</text>
  </g>

  <!-- Tool 3: Bandeja -->
  <g transform="translate(500, 468)">
    <!-- Tray -->
    <path d="M-22 -6 L-18 10 L18 10 L22 -6 Z" fill="#D5D5D5" stroke="#2D2D2D" stroke-width="1.5"/>
    <!-- Paint in tray -->
    <path d="M-16 -2 L-18 10 L18 10 L16 -2 Z" fill="#8DB580" opacity="0.6"/>
    <!-- Ramp line -->
    <line x1="-22" y1="-6" x2="-18" y2="10" stroke="#2D2D2D" stroke-width="1" opacity="0.4"/>
    <text x="0" y="22" text-anchor="middle" font-family="system-ui" font-size="9" font-weight="bold" fill="#1A1A1A">Bandeja</text>
  </g>
</svg>
