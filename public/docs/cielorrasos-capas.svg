<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" fill="#FAF9F6" rx="8"/>
  <text x="400" y="28" text-anchor="middle" font-family="system-ui" font-size="15" font-weight="bold" fill="#1A1A1A">Corte de Cielorraso de Durlock</text>

  <!-- === CROSS-SECTION: LEFT-TO-RIGHT layers === -->
  <!-- Each layer spans x=60 to x=600, stacked vertically -->

  <!-- 1. Structure / Losa (top layer) -->
  <rect x="60" y="55" width="540" height="35" fill="#A8B5A0" stroke="#8A9A80" stroke-width="2" rx="2"/>
  <line x1="80" y1="60" x2="80" y2="85" stroke="#8A9A80" stroke-width="0.8"/>
  <line x1="140" y1="60" x2="140" y2="85" stroke="#8A9A80" stroke-width="0.8"/>
  <line x1="200" y1="60" x2="200" y2="85" stroke="#8A9A80" stroke-width="0.8"/>
  <line x1="260" y1="60" x2="260" y2="85" stroke="#8A9A80" stroke-width="0.8"/>
  <line x1="320" y1="60" x2="320" y2="85" stroke="#8A9A80" stroke-width="0.8"/>
  <line x1="380" y1="60" x2="380" y2="85" stroke="#8A9A80" stroke-width="0.8"/>
  <line x1="440" y1="60" x2="440" y2="85" stroke="#8A9A80" stroke-width="0.8"/>
  <line x1="500" y1="60" x2="500" y2="85" stroke="#8A9A80" stroke-width="0.8"/>
  <line x1="560" y1="60" x2="560" y2="85" stroke="#8A9A80" stroke-width="0.8"/>

  <!-- Numbered circle 1 -->
  <circle cx="670" cy="72" r="11" fill="#8A9A80"/>
  <text x="670" y="76" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="bold" fill="#FFF">1</text>

  <!-- Space between losa and placa (cámara de aire / installations) -->
  <rect x="60" y="90" width="540" height="80" fill="#F0EFE8" stroke="#D8D6CC" stroke-width="1.5" rx="2"/>

  <!-- Cable /installation within the space -->
  <path d="M80 120 Q120 110 160 125 Q200 135 240 120 Q280 110 320 125" stroke="#4A90D9" stroke-width="2.5" fill="none"/>
  <path d="M360 115 Q400 108 440 120 Q480 130 520 115" stroke="#D9823B" stroke-width="2.5" fill="none"/>
  <!-- Conducto -->
  <rect x="200" y="140" width="120" height="18" fill="#D0D0D0" stroke="#A0A0A0" stroke-width="1.5" rx="3"/>

  <!-- 2. Aislación térmica (lana de vidrio/roca) -->
  <rect x="60" y="90" width="540" height="40" fill="#B8D4B0" stroke="#8CB880" stroke-width="1.5" rx="1" opacity="0.9"/>
  <!-- Fibrous texture -->
  <path d="M70 95 Q80 100 90 95 Q100 90 110 95" stroke="#8CB880" stroke-width="0.6" fill="none"/>
  <path d="M130 95 Q140 100 150 95 Q160 90 170 95" stroke="#8CB880" stroke-width="0.6" fill="none"/>
  <path d="M200 95 Q210 100 220 95 Q230 90 240 95" stroke="#8CB880" stroke-width="0.6" fill="none"/>
  <path d="M280 95 Q290 100 300 95 Q310 90 320 95" stroke="#8CB880" stroke-width="0.6" fill="none"/>
  <path d="M370 95 Q380 100 390 95 Q400 90 410 95" stroke="#8CB880" stroke-width="0.6" fill="none"/>
  <path d="M450 95 Q460 100 470 95 Q480 90 490 95" stroke="#8CB880" stroke-width="0.6" fill="none"/>
  <path d="M520 95 Q530 100 540 95 Q550 90 560 95" stroke="#8CB880" stroke-width="0.6" fill="none"/>
  <path d="M100 115 Q110 120 120 115 Q130 110 140 115" stroke="#8CB880" stroke-width="0.6" fill="none"/>
  <path d="M220 115 Q230 120 240 115 Q250 110 260 115" stroke="#8CB880" stroke-width="0.6" fill="none"/>
  <path d="M340 115 Q350 120 360 115 Q370 110 380 115" stroke="#8CB880" stroke-width="0.6" fill="none"/>
  <path d="M480 115 Q490 120 500 115 Q510 110 520 115" stroke="#8CB880" stroke-width="0.6" fill="none"/>

  <!-- Numbered circle 2 -->
  <circle cx="670" cy="110" r="11" fill="#8CB880"/>
  <text x="670" y="114" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="bold" fill="#FFF">2</text>

  <!-- 3. Perfil montante (C-shaped galvanized) — shown in cross-section -->
  <!-- Vertical web of C profile -->
  <rect x="150" y="170" width="6" height="60" fill="#6B7B8D" rx="1"/>
  <!-- Top flange of C -->
  <rect x="140" y="170" width="26" height="5" fill="#6B7B8D" rx="1"/>
  <!-- Bottom flange of C -->
  <rect x="140" y="225" width="26" height="5" fill="#6B7B8D" rx="1"/>
  <!-- Second montante -->
  <rect x="400" y="170" width="6" height="60" fill="#6B7B8D" rx="1"/>
  <rect x="390" y="170" width="26" height="5" fill="#6B7B8D" rx="1"/>
  <rect x="390" y="225" width="26" height="5" fill="#6B7B8D" rx="1"/>

  <!-- Tirante / suspension wire -->
  <line x1="153" y1="130" x2="153" y2="170" stroke="#6B7B8D" stroke-width="1.5"/>
  <line x1="403" y1="130" x2="403" y2="170" stroke="#6B7B8D" stroke-width="1.5"/>

  <!-- Numbered circle 3 -->
  <circle cx="670" cy="200" r="11" fill="#6B7B8D"/>
  <text x="670" y="204" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="bold" fill="#FFF">3</text>

  <!-- 4. Placa de yeso (durlock) — 12.5mm cross-section -->
  <rect x="60" y="230" width="540" height="30" fill="#F5F5F0" stroke="#D0CCC4" stroke-width="2" rx="1"/>
  <!-- Core texture (yeso) -->
  <line x1="80" y1="235" x2="80" y2="255" stroke="#E8E6DC" stroke-width="0.8"/>
  <line x1="160" y1="235" x2="160" y2="255" stroke="#E8E6DC" stroke-width="0.8"/>
  <line x1="240" y1="235" x2="240" y2="255" stroke="#E8E6DC" stroke-width="0.8"/>
  <line x1="320" y1="235" x2="320" y2="255" stroke="#E8E6DC" stroke-width="0.8"/>
  <line x1="400" y1="235" x2="400" y2="255" stroke="#E8E6DC" stroke-width="0.8"/>
  <line x1="480" y1="235" x2="480" y2="255" stroke="#E8E6DC" stroke-width="0.8"/>
  <line x1="560" y1="235" x2="560" y2="255" stroke="#E8E6DC" stroke-width="0.8"/>

  <!-- Tornillo fijando placa a perfil montante -->
  <line x1="153" y1="170" x2="153" y2="260" stroke="#999" stroke-width="2"/>
  <line x1="148" y1="255" x2="158" y2="260" stroke="#999" stroke-width="1.5"/>
  <line x1="148" y1="260" x2="158" y2="255" stroke="#999" stroke-width="1.5"/>

  <!-- Numbered circle 4 -->
  <circle cx="670" cy="245" r="11" fill="#D0CCC4"/>
  <text x="670" y="249" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="bold" fill="#555">4</text>

  <!-- 5. Cinta de junta + enduido sobre la junta entre placas -->
  <!-- Junta entre dos placas -->
  <line x1="330" y1="230" x2="330" y2="260" stroke="#CCC" stroke-width="0.5"/>
  <!-- Enduido sobre la junta (forma convexa) -->
  <path d="M315 258 Q330 248 345 258" fill="#E8E0D0" stroke="#D5CBB5" stroke-width="1.5"/>
  <!-- Cinta de papel dentro del enduido -->
  <line x1="320" y1="254" x2="340" y2="254" stroke="#D0C8B0" stroke-width="1.5"/>

  <!-- Numbered circle 5 -->
  <circle cx="670" cy="295" r="11" fill="#E8E0D0"/>
  <text x="670" y="299" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="bold" fill="#8A7A60">5</text>

  <!-- 6. Pintura (thin layer at bottom) -->
  <rect x="60" y="260" width="540" height="4" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="0.5" rx="1"/>

  <!-- Numbered circle 6 -->
  <circle cx="670" cy="325" r="11" fill="#E0E0E0"/>
  <text x="670" y="329" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="bold" fill="#555">6</text>

  <!-- === LABELS (right side) — connecting lines from numbered circles === -->
  <!-- Label 1 -->
  <line x1="681" y1="72" x2="710" y2="72" stroke="#8A9A80" stroke-width="1"/>
  <text x="715" y="70" font-family="system-ui" font-size="10" font-weight="bold" fill="#555">Estructura / Losa</text>
  <text x="715" y="82" font-family="system-ui" font-size="9" fill="#888">Hormigón armado</text>

  <!-- Label 2 -->
  <line x1="681" y1="110" x2="710" y2="110" stroke="#8CB880" stroke-width="1"/>
  <text x="715" y="108" font-family="system-ui" font-size="10" font-weight="bold" fill="#555">Aislación térmica</text>
  <text x="715" y="120" font-family="system-ui" font-size="9" fill="#888">Lana de vidrio / roca — 5-10 cm</text>

  <!-- Label 3 -->
  <line x1="681" y1="200" x2="710" y2="200" stroke="#6B7B8D" stroke-width="1"/>
  <text x="715" y="198" font-family="system-ui" font-size="10" font-weight="bold" fill="#555">Perfil montante</text>
  <text x="715" y="210" font-family="system-ui" font-size="9" fill="#888">Acero galvanizado — perfil C</text>

  <!-- Label 4 -->
  <line x1="681" y1="245" x2="710" y2="245" stroke="#D0CCC4" stroke-width="1"/>
  <text x="715" y="243" font-family="system-ui" font-size="10" font-weight="bold" fill="#555">Placa de yeso</text>
  <text x="715" y="255" font-family="system-ui" font-size="9" fill="#888">Durlock 12,5 mm</text>

  <!-- Label 5 -->
  <line x1="681" y1="295" x2="710" y2="295" stroke="#D5CBB5" stroke-width="1"/>
  <text x="715" y="293" font-family="system-ui" font-size="10" font-weight="bold" fill="#555">Junta + Enduido</text>
  <text x="715" y="305" font-family="system-ui" font-size="9" fill="#888">Cinta de papel + 3 manos de enduido</text>

  <!-- Label 6 -->
  <line x1="681" y1="325" x2="710" y2="325" stroke="#CCC" stroke-width="1"/>
  <text x="715" y="323" font-family="system-ui" font-size="10" font-weight="bold" fill="#555">Pintura</text>
  <text x="715" y="335" font-family="system-ui" font-size="9" fill="#888">Látex mate para techos</text>

  <!-- === ADDITIONAL DETAILS on the left side === -->

  <!-- Solapa perimetral (wall angle) — shown on left edge -->
  <rect x="55" y="170" width="8" height="90" fill="#6B7B8D" rx="1"/>
  <text x="30" y="220" text-anchor="middle" font-family="system-ui" font-size="9" fill="#888" transform="rotate(-90, 30, 220)">Solapa perimetral (perfil U)</text>

  <!-- Dotted arrow showing space for installations -->
  <!--
  <line x1="630" y1="100" x2="630" y2="140" stroke="#999" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="635" y="125" font-family="system-ui" font-size="9" fill="#888">Cámara de aire</text>
  -->

  <!-- === DIMENSION / SPACER NOTES === -->
  <line x1="60" y1="370" x2="60" y2="390" stroke="#CCC" stroke-width="1"/>
  <line x1="600" y1="370" x2="600" y2="390" stroke="#CCC" stroke-width="1"/>
  <line x1="60" y1="383" x2="600" y2="383" stroke="#CCC" stroke-width="1"/>
  <polygon points="60,380 65,383 60,386" fill="#CCC"/>
  <polygon points="600,380 595,383 600,386" fill="#CCC"/>
  <text x="330" y="393" text-anchor="middle" font-family="system-ui" font-size="9" fill="#888">Corte lateral — cielorraso de durlock con aislación térmica</text>

  <!-- === DIMENSION ARROWS for placa thickness === -->
  <line x1="45" y1="230" x2="35" y2="230" stroke="#CCC" stroke-width="1"/>
  <line x1="45" y1="260" x2="35" y2="260" stroke="#CCC" stroke-width="1"/>
  <line x1="40" y1="230" x2="40" y2="260" stroke="#CCC" stroke-width="1"/>
  <polygon points="37,230 43,230 40,227" fill="#CCC"/>
  <polygon points="37,260 43,260 40,263" fill="#CCC"/>
  <text x="20" y="248" font-family="system-ui" font-size="8" fill="#888">12,5 mm</text>

  <!-- === LEGEND BOX === -->
  <rect x="60" y="400" width="540" height="35" fill="#F8F6F2" stroke="#E0DDD6" stroke-width="1" rx="4"/>
  <text x="75" y="415" font-family="system-ui" font-size="9" fill="#888">① Losa hormigón</text>
  <text x="185" y="415" font-family="system-ui" font-size="9" fill="#888">② Aislación térmica</text>
  <text x="305" y="415" font-family="system-ui" font-size="9" fill="#888">③ Perfil montante (C)</text>
  <text x="425" y="415" font-family="system-ui" font-size="9" fill="#888">④ Placa yeso 12,5 mm</text>
  <text x="75" y="428" font-family="system-ui" font-size="9" fill="#888">⑤ Cinta + enduido</text>
  <text x="185" y="428" font-family="system-ui" font-size="9" fill="#888">⑥ Pintura látex mate</text>
</svg>
