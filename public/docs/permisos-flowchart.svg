<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#FAF9F6" rx="8"/>
  <text x="400" y="30" text-anchor="middle" font-family="system-ui" font-size="15" font-weight="bold" fill="#1A1A1A">Proceso de Permisos de Construcción</text>
  <text x="400" y="48" text-anchor="middle" font-family="system-ui" font-size="11" fill="#6B6B6B">Pasos para obtener el permiso de obra en Argentina</text>

  <!-- Row 1: Steps 1-4 -->
  <!-- Step 1 -->
  <rect x="25" y="70" width="160" height="50" fill="#E8F0FA" stroke="#3B65A3" stroke-width="1.5" rx="8"/>
  <text x="105" y="92" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="bold" fill="#1B3A5C">1. Consulta Previa</text>
  <text x="105" y="108" text-anchor="middle" font-family="system-ui" font-size="9" fill="#5A5A5A">Ver normativa municipal</text>

  <!-- Arrow 1→2 -->
  <line x1="185" y1="95" x2="225" y2="95" stroke="#3B65A3" stroke-width="1.5"/>
  <polygon points="225,95 215,89 215,101" fill="#3B65A3"/>

  <!-- Step 2 -->
  <rect x="225" y="70" width="160" height="50" fill="#E8F0FA" stroke="#3B65A3" stroke-width="1.5" rx="8"/>
  <text x="305" y="92" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="bold" fill="#1B3A5C">2. Contratar Profesional</text>
  <text x="305" y="108" text-anchor="middle" font-family="system-ui" font-size="9" fill="#5A5A5A">Arquitecto / Ingeniero</text>

  <!-- Arrow 2→3 -->
  <line x1="385" y1="95" x2="425" y2="95" stroke="#3B65A3" stroke-width="1.5"/>
  <polygon points="425,95 415,89 415,101" fill="#3B65A3"/>

  <!-- Step 3 -->
  <rect x="425" y="70" width="170" height="50" fill="#E8F0FA" stroke="#3B65A3" stroke-width="1.5" rx="8"/>
  <text x="510" y="92" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="bold" fill="#1B3A5C">3. Preparar Documentación</text>
  <text x="510" y="108" text-anchor="middle" font-family="system-ui" font-size="9" fill="#5A5A5A">Planos, memorias, estudios</text>

  <!-- Arrow 3→4 -->
  <line x1="595" y1="95" x2="635" y2="95" stroke="#3B65A3" stroke-width="1.5"/>
  <polygon points="635,95 625,89 625,101" fill="#3B65A3"/>

  <!-- Step 4 -->
  <rect x="635" y="70" width="145" height="50" fill="#E8F0FA" stroke="#3B65A3" stroke-width="1.5" rx="8"/>
  <text x="707" y="92" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="bold" fill="#1B3A5C">4. Presentar</text>
  <text x="707" y="108" text-anchor="middle" font-family="system-ui" font-size="9" fill="#5A5A5A">En Municipalidad</text>

  <!-- Arrow 4→5 (down) -->
  <line x1="707" y1="120" x2="707" y2="160" stroke="#3B65A3" stroke-width="1.5"/>
  <polygon points="707,160 701,150 713,150" fill="#3B65A3"/>

  <!-- Step 5 -->
  <rect x="605" y="160" width="195" height="55" fill="#FFF3E0" stroke="#D4883A" stroke-width="1.5" rx="8"/>
  <text x="702" y="183" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="bold" fill="#8B5E1A">5. Revisión Técnica</text>
  <text x="702" y="198" text-anchor="middle" font-family="system-ui" font-size="9" fill="#5A5A5A">15 – 60 días hábiles</text>
  <text x="702" y="211" text-anchor="middle" font-family="system-ui" font-size="9" fill="#5A5A5A">(según complejidad)</text>

  <!-- Decision diamond: ¿Correcciones? -->
  <polygon points="490,187 560,235 490,283 420,235" fill="#FFF8E0" stroke="#D4883A" stroke-width="1.5"/>
  <text x="490" y="232" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="bold" fill="#8B5E1A">¿Correcciones</text>
  <text x="490" y="247" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="bold" fill="#8B5E1A">necesarias?</text>

  <!-- Arrow 5 → Diamond -->
  <line x1="605" y1="187" x2="560" y2="187" stroke="#3B65A3" stroke-width="1.5"/>
  <polygon points="560,187 570,181 570,193" fill="#3B65A3"/>

  <!-- "Sí" branch: Diamond → Step 3 (loop back) -->
  <line x1="420" y1="235" x1="420" y1="235" x2="380" y2="235" stroke="#C0392B" stroke-width="1.5"/>
  <line x1="380" y1="235" x2="380" y2="95" stroke="#C0392B" stroke-width="1.5"/>
  <line x1="380" y1="95" x2="425" y2="95" stroke="#C0392B" stroke-width="1.5"/>
  <polygon points="425,95 415,89 415,101" fill="#C0392B"/>
  <text x="395" y="170" text-anchor="end" font-family="system-ui" font-size="10" font-weight="bold" fill="#C0392B">Sí</text>

  <!-- "No" branch: Diamond → Step 6 -->
  <line x1="490" y1="283" x2="490" y2="330" stroke="#1B6B3A" stroke-width="1.5"/>
  <polygon points="490,330 484,320 496,320" fill="#1B6B3A"/>
  <text x="505" y="315" text-anchor="start" font-family="system-ui" font-size="10" font-weight="bold" fill="#1B6B3A">No</text>

  <!-- Step 6 -->
  <rect x="395" y="330" width="190" height="50" fill="#E0F5E0" stroke="#1B6B3A" stroke-width="1.5" rx="8"/>
  <text x="490" y="352" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="bold" fill="#1B6B3A">6. Aprobación</text>
  <text x="490" y="370" text-anchor="middle" font-family="system-ui" font-size="10" fill="#2D2D2D">Permiso de obra otorgado</text>

  <!-- Arrow 6→7 -->
  <line x1="490" y1="380" x2="490" y2="420" stroke="#1B6B3A" stroke-width="1.5"/>
  <polygon points="490,420 484,410 496,410" fill="#1B6B3A"/>

  <!-- Step 7 -->
  <rect x="380" y="420" width="220" height="55" fill="#E0F5E0" stroke="#1B6B3A" stroke-width="1.5" rx="10"/>
  <text x="490" y="443" text-anchor="middle" font-family="system-ui" font-size="13" font-weight="bold" fill="#1B6B3A">7. Inicio de Obra</text>
  <text x="490" y="460" text-anchor="middle" font-family="system-ui" font-size="10" fill="#2D2D2D">Colocar cartel de obra visible</text>
  <text x="490" y="473" text-anchor="middle" font-family="system-ui" font-size="9" fill="#5A5A5A">Notificar inspección municipal</text>

  <!-- Note box -->
  <rect x="25" y="160" width="220" height="70" fill="#FFF0F0" stroke="#C0392B" stroke-width="1" rx="6" stroke-dasharray="4,3"/>
  <text x="135" y="182" text-anchor="middle" font-family="system-ui" font-size="10" font-weight="bold" fill="#C0392B">Importante</text>
  <text x="35" y="198" font-family="system-ui" font-size="9" fill="#5A5A5A">No iniciar obras sin permiso.</text>
  <text x="35" y="214" font-family="system-ui" font-size="9" fill="#5A5A5A">Multas de hasta 10x la tasa municipal.</text>
</svg>