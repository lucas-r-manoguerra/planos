<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#FAF9F6" rx="8"/>
  <text x="400" y="28" text-anchor="middle" font-family="system-ui" font-size="16" font-weight="bold" fill="#1A1A1A">Corte de Viga de Hormigón Armado</text>

  <!-- Viga (rectángulo principal de hormigón) -->
  <rect x="200" y="90" width="400" height="300" fill="#A8B5A0" stroke="#2D2D2D" stroke-width="2" rx="2"/>

  <!-- Recubrimiento (línea punteada a 25px del borde) -->
  <rect x="225" y="115" width="350" height="250" fill="none" stroke="#6B6B6B" stroke-width="1.5" stroke-dasharray="6,4" rx="1"/>

  <!-- Barras longitudinales (4 barras Ø12 en esquinas) -->
  <!-- Inferior izquierda -->
  <circle cx="250" cy="350" r="12" fill="#8B4513" stroke="#5C2E0A" stroke-width="1.5"/>
  <circle cx="250" cy="350" r="6" fill="#A0522D" stroke="none"/>
  <!-- Inferior derecha -->
  <circle cx="550" cy="350" r="12" fill="#8B4513" stroke="#5C2E0A" stroke-width="1.5"/>
  <circle cx="550" cy="350" r="6" fill="#A0522D" stroke="none"/>
  <!-- Superior izquierda -->
  <circle cx="250" cy="130" r="12" fill="#8B4513" stroke="#5C2E0A" stroke-width="1.5"/>
  <circle cx="250" cy="130" r="6" fill="#A0522D" stroke="none"/>
  <!-- Superior derecha -->
  <circle cx="550" cy="130" r="12" fill="#8B4513" stroke="#5C2E0A" stroke-width="1.5"/>
  <circle cx="550" cy="130" r="6" fill="#A0522D" stroke="none"/>

  <!-- Estribos (cuadrados alrededor de las barras) -->
  <!-- Estribo 1 -->
  <rect x="235" y="115" width="330" height="250" fill="none" stroke="#8B4513" stroke-width="2" rx="1"/>
  <!-- Estribo 2 -->
  <rect x="310" y="115" width="330" height="250" fill="none" stroke="#8B4513" stroke-width="2" rx="1"/>
  <!-- Estribo 3 -->
  <rect x="385" y="115" width="330" height="250" fill="none" stroke="#8B4513" stroke-width="2" rx="1"/>
  <!-- Estribo 4 -->
  <rect x="460" y="115" width="330" height="250" fill="none" stroke="#8B4513" stroke-width="2" rx="1"/>

  <!-- Etiqueta: Armadura longitudinal -->
  <line x1="562" y1="350" x2="660" y2="350" stroke="#2D2D2D" stroke-width="1.5"/>
  <polygon points="660,350 650,345 650,355" fill="#2D2D2D"/>
  <text x="665" y="346" font-family="system-ui" font-size="11" font-weight="bold" fill="#1A1A1A">Armadura longitudinal</text>
  <text x="665" y="360" font-family="system-ui" font-size="10" fill="#6B6B6B">Ø 12 mm — ADN 420</text>

  <!-- Etiqueta: Estribo -->
  <line x1="403" y1="115" x2="403" y2="58" stroke="#2D2D2D" stroke-width="1.5"/>
  <polygon points="403,58 398,68 408,68" fill="#2D2D2D"/>
  <text x="403" y="52" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="bold" fill="#1A1A1A">Estribo</text>
  <text x="403" y="38" text-anchor="middle" font-family="system-ui" font-size="10" fill="#6B6B6B">Ø 6 mm c/20 cm</text>

  <!-- Etiqueta: Recubrimiento -->
  <line x1="225" y1="120" x2="100" y2="160" stroke="#2D2D2D" stroke-width="1.5"/>
  <polygon points="100,160 114,155 110,168" fill="#2D2D2D"/>
  <text x="90" y="178" text-anchor="end" font-family="system-ui" font-size="11" font-weight="bold" fill="#1A1A1A">Recubrimiento</text>
  <text x="90" y="192" text-anchor="end" font-family="system-ui" font-size="10" fill="#6B6B6B">3 cm mínimo</text>

  <!-- Etiqueta: Hormigón -->
  <line x1="380" y1="280" x2="280" y2="280" stroke="#2D2D2D" stroke-width="1.5"/>
  <polygon points="280,280 290,275 290,285" fill="#2D2D2D"/>
  <text x="275" y="276" text-anchor="end" font-family="system-ui" font-size="11" font-weight="bold" fill="#1A1A1A">Hormigón H-21</text>
  <text x="275" y="290" text-anchor="end" font-family="system-ui" font-size="10" fill="#6B6B6B">f'c = 21 MPa</text>

  <!-- Línea de cota para recubrimiento (flecha doble) -->
  <line x1="200" y1="390" x2="200" y2="420" stroke="#2D2D2D" stroke-width="1"/>
  <line x1="195" y1="420" x2="225" y2="420" stroke="#2D2D2D" stroke-width="0.8"/>
  <line x1="225" y1="390" x2="225" y2="420" stroke="#2D2D2D" stroke-width="1"/>
  <polygon points="200,390 196,397 204,397" fill="#2D2D2D"/>
  <polygon points="225,390 221,397 229,397" fill="#2D2D2D"/>

  <!-- Línea de cota ancho viga -->
  <line x1="200" y1="430" x2="600" y2="430" stroke="#2D2D2D" stroke-width="1"/>
  <line x1="200" y1="425" x2="200" y2="435" stroke="#2D2D2D" stroke-width="1"/>
  <line x1="600" y1="425" x2="600" y2="435" stroke="#2D2D2D" stroke-width="1"/>
  <polygon points="200,430 210,426 210,434" fill="#2D2D2D"/>
  <polygon points="600,430 590,426 590,434" fill="#2D2D2D"/>
  <text x="400" y="445" text-anchor="middle" font-family="system-ui" font-size="10" fill="#6B6B6B">400 mm</text>

  <!-- Línea de cota alto viga -->
  <line x1="610" y1="90" x2="640" y2="90" stroke="#2D2D2D" stroke-width="1"/>
  <line x1="610" y1="390" x2="640" y2="390" stroke="#2D2D2D" stroke-width="1"/>
  <line x1="640" y1="90" x2="640" y2="390" stroke="#2D2D2D" stroke-width="1"/>
  <polygon points="640,90 634,100 646,100" fill="#2D2D2D"/>
  <polygon points="640,390 634,380 646,380" fill="#2D2D2D"/>
  <text x="655" y="245" text-anchor="middle" font-family="system-ui" font-size="10" fill="#6B6B6B" transform="rotate(90,655,245)">300 mm</text>

  <!-- Nota inferior -->
  <text x="400" y="480" text-anchor="middle" font-family="system-ui" font-size="10" fill="#6B6B6B">Corte transversal — viga de hormigón armado</text>
</svg>
