  <circle cx="350" cy="130" r="14" fill="none" stroke="#C8B89A" stroke-width="0.8" opacity="0.7"/>
  <circle cx="350" cy="130" r="9" fill="none" stroke="#C8B89A" stroke-width="0.6" opacity="0.5"/>
  <circle cx="270" cy="170" r="10" fill="none" stroke="#C8B89A" stroke-width="0.8" opacity="0.7"/>
  <circle cx="270" cy="170" r="6" fill="none" stroke="#C8B89A" stroke-width="0.6" opacity="0.5"/>
  <circle cx="320" cy="200" r="13" fill="none" stroke="#C8B89A" stroke-width="0.8" opacity="0.7"/>
  <circle cx="320" cy="200" r="8" fill="none" stroke="#C8B89A" stroke-width="0.6" opacity="0.5"/>
  <circle cx="370" cy="170" r="11" fill="none" stroke="#C8B89A" stroke-width="0.8" opacity="0.7"/>
  <circle cx="370" cy="170" r="7" fill="none" stroke="#C8B89A" stroke-width="0.6" opacity="0.5"/>
