<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#FAF9F6" rx="8"/>
  <text x="400" y="35" text-anchor="middle" font-family="system-ui" font-size="16" font-weight="bold" fill="#1A1A1A">Jerarquía Normativa Argentina</text>
  <text x="400" y="55" text-anchor="middle" font-family="system-ui" font-size="11" fill="#6B6B6B">Pirámide de precedencia legal en construcción</text>

  <!-- Nivel 1 - Constitución Nacional (top, smallest) -->
  <polygon points="400,90 520,160 280,160" fill="#1B3A5C" stroke="#2D2D2D" stroke-width="1.5"/>
  <text x="400" y="120" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="bold" fill="#FFFFFF">Constitución</text>
  <text x="400" y="135" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="bold" fill="#FFFFFF">Nacional</text>
  <text x="400" y="150" text-anchor="middle" font-family="system-ui" font-size="9" fill="#A8C8E8">Máxima jerarquía legal</text>

  <!-- Nivel 2 - Leyes Nacionales -->
  <polygon points="400,165 580,250 220,250" fill="#2E6B9E" stroke="#2D2D2D" stroke-width="1.5"/>
  <text x="400" y="192" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="bold" fill="#FFFFFF">Leyes Nacionales / Códigos</text>
  <text x="400" y="208" text-anchor="middle" font-family="system-ui" font-size="10" fill="#C8E0F8">Código Civil y Comercial</text>
  <text x="400" y="222" text-anchor="middle" font-family="system-ui" font-size="10" fill="#C8E0F8">Código de Edificación</text>
  <text x="400" y="240" text-anchor="middle" font-family="system-ui" font-size="9" fill="#A8C8E8">Ley Nacional de Vivienda · Ley de Seguridad e Higiene</text>

  <!-- Nivel 3 - Normas IRAM / CIRSOC -->
  <polygon points="400,255 640,355 160,355" fill="#D4883A" stroke="#2D2D2D" stroke-width="1.5"/>
  <text x="400" y="285" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="bold" fill="#FFFFFF">Normas IRAM / CIRSOC</text>
  <text x="400" y="303" text-anchor="middle" font-family="system-ui" font-size="10" fill="#FFE8C8">IRAM 11654 — Aislación térmica</text>
  <text x="400" y="318" text-anchor="middle" font-family="system-ui" font-size="10" fill="#FFE8C8">CIRSOC 101 — Cargas y sobrecargas</text>
  <text x="400" y="333" text-anchor="middle" font-family="system-ui" font-size="10" fill="#FFE8C8">CIRSOC 201 — Hormigón armado</text>
  <text x="400" y="348" text-anchor="middle" font-family="system-ui" font-size="9" fill="#E8C8A0">IRAM 11603 · IRAM 11605 · CIRSOC 301 (Acero)</text>

  <!-- Nivel 4 - Normativa Municipal / Local (bottom, widest) -->
  <polygon points="400,360 700,475 100,475" fill="#F5E6D0" stroke="#2D2D2D" stroke-width="1.5"/>
  <text x="400" y="395" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="bold" fill="#2D2D2D">Normativa Municipal / Local</text>
  <text x="400" y="415" text-anchor="middle" font-family="system-ui" font-size="10" fill="#5A4A3A">Planeamiento Urbano</text>
  <text x="400" y="432" text-anchor="middle" font-family="system-ui" font-size="10" fill="#5A4A3A">Ordenanzas Municipales</text>
  <text x="400" y="449" text-anchor="middle" font-family="system-ui" font-size="10" fill="#5A4A3A">Código de Zonificación</text>
  <text x="400" y="466" text-anchor="middle" font-family="system-ui" font-size="9" fill="#8A7A6A">Reglamentaciones locales · Tasas · Permisos de obra</text>

  <!-- Side labels -->
  <text x="130" y="210" text-anchor="middle" font-family="system-ui" font-size="9" fill="#6B6B6B" transform="rotate(-90,130,210)">Mayor jerarquía</text>
  <text x="670" y="430" text-anchor="middle" font-family="system-ui" font-size="9" fill="#6B6B6B" transform="rotate(-90,670,430)">Menor jerarquía</text>

  <!-- Arrows on sides -->
  <line x1="145" y1="130" x2="145" y2="440" stroke="#6B6B6B" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="145,130 140,145 150,145" fill="#6B6B6B"/>
  <polygon points="145,440 140,425 150,425" fill="#6B6B6B"/>
</svg>