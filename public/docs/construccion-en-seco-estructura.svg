<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <rect width="800" height="600" fill="#FAF9F6" rx="8"/>
  <text x="400" y="30" text-anchor="middle" font-family="system-ui" font-size="16" font-weight="bold" fill="#1A1A1A">Estructura de Steel Framing — Corte de Tabique</text>

  <!-- ============================================ -->
  <!-- TRACKS (Soleras) -->
  <!-- ============================================ -->

  <!-- Top track / Solera superior -->
  <rect x="60" y="70" width="680" height="16" fill="#5A5A6E" stroke="#3A3A4E" stroke-width="1.5" rx="1"/>
  <!-- Inner detail showing U-channel profile -->
  <rect x="60" y="79" width="680" height="4" fill="#4A4A5E" stroke="none" rx="0"/>

  <!-- Bottom track / Solera inferior -->
  <rect x="60" y="504" width="680" height="16" fill="#5A5A6E" stroke="#3A3A4E" stroke-width="1.5" rx="1"/>
  <rect x="60" y="504" width="680" height="4" fill="#4A4A5E" stroke="none" rx="0"/>

  <!-- ============================================ -->
  <!-- INSULATION (Bay 3, between S3 and S4) -->
  <!-- ============================================ -->

  <!-- Insulation fill - Bay 3 (x=302+14=316 to x=410) -->
  <rect x="316" y="86" width="80" height="418" fill="#7BA4DB" stroke="none" rx="0" opacity="0.25"/>
  <!-- Insulation wavy lines for texture -->
  <path d="M316 100 Q336 108 356 100 Q376 92 396 100" stroke="#7BA4DB" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M316 130 Q336 138 356 130 Q376 122 396 130" stroke="#7BA4DB" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M316 160 Q336 168 356 160 Q376 152 396 160" stroke="#7BA4DB" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M316 190 Q336 198 356 190 Q376 182 396 190" stroke="#7BA4DB" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M316 220 Q336 228 356 220 Q376 212 396 220" stroke="#7BA4DB" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M316 250 Q336 258 356 250 Q376 242 396 250" stroke="#7BA4DB" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M316 280 Q336 288 356 280 Q376 272 396 280" stroke="#7BA4DB" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M316 310 Q336 318 356 310 Q376 302 396 310" stroke="#7BA4DB" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M316 340 Q336 348 356 340 Q376 332 396 340" stroke="#7BA4DB" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M316 370 Q336 378 356 370 Q376 362 396 370" stroke="#7BA4DB" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M316 400 Q336 408 356 400 Q376 392 396 400" stroke="#7BA4DB" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M316 430 Q336 438 356 430 Q376 422 396 430" stroke="#7BA4DB" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M316 460 Q336 468 356 460 Q376 452 396 460" stroke="#7BA4DB" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M316 490 Q336 498 356 490 Q376 482 396 490" stroke="#7BA4DB" stroke-width="1.5" fill="none" opacity="0.6"/>

  <!-- ============================================ -->
  <!-- STUDS (Montantes) -->
  <!-- ============================================ -->

  <!-- S1 -->
  <rect x="80" y="86" width="14" height="418" fill="#5A5A6E" stroke="#3A3A4E" stroke-width="1.5" rx="1"/>
  <rect x="84" y="86" width="3" height="418" fill="#6A6A7E" stroke="none"/>
  <!-- S2 -->
  <rect x="187" y="86" width="14" height="418" fill="#5A5A6E" stroke="#3A3A4E" stroke-width="1.5" rx="1"/>
  <rect x="191" y="86" width="3" height="418" fill="#6A6A7E" stroke="none"/>
  <!-- S3 -->
  <rect x="294" y="86" width="14" height="418" fill="#5A5A6E" stroke="#3A3A4E" stroke-width="1.5" rx="1"/>
  <rect x="298" y="86" width="3" height="418" fill="#6A6A7E" stroke="none"/>
  <!-- S4 (left window jamb) -->
  <rect x="401" y="86" width="14" height="418" fill="#5A5A6E" stroke="#3A3A4E" stroke-width="1.5" rx="1"/>
  <rect x="405" y="86" width="3" height="418" fill="#6A6A7E" stroke="none"/>
  <!-- S5 (right window jamb) -->
  <rect x="508" y="86" width="14" height="418" fill="#5A5A6E" stroke="#3A3A4E" stroke-width="1.5" rx="1"/>
  <rect x="512" y="86" width="3" height="418" fill="#6A6A7E" stroke="none"/>
  <!-- S6 -->
  <rect x="615" y="86" width="14" height="418" fill="#5A5A6E" stroke="#3A3A4E" stroke-width="1.5" rx="1"/>
  <rect x="619" y="86" width="3" height="418" fill="#6A6A7E" stroke="none"/>
  <!-- S7 -->
  <rect x="708" y="86" width="14" height="418" fill="#5A5A6E" stroke="#3A3A4E" stroke-width="1.5" rx="1"/>
  <rect x="712" y="86" width="3" height="418" fill="#6A6A7E" stroke="none"/>

  <!-- ============================================ -->
  <!-- CROSS BRACING (Arriostramiento - Bays 1 & 2) -->
  <!-- ============================================ -->

  <!-- Bay 1: x=94 to x=187 -->
  <line x1="94" y1="86" x2="187" y2="504" stroke="#6B5B4B" stroke-width="3" opacity="0.8"/>
  <line x1="94" y1="504" x2="187" y2="86" stroke="#6B5B4B" stroke-width="3" opacity="0.8"/>
  <!-- Overlap center detail -->
  <circle cx="140" cy="295" r="6" fill="#C4956A" stroke="#6B5B4B" stroke-width="1.5"/>

  <!-- Bay 2: x=201 to x=294 -->
  <line x1="201" y1="86" x2="294" y2="504" stroke="#6B5B4B" stroke-width="3" opacity="0.8"/>
  <line x1="201" y1="504" x2="294" y2="86" stroke="#6B5B4B" stroke-width="3" opacity="0.8"/>
  <circle cx="247" cy="295" r="6" fill="#C4956A" stroke="#6B5B4B" stroke-width="1.5"/>

  <!-- ============================================ -->
  <!-- WINDOW OPENING (Bay 4) -->
  <!-- ============================================ -->

  <!-- Window opening bounds -->
  <rect x="415" y="216" width="93" height="180" fill="#E8F0F8" stroke="#3A3A4E" stroke-width="1.5" rx="0"/>
  <!-- Glass panel left -->
  <rect x="418" y="219" width="40" height="174" fill="#B8D4F0" stroke="#7BA4DB" stroke-width="1" rx="0" opacity="0.7"/>
  <!-- Glass panel right -->
  <rect x="463" y="219" width="42" height="174" fill="#B8D4F0" stroke="#7BA4DB" stroke-width="1" rx="0" opacity="0.7"/>
  <!-- Glass reflection highlight -->
  <line x1="422" y1="223" x2="422" y2="260" stroke="white" stroke-width="2" opacity="0.5"/>
  <line x1="467" y1="223" x2="467" y2="260" stroke="white" stroke-width="2" opacity="0.5"/>

  <!-- Dintel / Header (warm wood tone for blocking) -->
  <rect x="401" y="196" width="121" height="20" fill="#C4956A" stroke="#8B6B4A" stroke-width="1.5" rx="1"/>
  <text x="461" y="210" text-anchor="middle" font-family="system-ui" font-size="9" font-weight="bold" fill="#4A3520">DINTEL</text>

  <!-- Window sill -->
  <rect x="401" y="396" width="121" height="16" fill="#C4956A" stroke="#8B6B4A" stroke-width="1.5" rx="1"/>

  <!-- ============================================ -->
  <!-- PLASTERBOARD LAYER (right side, partial) -->
  <!-- ============================================ -->

  <!-- Plasterboard covering the rightmost portion, with a "cutaway" diagonal edge -->
  <clipPath id="pbClip">
    <path d="M615 70 L730 70 L730 504 L615 504 Z"/>
  </clipPath>
  <g clip-path="url(#pbClip)">
    <!-- Plasterboard surface -->
    <rect x="615" y="70" width="120" height="450" fill="#D4D4DC" stroke="none" rx="0"/>
    <!-- Dot pattern for plasterboard texture -->
    <circle cx="630" cy="100" r="1.5" fill="#C0C0C8" opacity="0.5"/>
    <circle cx="650" cy="130" r="1.5" fill="#C0C0C8" opacity="0.5"/>
    <circle cx="680" cy="110" r="1.5" fill="#C0C0C8" opacity="0.5"/>
    <circle cx="710" cy="150" r="1.5" fill="#C0C0C8" opacity="0.5"/>
    <circle cx="635" cy="180" r="1.5" fill="#C0C0C8" opacity="0.5"/>
    <circle cx="665" cy="200" r="1.5" fill="#C0C0C8" opacity="0.5"/>
    <circle cx="700" cy="230" r="1.5" fill="#C0C0C8" opacity="0.5"/>
    <circle cx="625" cy="270" r="1.5" fill="#C0C0C8" opacity="0.5"/>
    <circle cx="660" cy="300" r="1.5" fill="#C0C0C8" opacity="0.5"/>
    <circle cx="690" cy="330" r="1.5" fill="#C0C0C8" opacity="0.5"/>
    <circle cx="720" cy="360" r="1.5" fill="#C0C0C8" opacity="0.5"/>
    <circle cx="640" cy="400" r="1.5" fill="#C0C0C8" opacity="0.5"/>
    <circle cx="680" cy="430" r="1.5" fill="#C0C0C8" opacity="0.5"/>
    <circle cx="710" cy="460" r="1.5" fill="#C0C0C8" opacity="0.5"/>
    <circle cx="650" cy="490" r="1.5" fill="#C0C0C8" opacity="0.5"/>
  </g>
  <!-- Cutaway edge (diagonal dashed) -->
  <line x1="615" y1="70" x2="645" y2="504" stroke="#8A8A9A" stroke-width="2" stroke-dasharray="8,5"/>
  <line x1="615" y1="70" x2="615" y2="504" stroke="#8A8A9A" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>

  <!-- ============================================ -->
  <!-- SPACING INDICATOR (@ 40cm) -->
  <!-- ============================================ -->

  <!-- Dimension line between S2 and S3 (x=194 to x=301) -->
  <line x1="194" y1="55" x2="194" y2="62" stroke="#2D2D2D" stroke-width="1.5"/>
  <line x1="301" y1="55" x2="301" y2="62" stroke="#2D2D2D" stroke-width="1.5"/>
  <line x1="194" y1="58" x2="301" y2="58" stroke="#2D2D2D" stroke-width="1.5"/>
  <!-- Arrowheads -->
  <polygon points="194,58 200,54 200,62" fill="#2D2D2D"/>
  <polygon points="301,58 295,54 295,62" fill="#2D2D2D"/>
  <text x="247" y="52" text-anchor="middle" font-family="system-ui" font-size="10" font-weight="bold" fill="#2D2D2D">@ 40 cm</text>

  <!-- ============================================ -->
  <!-- LABELS WITH ARROWS -->
  <!-- ============================================ -->

  <!-- 1. Solera superior -->
  <line x1="90" y1="78" x2="90" y2="555" stroke="#2D2D2D" stroke-width="1.5"/>
  <polygon points="90,555 85,545 95,545" fill="#2D2D2D"/>
  <text x="90" y="572" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="bold" fill="#1A1A1A">Solera superior</text>

  <!-- 2. Montante -->
  <line x1="194" y1="295" x2="222" y2="555" stroke="#2D2D2D" stroke-width="1.5"/>
  <polygon points="222,555 215,547 229,547" fill="#2D2D2D"/>
  <text x="222" y="572" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="bold" fill="#1A1A1A">Montante @ 40 cm</text>

  <!-- 3. Solera inferior -->
  <line x1="310" y1="512" x2="310" y2="540" stroke="#2D2D2D" stroke-width="1.5"/>
  <polygon points="310,540 305,530 315,530" fill="#2D2D2D"/>
  <text x="310" y="555" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="bold" fill="#1A1A1A">Solera inferior</text>

  <!-- 4. Dintel -->
  <line x1="461" y1="206" x2="530" y2="555" stroke="#2D2D2D" stroke-width="1.5"/>
  <polygon points="530,555 523,547 537,547" fill="#2D2D2D"/>
  <text x="530" y="572" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="bold" fill="#1A1A1A">Dintel</text>

  <!-- 5. Arriostramiento -->
  <line x1="140" y1="295" x2="140" y2="370" stroke="#2D2D2D" stroke-width="1.5"/>
  <line x1="140" y1="370" x2="85" y2="430" stroke="#2D2D2D" stroke-width="1.5"/>
  <polygon points="85,430 83,420 90,426" fill="#2D2D2D"/>
  <text x="55" y="448" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="bold" fill="#1A1A1A">Arriostramiento</text>

  <!-- 6. Aislación -->
  <line x1="356" y1="295" x2="356" y2="370" stroke="#2D2D2D" stroke-width="1.5"/>
  <line x1="356" y1="370" x2="390" y2="430" stroke="#2D2D2D" stroke-width="1.5"/>
  <polygon points="390,430 383,422 397,422" fill="#2D2D2D"/>
  <text x="420" y="430" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="bold" fill="#1A1A1A">Aislación</text>
  <text x="420" y="445" text-anchor="middle" font-family="system-ui" font-size="10" fill="#6B6B6B">(lana de vidrio/roca)</text>

  <!-- 7. Placa de yeso -->
  <line x1="710" y1="295" x2="770" y2="400" stroke="#2D2D2D" stroke-width="1.5"/>
  <polygon points="770,400 761,396 767,408" fill="#2D2D2D"/>
  <text x="770" y="420" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="bold" fill="#1A1A1A">Placa de yeso</text>
  <text x="770" y="435" text-anchor="middle" font-family="system-ui" font-size="10" fill="#6B6B6B">(durlock)</text>

  <!-- Footer -->
  <text x="400" y="590" text-anchor="middle" font-family="system-ui" font-size="10" fill="#6B6B6B">Perfiles de acero galvanizado según IRAM IAS U 500-205 — Separación recomendada 40 cm</text>
</svg>
