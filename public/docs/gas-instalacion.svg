<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#FAF9F6" rx="8"/>
  <text x="400" y="30" text-anchor="middle" font-family="system-ui" font-size="15" font-weight="bold" fill="#1A1A1A">Instalación de Gas — Esquema</text>

  <!-- Gas meter -->
  <rect x="60" y="180" width="80" height="100" fill="#F5F3EF" stroke="#2D2D2D" stroke-width="2" rx="6"/>
  <circle cx="100" cy="220" r="15" fill="#E0DDD6" stroke="#2D2D2D" stroke-width="1"/>
  <circle cx="100" cy="220" r="6" fill="#6B6B6B"/>
  <line x1="80" y1="252" x2="120" y2="252" stroke="#6B6B6B" stroke-width="2"/>
  <line x1="85" y1="258" x2="115" y2="258" stroke="#6B6B6B" stroke-width="2"/>
  <text x="100" y="300" text-anchor="middle" font-family="system-ui" font-size="10" font-weight="bold" fill="#2D2D2D">Medidor</text>

  <!-- Underground pipe from meter to house -->
  <line x1="140" y1="230" x2="220" y2="230" stroke="#F1C40F" stroke-width="6" stroke-linecap="round"/>
  <line x1="220" y1="230" x2="220" y2="380" stroke="#F1C40F" stroke-width="6" stroke-linecap="round"/>
  <line x1="220" y1="380" x2="750" y2="380" stroke="#F1C40F" stroke-width="6" stroke-linecap="round"/>

  <!-- Ground line -->
  <line x1="0" y1="350" x2="400" y2="350" stroke="#8B6914" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="60" y="345" font-family="system-ui" font-size="9" fill="#8B6914">Nivel del suelo</text>

  <!-- Valve 1 (main shutoff) -->
  <rect x="280" y="370" width="18" height="30" fill="#E74C3C" stroke="#2D2D2D" stroke-width="1.5" rx="3"/>
  <text x="289" y="420" text-anchor="middle" font-family="system-ui" font-size="8" fill="#E74C3C">LLAVE</text>
  <text x="289" y="432" text-anchor="middle" font-family="system-ui" font-size="8" fill="#E74C3C">PASO</text>

  <!-- Valve 2 -->
  <rect x="480" y="370" width="18" height="30" fill="#E74C3C" stroke="#2D2D2D" stroke-width="1.5" rx="3"/>

  <!-- Valve 3 -->
  <rect x="650" y="370" width="18" height="30" fill="#E74C3C" stroke="#2D2D2D" stroke-width="1.5" rx="3"/>

  <!-- Kitchen -->
  <rect x="360" y="300" width="120" height="70" fill="#E0DDD6" stroke="#2D2D2D" stroke-width="1.5" rx="4"/>
  <circle cx="380" cy="330" r="12" fill="#2D2D2D"/>
  <circle cx="380" cy="330" r="6" fill="#E0DDD6"/>
  <rect x="400" y="318" width="60" height="4" fill="#2D2D2D" rx="2"/>
  <rect x="400" y="328" width="60" height="4" fill="#2D2D2D" rx="2"/>
  <text x="420" y="385" text-anchor="middle" font-family="system-ui" font-size="10" fill="#2D2D2D">Cocina</text>

  <!-- Connection kitchen -->
  <line x1="420" y1="370" x2="420" y2="380" stroke="#F1C40F" stroke-width="5"/>
  <line x1="420" y1="380" x2="498" y2="380" stroke="#F1C40F" stroke-width="6"/>

  <!-- Water heater -->
  <rect x="530" y="290" width="100" height="80" fill="#D4C5B5" stroke="#2D2D2D" stroke-width="1.5" rx="6"/>
  <circle cx="580" cy="320" r="10" fill="#E74C3C"/>
  <rect x="560" y="340" width="40" height="3" fill="#6B6B6B" rx="1"/>
  <rect x="560" y="348" width="40" height="3" fill="#6B6B6B" rx="1"/>
  <text x="580" y="390" text-anchor="middle" font-family="system-ui" font-size="10" fill="#2D2D2D">Calefón</text>

  <!-- Connection water heater -->
  <line x1="630" y1="330" x2="650" y2="330" stroke="#F1C40F" stroke-width="5"/>
  <line x1="650" y1="330" x2="650" y2="380" stroke="#F1C40F" stroke-width="6"/>

  <!-- Label: buried pipe -->
  <text x="500" y="465" text-anchor="middle" font-family="system-ui" font-size="10" fill="#6B6B6B">Cañería enterrada (polietileno)</text>

  <!-- Legend -->
  <rect x="60" y="440" width="14" height="14" fill="#F1C40F" rx="2"/>
  <text x="80" y="453" font-family="system-ui" font-size="10" fill="#2D2D2D">Cañería de gas</text>
  <rect x="200" y="440" width="14" height="14" fill="#E74C3C" rx="2"/>
  <text x="220" y="453" font-family="system-ui" font-size="10" fill="#2D2D2D">Válvula de corte</text>
</svg>