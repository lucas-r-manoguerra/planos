<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="system-ui, -apple-system, sans-serif">
  <rect width="800" height="500" fill="#FAF9F6" rx="8"/>
  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#2D2D2D">Instalación de Agua — Esquema General</text>

  <!-- CAÑO PRINCIPAL DESDE LA RED -->
  <line x1="0" y1="270" x2="75" y2="270" stroke="#3498DB" stroke-width="6" stroke-linecap="round"/>
  <text x="38" y="255" text-anchor="middle" font-size="8" font-weight="600" fill="#3498DB">Red pública</text>
  <text x="38" y="290" text-anchor="middle" font-size="6" fill="#3498DB">Ø 19 mm</text>

  <!-- MEDIDOR -->
  <rect x="75" y="255" width="55" height="30" rx="4" fill="#E8E0D0" stroke="#2D2D2D" stroke-width="1.5"/>
  <circle cx="102" cy="270" r="9" fill="none" stroke="#2D2D2D" stroke-width="0.8"/>
  <line x1="97" y1="267" x2="107" y2="267" stroke="#2D2D2D" stroke-width="0.8"/>
  <line x1="100" y1="270" x2="104" y2="270" stroke="#2D2D2D" stroke-width="0.8"/>
  <text x="102" y="302" text-anchor="middle" font-size="9" font-weight="600" fill="#2D2D2D">Medidor</text>

  <!-- TRAMO MEDIDOR → VÁLVULA -->
  <line x1="130" y1="270" x2="190" y2="270" stroke="#3498DB" stroke-width="6"/>

  <!-- VÁLVULA DE PASO GENERAL -->
  <circle cx="205" cy="270" r="14" fill="#E74C3C" stroke="#2D2D2D" stroke-width="1.5"/>
  <line x1="205" y1="256" x2="205" y2="284" stroke="#2D2D2D" stroke-width="1.5"/>
  <line x1="200" y1="270" x2="210" y2="270" stroke="#FFF" stroke-width="2"/>
  <text x="205" y="305" text-anchor="middle" font-size="9" font-weight="600" fill="#2D2D2D">Llave de paso general</text>

  <!-- TRAMO VÁLVULA → TERMOTANQUE -->
  <line x1="219" y1="270" x2="280" y2="270" stroke="#3498DB" stroke-width="6"/>

  <!-- TERMOTANQUE / CALEFÓN -->
  <rect x="280" y="205" width="90" height="130" rx="10" fill="#FFF3CD" stroke="#2D2D2D" stroke-width="2"/>
  <!-- Detalles del termotanque -->
  <rect x="290" y="215" width="70" height="8" rx="2" fill="#CCC"/>
  <rect x="290" y="317" width="70" height="8" rx="2" fill="#CCC"/>
  <line x1="325" y1="223" x2="325" y2="317" stroke="#2D2D2D" stroke-width="0.5" opacity="0.3"/>
  <!-- Llama -->
  <ellipse cx="325" cy="235" rx="14" ry="8" fill="#E74C3C" opacity="0.7"/>
  <ellipse cx="325" cy="238" rx="8" ry="5" fill="#FFD700" opacity="0.9"/>
  <path d="M325,225 Q328,230 325,235 Q322,230 325,225" fill="#FF8C00" opacity="0.6"/>
  <text x="325" y="358" text-anchor="middle" font-size="9" font-weight="600" fill="#2D2D2D">Termotanque / Calefón</text>

  <!-- CONEXIÓN TERMOTANQUE → DISTRIBUCIÓN -->
  <!-- Caño frío sube del termotanque -->
  <line x1="290" y1="240" x2="290" y2="130" stroke="#3498DB" stroke-width="4"/>
  <!-- Caño caliente sube del termotanque -->
  <line x1="360" y1="240" x2="360" y2="150" stroke="#E74C3C" stroke-width="4"/>

  <!-- CAÑERÍA DE AGUA FRÍA (horizontal, superior) -->
  <line x1="290" y1="130" x2="760" y2="130" stroke="#3498DB" stroke-width="4"/>
  <text x="380" y="118" text-anchor="middle" font-size="9" font-weight="600" fill="#3498DB">Agua Fría</text>

  <!-- CAÑERÍA DE AGUA CALIENTE (horizontal, debajo de fría) -->
  <line x1="360" y1="150" x2="760" y2="150" stroke="#E74C3C" stroke-width="4"/>
  <text x="380" y="168" text-anchor="middle" font-size="9" font-weight="600" fill="#E74C3C">Agua Caliente</text>

  <!-- ====================================================== -->
  <!-- RAMA 1: BAÑO (x=470-500) -->
  <!-- ====================================================== -->

  <!-- Válvula baño en caño frío -->
  <circle cx="480" cy="130" r="7" fill="#E74C3C" stroke="#2D2D2D" stroke-width="1"/>
  <line x1="480" y1="123" x2="480" y2="137" stroke="#FFF" stroke-width="1.5"/>

  <!-- Válvula baño en caño caliente -->
  <circle cx="480" cy="150" r="7" fill="#E74C3C" stroke="#2D2D2D" stroke-width="1"/>
  <line x1="480" y1="143" x2="480" y2="157" stroke="#FFF" stroke-width="1.5"/>

  <!-- Bajada fría baño -->
  <line x1="480" y1="130" x2="480" y2="370" stroke="#3498DB" stroke-width="3"/>
  <!-- Bajada caliente baño -->
  <line x1="480" y1="150" x2="480" y2="370" stroke="#E74C3C" stroke-width="3"/>

  <!-- Artefactos del baño -->
  <rect x="445" y="380" width="70" height="60" rx="5" fill="none" stroke="#CCC" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="480" y="455" text-anchor="middle" font-size="9" font-weight="600" fill="#2D2D2D">Baño</text>

  <!-- Inodoro -->
  <ellipse cx="458" cy="400" rx="10" ry="8" fill="#FAF9F6" stroke="#2D2D2D" stroke-width="1"/>
  <rect x="453" y="408" width="10" height="6" rx="2" fill="none" stroke="#2D2D2D" stroke-width="0.8"/>
  <text x="458" y="425" text-anchor="middle" font-size="6" fill="#666">Inodoro</text>

  <!-- Lavatorio -->
  <rect x="470" y="395" width="18" height="12" rx="4" fill="#FAF9F6" stroke="#2D2D2D" stroke-width="1"/>
  <path d="M472,397 Q479,392 486,397" stroke="#2D2D2D" stroke-width="0.8" fill="none"/>
  <text x="479" y="425" text-anchor="middle" font-size="6" fill="#666">Lavatorio</text>

  <!-- Ducha -->
  <circle cx="505" cy="395" r="7" fill="none" stroke="#2D2D2D" stroke-width="1"/>
  <line x1="505" y1="388" x2="505" y2="402" stroke="#2D2D2D" stroke-width="0.8"/>
  <line x1="498" y1="395" x2="512" y2="395" stroke="#2D2D2D" stroke-width="0.8"/>
  <text x="505" y="425" text-anchor="middle" font-size="6" fill="#666">Ducha</text>

  <!-- ====================================================== -->
  <!-- RAMA 2: COCINA (x=600) -->
  <!-- ====================================================== -->

  <!-- Válvula cocina en caño frío -->
  <circle cx="610" cy="130" r="7" fill="#E74C3C" stroke="#2D2D2D" stroke-width="1"/>
  <line x1="610" y1="123" x2="610" y2="137" stroke="#FFF" stroke-width="1.5"/>

  <!-- Válvula cocina en caño caliente -->
  <circle cx="610" cy="150" r="7" fill="#E74C3C" stroke="#2D2D2D" stroke-width="1"/>
  <line x1="610" y1="143" x2="610" y2="157" stroke="#FFF" stroke-width="1.5"/>

  <!-- Bajada fría cocina -->
  <line x1="610" y1="130" x2="610" y2="380" stroke="#3498DB" stroke-width="3"/>
  <!-- Bajada caliente cocina -->
  <line x1="610" y1="150" x2="610" y2="380" stroke="#E74C3C" stroke-width="3"/>

  <!-- Cocina artefacto -->
  <rect x="580" y="390" width="60" height="40" rx="5" fill="none" stroke="#CCC" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="610" y="445" text-anchor="middle" font-size="9" font-weight="600" fill="#2D2D2D">Cocina</text>

  <!-- Canilla cocina -->
  <rect x="595" y="398" width="30" height="16" rx="4" fill="#FAF9F6" stroke="#2D2D2D" stroke-width="1"/>
  <rect x="608" y="394" width="4" height="8" rx="1" fill="#999"/>
  <path d="M598,412 Q610,406 622,412" stroke="#2D2D2D" stroke-width="1" fill="none"/>
  <text x="610" y="425" text-anchor="middle" font-size="6" fill="#666">Canilla</text>

  <!-- ====================================================== -->
  <!-- RAMA 3: LAVADERO (x=720) -->
  <!-- ====================================================== -->

  <!-- Válvula lavadero en caño frío -->
  <circle cx="730" cy="130" r="7" fill="#E74C3C" stroke="#2D2D2D" stroke-width="1"/>
  <line x1="730" y1="123" x2="730" y2="137" stroke="#FFF" stroke-width="1.5"/>

  <!-- Válvula lavadero en caño caliente -->
  <circle cx="730" cy="150" r="7" fill="#E74C3C" stroke="#2D2D2D" stroke-width="1"/>
  <line x1="730" y1="143" x2="730" y2="157" stroke="#FFF" stroke-width="1.5"/>

  <!-- Bajada fría lavadero -->
  <line x1="730" y1="130" x2="730" y2="380" stroke="#3498DB" stroke-width="3"/>
  <!-- Bajada caliente lavadero -->
  <line x1="730" y1="150" x2="730" y2="380" stroke="#E74C3C" stroke-width="3"/>

  <!-- Lavadero artefacto -->
  <rect x="700" y="390" width="60" height="40" rx="5" fill="none" stroke="#CCC" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="730" y="445" text-anchor="middle" font-size="9" font-weight="600" fill="#2D2D2D">Lavadero</text>

  <!-- Canilla lavadero -->
  <rect x="714" y="398" width="32" height="16" rx="4" fill="#FAF9F6" stroke="#2D2D2D" stroke-width="1"/>
  <rect x="728" y="394" width="4" height="8" rx="1" fill="#999"/>
  <path d="M718,412 Q730,406 742,412" stroke="#2D2D2D" stroke-width="1" fill="none"/>
  <text x="730" y="425" text-anchor="middle" font-size="6" fill="#666">Canilla</text>

  <!-- ETIQUETAS EN DERIVACIONES -->
  <text x="490" y="365" font-size="6" fill="#3498DB">F</text>
  <text x="490" y="375" font-size="6" fill="#E74C3C">C</text>
  <text x="618" y="375" font-size="6" fill="#3498DB">F</text>
  <text x="618" y="385" font-size="6" fill="#E74C3C">C</text>
  <text x="738" y="375" font-size="6" fill="#3498DB">F</text>
  <text x="738" y="385" font-size="6" fill="#E74C3C">C</text>

  <!-- LEYENDA -->
  <rect x="30" y="430" width="310" height="55" rx="6" fill="#FAF9F6" stroke="#CCC" stroke-width="1"/>
  <text x="185" y="448" text-anchor="middle" font-size="9" font-weight="700" fill="#2D2D2D">Referencias</text>

  <line x1="40" y1="460" x2="65" y2="460" stroke="#3498DB" stroke-width="3"/>
  <text x="70" y="463" font-size="7.5" fill="#2D2D2D">Agua fría</text>

  <line x1="130" y1="460" x2="155" y2="460" stroke="#E74C3C" stroke-width="3"/>
  <text x="160" y="463" font-size="7.5" fill="#2D2D2D">Agua caliente</text>

  <circle cx="220" cy="460" r="5" fill="#E74C3C" stroke="#2D2D2D" stroke-width="0.8"/>
  <text x="230" y="463" font-size="7.5" fill="#2D2D2D">Válvula de paso</text>
</svg>
