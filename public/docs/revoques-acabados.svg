  <text x="315" y="332" text-anchor="middle" font-family="system-ui" font-size="10" fill="#6B6B6B">Exteriores,</text>
  <text x="315" y="346" text-anchor="middle" font-family="system-ui" font-size="10" fill="#6B6B6B">fachadas</text>

