  <!-- QUADRANT 2: Tizón (top-right) -->
  <!-- ============================================ -->
  <text x="605" y="75" text-anchor="middle" font-family="system-ui" font-size="13" font-weight="bold" fill="#1A1A1A">Aparejo a Tizón</text>
  <text x="605" y="92" text-anchor="middle" font-family="system-ui" font-size="10" fill="#6B6B6B">28 cm (1 pie)</text>

  <!-- Hilada 1 -->
  <rect x="435" y="110" width="310" height="40" fill="#C17A57" stroke="#2D2D2D" stroke-width="1.5" rx="1"/>
  <line x1="495" y1="110" x2="495" y2="150" stroke="#2D2D2D" stroke-width="1.5"/>
  <line x1="555" y1="110" x2="555" y2="150" stroke="#2D2D2D" stroke-width="1.5"/>
  <line x1="615" y1="110" x2="615" y2="150" stroke="#2D2D2D" stroke-width="1.5"/>
  <line x1="675" y1="110" x2="675" y2="150" stroke="#2D2D2D" stroke-width="1.5"/>
