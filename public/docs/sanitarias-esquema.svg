<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" fill="none">
  <rect width="800" height="550" fill="#FAF9F6" rx="8"/>
  <text x="400" y="28" text-anchor="middle" font-family="system-ui" font-size="15" font-weight="bold" fill="#1A1A1A">Sistema Sanitario — Esquema General</text>

  <!-- GROUND LINE -->
  <line x1="0" y1="420" x2="800" y2="420" stroke="#8B6914" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="30" y="413" font-family="system-ui" font-size="9" fill="#8B6914">Nivel del suelo</text>

  <!-- HOUSE outline -->
  <path d="M180 420 L180 200 L400 100 L620 200 L620 420" fill="none" stroke="#2D2D2D" stroke-width="2"/>
  <line x1="180" y1="200" x2="620" y2="200" stroke="#2D2D2D" stroke-width="2"/>

  <!-- ROOF gutter -->
  <line x1="160" y1="195" x2="640" y2="195" stroke="#5B9BD5" stroke-width="4" stroke-linecap="round"/>
  <rect x="490" y="185" width="50" height="14" fill="#5B9BD5" stroke="#2D2D2D" stroke-width="1.5" rx="3"/>
  <text x="515" y="196" text-anchor="middle" font-family="system-ui" font-size="8" fill="white">Embudo</text>

  <!-- DOWNSPOUT (rainwater downpipe) -->
  <rect x="528" y="199" width="14" height="60" fill="#5B9BD5" stroke="#2D2D2D" stroke-width="1.5" rx="2"/>
  <text x="567" y="235" font-family="system-ui" font-size="9" fill="#5B9BD5">Bajada pluvial Ø 63</text>

  <!-- Arrow down on downspout -->
  <polygon points="535,268 528,258 542,258" fill="#5B9BD5"/>

  <!-- Underground pluvial pipe -->
  <line x1="535" y1="270" x2="535" y2="440" stroke="#5B9BD5" stroke-width="5"/>
  <line x1="535" y1="440" x2="700" y2="450" stroke="#5B9BD5" stroke-width="5"/>
  <text x="630" y="465" text-anchor="middle" font-family="system-ui" font-size="9" fill="#5B9BD5">Colector pluvial Ø 110</text>

  <!-- Arrow right pluvial -->
  <polygon points="705,450 695,445 695,455" fill="#5B9BD5"/>

  <!-- Patio drain (rejilla/pileta) -->
  <rect x="270" y="365" width="36" height="24" fill="#D4C5B5" stroke="#2D2D2D" stroke-width="1.5" rx="3"/>
  <line x1="278" y1="373" x2="298" y2="373" stroke="#6B6B6B" stroke-width="1.5"/>
  <line x1="278" y1="379" x2="298" y2="379" stroke="#6B6B6B" stroke-width="1.5"/>
  <text x="288" y="355" text-anchor="middle" font-family="system-ui" font-size="8" fill="#2D2D2D">Pileta patio</text>
  <line x1="288" y1="389" x2="535" y2="435" stroke="#5B9BD5" stroke-width="3" stroke-dasharray="5,3"/>

  <!-- BATHROOM box -->
  <rect x="250" y="190" width="140" height="130" fill="none" stroke="#2D2D2D" stroke-width="1.5" rx="4"/>
  <text x="320" y="208" text-anchor="middle" font-family="system-ui" font-size="10" font-weight="bold" fill="#2D2D2D">Baño</text>

  <!-- TOILET -->
  <rect x="270" y="240" width="32" height="40" fill="#E0DDD6" stroke="#2D2D2D" stroke-width="1.5" rx="4"/>
  <ellipse cx="286" cy="245" rx="14" ry="6" fill="#E0DDD6" stroke="#2D2D2D" stroke-width="1.5"/>
  <text x="286" y="298" text-anchor="middle" font-family="system-ui" font-size="8" fill="#2D2D2D">Inodoro</text>

  <!-- LAVATORY -->
  <rect x="320" y="255" width="36" height="22" fill="#E0DDD6" stroke="#2D2D2D" stroke-width="1.5" rx="6"/>
  <ellipse cx="338" cy="260" rx="12" ry="5" fill="#FAF9F6" stroke="#2D2D2D" stroke-width="1"/>
  <text x="338" y="298" text-anchor="middle" font-family="system-ui" font-size="8" fill="#2D2D2D">Lavatorio</text>

  <!-- SHOWER -->
  <rect x="370" y="228" width="10" height="10" fill="none" stroke="#2D2D2D" stroke-width="1.5" rx="5"/>
  <line x1="375" y1="220" x2="375" y2="228" stroke="#2D2D2D" stroke-width="1.5"/>
  <circle cx="375" cy="218" r="4" fill="none" stroke="#2D2D2D" stroke-width="1.5"/>
  <text x="375" y="298" text-anchor="middle" font-family="system-ui" font-size="8" fill="#2D2D2D">Ducha</text>

  <!-- Waste pipe from toilet to collector -->
  <line x1="286" y1="280" x2="286" y2="390" stroke="#A17A5B" stroke-width="4"/>
  <line x1="338" y1="277" x2="338" y2="390" stroke="#A17A5B" stroke-width="3"/>
  <line x1="375" y1="270" x2="375" y2="390" stroke="#A17A5B" stroke-width="3"/>

  <!-- Horizontal collector -->
  <line x1="250" y1="390" x2="450" y2="400" stroke="#A17A5B" stroke-width="5"/>
  <line x1="286" y1="390" x2="250" y2="390" stroke="#A17A5B" stroke-width="4"/>

  <!-- Label collector -->
  <text x="320" y="418" text-anchor="middle" font-family="system-ui" font-size="9" fill="#A17A5B">Colector cloacal Ø 110</text>
  <text x="320" y="432" text-anchor="middle" font-family="system-ui" font-size="9" fill="#A17A5B">Pendiente 1-2%</text>

  <!-- Arrow on collector -->
  <polygon points="450,400 440,395 440,405" fill="#A17A5B"/>

  <!-- INSPECTION CHAMBER -->
  <rect x="440" y="470" width="40" height="30" fill="#D4C5B5" stroke="#2D2D2D" stroke-width="1.5" rx="3"/>
  <rect x="455" y="468" width="10" height="4" fill="#6B6B6B"/>
  <text x="460" y="518" text-anchor="middle" font-family="system-ui" font-size="9" font-weight="bold" fill="#2D2D2D">Cámara de</text>
  <text x="460" y="530" text-anchor="middle" font-family="system-ui" font-size="9" font-weight="bold" fill="#2D2D2D">inspección</text>

  <!-- Collector to inspection chamber -->
  <line x1="450" y1="400" x2="440" y2="470" stroke="#A17A5B" stroke-width="5"/>
  <line x1="480" y1="485" x2="700" y2="485" stroke="#A17A5B" stroke-width="5"/>

  <!-- VENTILATION COLUMN rising from bathroom -->
  <line x1="340" y1="255" x2="340" y2="160" stroke="#8DB58D" stroke-width="3"/>
  <line x1="340" y1="160" x2="340" y2="95" stroke="#8DB58D" stroke-width="4"/>
  <rect x="336" y="90" width="8" height="8" fill="#8DB58D" stroke="#2D2D2D" stroke-width="1" rx="2"/>
  <text x="365" y="135" font-family="system-ui" font-size="9" fill="#8DB58D">Columna de ventilación Ø 50</text>
  <text x="365" y="148" font-family="system-ui" font-size="8" fill="#8DB58D">2 m sobre techo</text>

  <!-- Arrow up on ventilation -->
  <polygon points="340,87 333,95 347,95" fill="#8DB58D"/>

  <!-- LEGEND -->
  <rect x="40" y="470" width="12" height="12" fill="#A17A5B" rx="2"/>
  <text x="58" y="481" font-family="system-ui" font-size="9" fill="#2D2D2D">Cloacal</text>
  <rect x="120" y="470" width="12" height="12" fill="#5B9BD5" rx="2"/>
  <text x="138" y="481" font-family="system-ui" font-size="9" fill="#2D2D2D">Pluvial</text>
  <rect x="200" y="470" width="12" height="12" fill="#8DB58D" rx="2"/>
  <text x="218" y="481" font-family="system-ui" font-size="9" fill="#2D2D2D">Ventilación</text>
  <rect x="310" y="470" width="12" height="12" fill="#D4C5B5" rx="2"/>
  <text x="328" y="481" font-family="system-ui" font-size="9" fill="#2D2D2D">Cámara de inspección</text>
</svg>