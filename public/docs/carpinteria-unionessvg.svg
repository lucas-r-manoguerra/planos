<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#FAF9F6" rx="8"/>
  <text x="400" y="25" text-anchor="middle" font-family="system-ui" font-size="15" font-weight="bold" fill="#1A1A1A">Uniones de Carpintería</text>

  <!-- Grilla 3×2 - líneas divisorias -->
  <line x1="267" y1="40" x2="267" y2="490" stroke="#D4C5B5" stroke-width="1"/>
  <line x1="533" y1="40" x2="533" y2="490" stroke="#D4C5B5" stroke-width="1"/>
  <line x1="0" y1="265" x2="800" y2="265" stroke="#D4C5B5" stroke-width="1"/>

  <!-- ================================================================ -->
  <!-- 1. EMPALME RECTO (top-left) -->
  <!-- ================================================================ -->
  <text x="133" y="55" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="bold" fill="#2D2D2D">1. Empalme recto</text>
  <text x="133" y="68" text-anchor="middle" font-family="system-ui" font-size="8" fill="#6B6B6B">Uso: Marcos, cercos</text>

  <!-- Pieza izquierda -->
  <rect x="45" y="130" width="75" height="50" fill="#C17A57" stroke="#8B4513" stroke-width="1.5" rx="2"/>
  <line x1="55" y1="145" x2="110" y2="145" stroke="#D4896A" stroke-width="0.8"/>
  <line x1="55" y1="155" x2="110" y2="155" stroke="#D4896A" stroke-width="0.8"/>
  <line x1="55" y1="165" x2="110" y2="165" stroke="#D4896A" stroke-width="0.8"/>

  <!-- Pieza derecha -->
  <rect x="120" y="130" width="75" height="50" fill="#C17A57" stroke="#8B4513" stroke-width="1.5" rx="2"/>
  <line x1="125" y1="145" x2="185" y2="145" stroke="#D4896A" stroke-width="0.8"/>
  <line x1="125" y1="155" x2="185" y2="155" stroke="#D4896A" stroke-width="0.8"/>
  <line x1="125" y1="165" x2="185" y2="165" stroke="#D4896A" stroke-width="0.8"/>

  <!-- Línea de unión -->
  <line x1="120" y1="130" x2="120" y2="180" stroke="#8B4513" stroke-width="2.5"/>

  <!-- Pernos -->
  <circle cx="85" cy="142" r="5" fill="#6B7B8D" stroke="#2D2D2D" stroke-width="1"/>
  <circle cx="85" cy="168" r="5" fill="#6B7B8D" stroke="#2D2D2D" stroke-width="1"/>
  <circle cx="155" cy="142" r="5" fill="#6B7B8D" stroke="#2D2D2D" stroke-width="1"/>
  <circle cx="155" cy="168" r="5" fill="#6B7B8D" stroke="#2D2D2D" stroke-width="1"/>

  <!-- ================================================================ -->
  <!-- 2. MACHIHEMBRADO (top-center) -->
  <!-- ================================================================ -->
  <text x="400" y="55" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="bold" fill="#2D2D2D">2. Machihembrado</text>
  <text x="400" y="68" text-anchor="middle" font-family="system-ui" font-size="8" fill="#6B6B6B">Uso: Pisos, revestimientos</text>

  <!-- Pieza izquierda (con lengüeta) -->
  <path d="M320 130 L385 130 L385 145 L395 145 L395 165 L385 165 L385 180 L320 180 Z" fill="#C17A57" stroke="#8B4513" stroke-width="1.5"/>
  <line x1="330" y1="145" x2="380" y2="145" stroke="#D4896A" stroke-width="0.8"/>
  <line x1="330" y1="155" x2="380" y2="155" stroke="#D4896A" stroke-width="0.8"/>
  <line x1="330" y1="165" x2="380" y2="165" stroke="#D4896A" stroke-width="0.8"/>

  <!-- Pieza derecha (con ranura) -->
  <path d="M400 130 L480 130 L480 180 L400 180 L400 165 L390 165 L390 145 L400 145 Z" fill="#C17A57" stroke="#8B4513" stroke-width="1.5"/>
  <line x1="405" y1="145" x2="470" y2="145" stroke="#D4896A" stroke-width="0.8"/>
  <line x1="405" y1="155" x2="470" y2="155" stroke="#D4896A" stroke-width="0.8"/>
  <line x1="405" y1="165" x2="470" y2="165" stroke="#D4896A" stroke-width="0.8"/>

  <!-- Lengüeta visible -->
  <rect x="385" y="145" width="10" height="20" fill="#D4896A" stroke="#8B4513" stroke-width="1" rx="1"/>
  <line x1="388" y1="148" x2="392" y2="148" stroke="#B87333" stroke-width="0.5"/>
  <line x1="388" y1="162" x2="392" y2="162" stroke="#B87333" stroke-width="0.5"/>

  <!-- Indicación visual de inserción -->
  <path d="M375 130 L390 130 L390 180 L375 180" fill="none" stroke="#3498DB" stroke-width="0.8" stroke-dasharray="3,2"/>

  <!-- ================================================================ -->
  <!-- 3. CAJA Y ESPIGA (top-right) -->
  <!-- ================================================================ -->
  <text x="667" y="55" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="bold" fill="#2D2D2D">3. Caja y espiga</text>
  <text x="667" y="68" text-anchor="middle" font-family="system-ui" font-size="8" fill="#6B6B6B">Uso: Muebles, sillas</text>

  <!-- Pieza vertical (espiga) -->
  <rect x="620" y="100" width="35" height="65" fill="#C17A57" stroke="#8B4513" stroke-width="1.5" rx="2"/>
  <line x1="628" y1="110" x2="647" y2="110" stroke="#D4896A" stroke-width="0.8"/>
  <line x1="628" y1="125" x2="647" y2="125" stroke="#D4896A" stroke-width="0.8"/>
  <!-- Espiga (parte angosta) -->
  <rect x="623" y="165" width="28" height="25" fill="#D4896A" stroke="#8B4513" stroke-width="1.5"/>

  <!-- Pieza horizontal (caja) -->
  <rect x="585" y="190" width="110" height="40" fill="#C17A57" stroke="#8B4513" stroke-width="1.5" rx="2"/>
  <line x1="595" y1="200" x2="685" y2="200" stroke="#D4896A" stroke-width="0.8"/>
  <line x1="595" y1="210" x2="685" y2="210" stroke="#D4896A" stroke-width="0.8"/>
  <line x1="595" y1="220" x2="685" y2="220" stroke="#D4896A" stroke-width="0.8"/>

  <!-- Agujero de la caja (mortaja) -->
  <rect x="623" y="190" width="28" height="25" fill="#FAF9F6" stroke="#8B4513" stroke-width="1.5"/>

  <!-- Línea de inserción -->
  <line x1="637" y1="190" x2="637" y2="165" stroke="#8B4513" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- ================================================================ -->
  <!-- 4. ENSAMBLADO A MEDIA MADERA (bottom-left) -->
  <!-- ================================================================ -->
  <text x="133" y="280" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="bold" fill="#2D2D2D">4. Ensamblado a media madera</text>
  <text x="133" y="293" text-anchor="middle" font-family="system-ui" font-size="8" fill="#6B6B6B">Uso: Estructuras, puntales</text>

  <!-- Pieza horizontal -->
  <rect x="25" y="370" width="140" height="35" fill="#C17A57" stroke="#8B4513" stroke-width="1.5" rx="2"/>
  <line x1="35" y1="380" x2="155" y2="380" stroke="#D4896A" stroke-width="0.8"/>
  <line x1="35" y1="390" x2="155" y2="390" stroke="#D4896A" stroke-width="0.8"/>

  <!-- Corte media madera en la pieza vertical -->
  <!-- Pieza vertical, parte superior -->
  <rect x="110" y="340" width="35" height="25" fill="#D4896A" stroke="#8B4513" stroke-width="1.5"/>
  <line x1="116" y1="348" x2="139" y2="348" stroke="#C17A57" stroke-width="0.8"/>

  <!-- Corte media madera en pieza horizontal - línea de intersección -->
  <rect x="110" y="365" width="35" height="18" fill="#D4896A" stroke="#8B4513" stroke-width="1.5"/>
  <line x1="116" y1="372" x2="139" y2="372" stroke="#C17A57" stroke-width="0.8"/>

  <!-- Pieza vertical, parte inferior -->
  <rect x="110" y="383" width="35" height="25" fill="#C17A57" stroke="#8B4513" stroke-width="1.5"/>
  <line x1="116" y1="393" x2="139" y2="393" stroke="#D4896A" stroke-width="0.8"/>

  <!-- Indicación del corte -->
  <line x1="110" y1="365" x2="145" y2="365" stroke="#E74C3C" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="110" y1="383" x2="145" y2="383" stroke="#E74C3C" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- ================================================================ -->
  <!-- 5. UNIÓN CON ESCUADRA (bottom-center) -->
  <!-- ================================================================ -->
  <text x="400" y="280" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="bold" fill="#2D2D2D">5. Unión con escuadra</text>
  <text x="400" y="293" text-anchor="middle" font-family="system-ui" font-size="8" fill="#6B6B6B">Uso: Estanterías, muebles</text>

  <!-- Pieza vertical -->
  <rect x="340" y="330" width="40" height="80" fill="#C17A57" stroke="#8B4513" stroke-width="1.5" rx="2"/>
  <line x1="348" y1="340" x2="372" y2="340" stroke="#D4896A" stroke-width="0.8"/>
  <line x1="348" y1="355" x2="372" y2="355" stroke="#D4896A" stroke-width="0.8"/>
  <line x1="348" y1="370" x2="372" y2="370" stroke="#D4896A" stroke-width="0.8"/>
  <line x1="348" y1="385" x2="372" y2="385" stroke="#D4896A" stroke-width="0.8"/>
  <line x1="348" y1="400" x2="372" y2="400" stroke="#D4896A" stroke-width="0.8"/>

  <!-- Pieza horizontal -->
  <rect x="380" y="356" width="110" height="40" fill="#C17A57" stroke="#8B4513" stroke-width="1.5" rx="2"/>
  <line x1="390" y1="366" x2="480" y2="366" stroke="#D4896A" stroke-width="0.8"/>
  <line x1="390" y1="376" x2="480" y2="376" stroke="#D4896A" stroke-width="0.8"/>
  <line x1="390" y1="386" x2="480" y2="386" stroke="#D4896A" stroke-width="0.8"/>

  <!-- Escuadra metálica -->
  <path d="M375 355 L383 355 L383 378 L406 378 L406 386 L375 386 Z" fill="#6B7B8D" stroke="#2D2D2D" stroke-width="1.2"/>
  <line x1="383" y1="355" x2="383" y2="378" stroke="#2D2D2D" stroke-width="0.8"/>
  <line x1="383" y1="378" x2="406" y2="378" stroke="#2D2D2D" stroke-width="0.8"/>

  <!-- Tornillos -->
  <circle cx="381" cy="362" r="3" fill="#2D2D2D"/>
  <circle cx="394" cy="382" r="3" fill="#2D2D2D"/>
  <circle cx="381" cy="382" r="3" fill="#2D2D2D"/>

  <!-- ================================================================ -->
  <!-- 6. COLA DE MILANO (bottom-right) -->
  <!-- ================================================================ -->
  <text x="667" y="280" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="bold" fill="#2D2D2D">6. Cola de milano</text>
  <text x="667" y="293" text-anchor="middle" font-family="system-ui" font-size="8" fill="#6B6B6B">Uso: Cajones, muebles finos</text>

  <!-- Pieza izquierda (cola de milano - vista superior) -->
  <path d="M555 340 L555 420 L610 420 L610 405 L600 395 L610 385 L610 370 L600 360 L610 350 L610 340 Z" fill="#C17A57" stroke="#8B4513" stroke-width="1.5"/>
  <line x1="565" y1="350" x2="600" y2="350" stroke="#D4896A" stroke-width="0.8"/>
  <line x1="565" y1="360" x2="590" y2="360" stroke="#D4896A" stroke-width="0.8"/>
  <line x1="565" y1="370" x2="600" y2="370" stroke="#D4896A" stroke-width="0.8"/>
  <line x1="565" y1="380" x2="600" y2="380" stroke="#D4896A" stroke-width="0.8"/>
  <line x1="565" y1="390" x2="590" y2="390" stroke="#D4896A" stroke-width="0.8"/>
  <line x1="565" y1="400" x2="600" y2="400" stroke="#D4896A" stroke-width="0.8"/>
  <line x1="565" y1="410" x2="600" y2="410" stroke="#D4896A" stroke-width="0.8"/>

  <!-- Pieza derecha -->
  <path d="M610 340 L780 340 L780 420 L610 420 L610 405 L625 395 L610 385 L610 370 L625 360 L610 350 Z" fill="#C17A57" stroke="#8B4513" stroke-width="1.5"/>
  <line x1="620" y1="350" x2="770" y2="350" stroke="#D4896A" stroke-width="0.8"/>
  <line x1="620" y1="360" x2="770" y2="360" stroke="#D4896A" stroke-width="0.8"/>
  <line x1="620" y1="370" x2="770" y2="370" stroke="#D4896A" stroke-width="0.8"/>
  <line x1="620" y1="380" x2="770" y2="380" stroke="#D4896A" stroke-width="0.8"/>
  <line x1="620" y1="390" x2="770" y2="390" stroke="#D4896A" stroke-width="0.8"/>
  <line x1="620" y1="400" x2="770" y2="400" stroke="#D4896A" stroke-width="0.8"/>
  <line x1="620" y1="410" x2="770" y2="410" stroke="#D4896A" stroke-width="0.8"/>

  <!-- Espigas trapezoidales (cola de milano) -->
  <polygon points="610,345 625,358 625,392 610,405" fill="#D4896A" stroke="#8B4513" stroke-width="1.2"/>
  <polygon points="610,350 625,360" stroke="#B87333" stroke-width="0.5" stroke-linecap="round"/>
  <polygon points="610,390 625,392" stroke="#B87333" stroke-width="0.5" stroke-linecap="round"/>

  <!-- Linea de union visible -->
  <line x1="610" y1="340" x2="610" y2="420" stroke="#8B4513" stroke-width="2"/>
</svg>
