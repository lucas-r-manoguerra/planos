<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#FAF9F6" rx="8"/>
  <text x="400" y="28" text-anchor="middle" font-family="system-ui" font-size="15" font-weight="bold" fill="#1A1A1A">Instalación de Gas — Esquema General</text>

  <!-- Conexión a red (entrada desde la izquierda) -->
  <line x1="0" y1="72" x2="55" y2="72" stroke="#F4D03F" stroke-width="6" stroke-linecap="round"/>
  <text x="28" y="62" text-anchor="middle" font-family="system-ui" font-size="8" fill="#6B6B6B">Red</text>
  <text x="28" y="96" text-anchor="middle" font-family="system-ui" font-size="7" fill="#6B6B6B">pública</text>

  <line x1="55" y1="72" x2="85" y2="72" stroke="#F4D03F" stroke-width="6"/>

  <!-- Llave de paso general -->
  <rect x="88" y="58" width="22" height="28" fill="#E67E22" stroke="#2D2D2D" stroke-width="1.5" rx="3"/>
  <circle cx="99" cy="72" r="4" fill="#2D2D2D"/>
  <text x="99" y="52" text-anchor="middle" font-family="system-ui" font-size="7" fill="#E67E22">Llave paso</text>
  <text x="99" y="100" text-anchor="middle" font-family="system-ui" font-size="7" fill="#E67E22">general</text>

  <line x1="110" y1="72" x2="135" y2="72" stroke="#F4D03F" stroke-width="6"/>

  <!-- Regulador de presión -->
  <rect x="138" y="56" width="38" height="32" fill="#6B7B8D" stroke="#2D2D2D" stroke-width="1.5" rx="10"/>
  <text x="157" y="76" text-anchor="middle" font-family="system-ui" font-size="8" font-weight="bold" fill="#FFF">Regulador</text>
  <text x="157" y="50" text-anchor="middle" font-family="system-ui" font-size="7" fill="#6B7B8D">Presión</text>

  <line x1="176" y1="72" x2="200" y2="72" stroke="#F4D03F" stroke-width="6"/>

  <!-- Medidor de gas -->
  <rect x="203" y="52" width="65" height="40" fill="#E8E0D0" stroke="#2D2D2D" stroke-width="1.5" rx="5"/>
  <circle cx="236" cy="68" r="11" fill="#FFF" stroke="#2D2D2D" stroke-width="1.2"/>
  <circle cx="236" cy="68" r="3.5" fill="#2D2D2D"/>
  <line x1="228" y1="82" x2="244" y2="82" stroke="#6B6B6B" stroke-width="1.5"/>
  <line x1="230" y1="86" x2="242" y2="86" stroke="#6B6B6B" stroke-width="1.5"/>
  <text x="236" y="46" text-anchor="middle" font-family="system-ui" font-size="7" fill="#6B6B6B">Medidor</text>

  <!-- Caño de distribución horizontal -->
  <line x1="268" y1="72" x2="760" y2="72" stroke="#F4D03F" stroke-width="6"/>
  <text x="515" y="66" text-anchor="middle" font-family="system-ui" font-size="8" fill="#6B6B6B">Caño de alimentación Ø 19mm</text>

  <!-- ==================== RAMAL COCINA ==================== -->
  <line x1="175" y1="72" x2="175" y2="180" stroke="#F4D03F" stroke-width="4.5"/>

  <!-- Llave de paso individual -->
  <rect x="167" y="130" width="16" height="20" fill="#E67E22" stroke="#2D2D2D" stroke-width="1.2" rx="2"/>
  <text x="175" y="127" text-anchor="middle" font-family="system-ui" font-size="6" fill="#E67E22">Llave</text>
  <text x="175" y="156" text-anchor="middle" font-family="system-ui" font-size="6" fill="#E67E22">indiv.</text>

  <text x="190" y="90" font-family="system-ui" font-size="7" fill="#6B6B6B">Ramal cocina Ø 13mm</text>

  <!-- Cocina -->
  <rect x="115" y="195" width="120" height="100" fill="#E8E0D0" stroke="#2D2D2D" stroke-width="1.5" rx="4"/>
  <!-- Horno -->
  <rect x="125" y="205" width="45" height="65" fill="none" stroke="#2D2D2D" stroke-width="1.5" rx="3"/>
  <line x1="135" y1="225" x2="160" y2="225" stroke="#2D2D2D" stroke-width="1.2"/>
  <line x1="135" y1="235" x2="160" y2="235" stroke="#2D2D2D" stroke-width="1.2"/>
  <line x1="135" y1="245" x2="160" y2="245" stroke="#2D2D2D" stroke-width="1.2"/>
  <text x="148" y="278" text-anchor="middle" font-family="system-ui" font-size="7" fill="#6B6B6B">Horno</text>
  <!-- Hornalla/anafe -->
  <circle cx="195" cy="215" r="6" fill="none" stroke="#2D2D2D" stroke-width="1.2"/>
  <circle cx="195" cy="215" r="2" fill="#E74C3C" opacity="0.5"/>
  <path d="M195 208 Q198 212 195 215 Q192 212 195 208" fill="#E74C3C" opacity="0.6"/>
  <circle cx="215" cy="215" r="6" fill="none" stroke="#2D2D2D" stroke-width="1.2"/>
  <circle cx="215" cy="215" r="2" fill="#E74C3C" opacity="0.5"/>
  <path d="M215 208 Q218 212 215 215 Q212 212 215 208" fill="#E74C3C" opacity="0.6"/>
  <text x="175" y="310" text-anchor="middle" font-family="system-ui" font-size="10" font-weight="bold" fill="#2D2D2D">Cocina</text>

  <!-- Ventilación cocina -->
  <path d="M120 195 L110 185 L130 185 L120 195" fill="none" stroke="#3498DB" stroke-width="1.2"/>
  <line x1="120" y1="185" x2="120" y2="178" stroke="#3498DB" stroke-width="1"/>

  <!-- ==================== RAMAL CALEFÓN ==================== -->
  <line x1="400" y1="72" x2="400" y2="180" stroke="#F4D03F" stroke-width="4.5"/>

  <rect x="392" y="130" width="16" height="20" fill="#E67E22" stroke="#2D2D2D" stroke-width="1.2" rx="2"/>
  <text x="400" y="127" text-anchor="middle" font-family="system-ui" font-size="6" fill="#E67E22">Llave</text>
  <text x="400" y="156" text-anchor="middle" font-family="system-ui" font-size="6" fill="#E67E22">indiv.</text>

  <text x="415" y="90" font-family="system-ui" font-size="7" fill="#6B6B6B">Ramal calefón Ø 13mm</text>

  <!-- Calefón / Termotanque -->
  <rect x="340" y="195" width="120" height="100" fill="#E8E0D0" stroke="#2D2D2D" stroke-width="1.5" rx="4"/>
  <!-- Cuerpo -->
  <rect x="355" y="210" width="90" height="60" fill="#6B7B8D" stroke="#2D2D2D" stroke-width="1.5" rx="4"/>
  <!-- Display -->
  <rect x="370" y="218" width="40" height="15" fill="#2C3E50" rx="2"/>
  <text x="390" y="229" text-anchor="middle" font-family="system-ui" font-size="7" fill="#FFF">60°C</text>
  <!-- Llama azul -->
  <path d="M390 275 Q395 268 390 262 Q385 268 390 275" fill="#3498DB" opacity="0.8"/>
  <path d="M400 275 Q405 268 400 262 Q395 268 400 275" fill="#3498DB" opacity="0.8"/>
  <path d="M410 275 Q415 268 410 262 Q405 268 410 275" fill="#3498DB" opacity="0.8"/>
  <text x="400" y="310" text-anchor="middle" font-family="system-ui" font-size="10" font-weight="bold" fill="#2D2D2D">Calefón</text>

  <!-- Ventilación calefón -->
  <path d="M455 200 L465 190 L445 190 L455 200" fill="none" stroke="#3498DB" stroke-width="1.2"/>
  <line x1="455" y1="190" x2="455" y2="183" stroke="#3498DB" stroke-width="1"/>

  <!-- ==================== RAMAL CALEFACCIÓN ==================== -->
  <line x1="620" y1="72" x2="620" y2="180" stroke="#F4D03F" stroke-width="4.5"/>

  <rect x="612" y="130" width="16" height="20" fill="#E67E22" stroke="#2D2D2D" stroke-width="1.2" rx="2"/>
  <text x="620" y="127" text-anchor="middle" font-family="system-ui" font-size="6" fill="#E67E22">Llave</text>
  <text x="620" y="156" text-anchor="middle" font-family="system-ui" font-size="6" fill="#E67E22">indiv.</text>

  <text x="635" y="90" font-family="system-ui" font-size="7" fill="#6B6B6B">Ramal calefacción Ø 13mm</text>

  <!-- Calefacción (radiador) -->
  <rect x="565" y="195" width="110" height="100" fill="#E8E0D0" stroke="#2D2D2D" stroke-width="1.5" rx="4"/>
  <!-- Radiador -->
  <rect x="580" y="210" width="80" height="60" fill="#E74C3C" stroke="#2D2D2D" stroke-width="1.5" rx="4" opacity="0.75"/>
  <line x1="590" y1="218" x2="650" y2="218" stroke="#FFF" stroke-width="1.5" opacity="0.8"/>
  <line x1="590" y1="228" x2="650" y2="228" stroke="#FFF" stroke-width="1.5" opacity="0.8"/>
  <line x1="590" y1="238" x2="650" y2="238" stroke="#FFF" stroke-width="1.5" opacity="0.8"/>
  <line x1="590" y1="248" x2="650" y2="248" stroke="#FFF" stroke-width="1.5" opacity="0.8"/>
  <line x1="590" y1="258" x2="650" y2="258" stroke="#FFF" stroke-width="1.5" opacity="0.8"/>
  <text x="620" y="310" text-anchor="middle" font-family="system-ui" font-size="10" font-weight="bold" fill="#2D2D2D">Calefacción</text>

  <!-- Ventilación calefacción -->
  <path d="M570 200 L560 190 L580 190 L570 200" fill="none" stroke="#3498DB" stroke-width="1.2"/>
  <line x1="570" y1="190" x2="570" y2="183" stroke="#3498DB" stroke-width="1"/>

  <!-- ==================== LÍNEA DE VENTILACIÓN GENERAL ==================== -->
  <line x1="40" y1="340" x2="760" y2="340" stroke="#3498DB" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="400" y="355" text-anchor="middle" font-family="system-ui" font-size="9" fill="#3498DB">Ventilación obligatoria al exterior en cada ambiente con artefacto a gas</text>

  <!-- ==================== LEYENDA ==================== -->
  <rect x="80" y="380" width="14" height="14" fill="#F4D03F" rx="2"/>
  <text x="100" y="393" font-family="system-ui" font-size="9" fill="#2D2D2D">Caño de gas</text>

  <rect x="260" y="380" width="14" height="14" fill="#E67E22" rx="2"/>
  <text x="280" y="393" font-family="system-ui" font-size="9" fill="#2D2D2D">Llave de paso</text>

  <rect x="440" y="380" width="14" height="14" fill="#3498DB" rx="2"/>
  <text x="460" y="393" font-family="system-ui" font-size="9" fill="#2D2D2D">Ventilación obligatoria</text>

  <!-- ==================== RECUADRO DE ADVERTENCIA ==================== -->
  <rect x="50" y="415" width="700" height="65" fill="#FDF2F2" stroke="#E74C3C" stroke-width="2" rx="6"/>
  <rect x="50" y="415" width="8" height="65" fill="#E74C3C" rx="3"/>
  <text x="70" y="434" font-family="system-ui" font-size="12" font-weight="bold" fill="#E74C3C">⚠️ ADVERTENCIA: En caso de olor a gas</text>
  <text x="70" y="452" font-family="system-ui" font-size="10.5" fill="#2D2D2D">NO encender nada, NO usar celular, NO accionar interruptores eléctricos.</text>
  <text x="70" y="470" font-family="system-ui" font-size="10.5" fill="#2D2D2D">Abrir puertas y ventanas, salir del ambiente y llamar al 0800-XXX-XXXX desde el exterior.</text>
</svg>
