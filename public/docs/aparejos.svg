  <rect x="112" y="375" width="8" height="30" fill="#B8A99A" stroke="none"/>
  <rect x="159" y="375" width="8" height="30" fill="#B8A99A" stroke="none"/>
  <rect x="206" y="375" width="8" height="30" fill="#B8A99A" stroke="none"/>
