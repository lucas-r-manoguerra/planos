<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" fill="none">
  <rect width="800" height="550" fill="#FAF9F6" rx="8"/>
  <text x="400" y="30" text-anchor="middle" font-family="system-ui" font-size="16" font-weight="bold" fill="#1A1A1A">Aparejos de Mampostería</text>

  <!-- Quadrant dividers -->
  <line x1="400" y1="50" x2="400" y2="490" stroke="#D4C5B5" stroke-width="1.5"/>
  <line x1="30" y1="275" x2="770" y2="275" stroke="#D4C5B5" stroke-width="1.5"/>

  <!-- ============================================ -->
  <!-- QUADRANT 1: Soga (top-left) -->
  <!-- ============================================ -->
  <text x="215" y="75" text-anchor="middle" font-family="system-ui" font-size="13" font-weight="bold" fill="#1A1A1A">Aparejo a Soga</text>
  <text x="215" y="92" text-anchor="middle" font-family="system-ui" font-size="10" fill="#6B6B6B">14 cm (½ pie)</text>

  <!-- Hilada 1 -->
  <rect x="70" y="110" width="280" height="40" fill="#C17A57" stroke="#2D2D2D" stroke-width="1.5" rx="1"/>
  <!-- Brick divisions (3 ladrillos staggered) -->
  <line x1="163" y1="110" x2="163" y2="150" stroke="#2D2D2D" stroke-width="1.5"/>
  <line x1="256" y1="110" x2="256" y2="150" stroke="#2D2D2D" stroke-width="1.5"/>
  <!-- Mortar vertical between bricks -->
  <rect x="158" y="110" width="8" height="40" fill="#B8A99A" stroke="none"/>
  <rect x="251" y="110" width="8" height="40" fill="#B8A99A" stroke="none"/>

  <!-- Mortar horizontal hilada 1→2 -->
  <rect x="70" y="150" width="280" height="6" fill="#B8A99A" stroke="none"/>

  <!-- Hilada 2 (offset half) -->
  <rect x="70" y="156" width="280" height="40" fill="#C17A57" stroke="#2D2D2D" stroke-width="1.5" rx="1"/>
  <line x1="117" y1="156" x2="117" y2="196" stroke="#2D2D2D" stroke-width="1.5"/>
  <line x1="210" y1="156" x2="210" y2="196" stroke="#2D2D2D" stroke-width="1.5"/>
  <line x1="303" y1="156" x2="303" y2="196" stroke="#2D2D2D" stroke-width="1.5"/>
  <rect x="112" y="156" width="8" height="40" fill="#B8A99A" stroke="none"/>
  <rect x="205" y="156" width="8" height="40" fill="#B8A99A" stroke="none"/>
  <rect x="298" y="156" width="8" height="40" fill="#B8A99A" stroke="none"/>

  <!-- Mortar horizontal hilada 2→3 -->
  <rect x="70" y="196" width="280" height="6" fill="#B8A99A" stroke="none"/>

  <!-- Hilada 3 -->
  <rect x="70" y="202" width="280" height="40" fill="#C17A57" stroke="#2D2D2D" stroke-width="1.5" rx="1"/>
  <line x1="163" y1="202" x2="163" y2="242" stroke="#2D2D2D" stroke-width="1.5"/>
  <line x1="256" y1="202" x2="256" y2="242" stroke="#2D2D2D" stroke-width="1.5"/>
  <rect x="158" y="202" width="8" height="40" fill="#B8A99A" stroke="none"/>
  <rect x="251" y="202" width="8" height="40" fill="#B8A99A" stroke="none"/>

