  <!-- Dimensional annotations for Tizón -->
  <line x1="435" y1="253" x2="435" y2="280" stroke="#3B65A3" stroke-width="1"/>
  <line x1="745" y1="253" x2="745" y2="280" stroke="#3B65A3" stroke-width="1"/>
