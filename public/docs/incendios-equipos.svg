<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <marker id="arrow-evac" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#43A047" />
    </marker>
    <marker id="arrow-evac-end" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2E7D32" />
    </marker>
    <pattern id="smoke-pattern" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.2" fill="#B0BEC5" opacity="0.6" />
    </pattern>
    <pattern id="hose-pattern" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#E8EAF6" />
      <line x1="0" y1="2" x2="4" y2="2" stroke="#C5CAE9" stroke-width="0.5" />
    </pattern>
    <linearGradient id="extinguisher-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C62828" />
      <stop offset="30%" stop-color="#E53935" />
      <stop offset="50%" stop-color="#EF5350" />
      <stop offset="70%" stop-color="#E53935" />
      <stop offset="100%" stop-color="#B71C1C" />
    </linearGradient>
    <linearGradient id="cabinet-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D32F2F" />
      <stop offset="50%" stop-color="#E53935" />
      <stop offset="100%" stop-color="#C62828" />
    </linearGradient>
    <linearGradient id="wall-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#BDBDBD" />
      <stop offset="100%" stop-color="#9E9E9E" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="1" stdDeviation="1.5" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="800" height="600" fill="#FAFAFA" />

  <!-- Title -->
  <text x="400" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#37474F">Protección contra Incendios — Equipos y Sistemas</text>

  <!-- ==================== FLOOR PLAN ==================== -->

  <!-- Floor slab -->
  <rect x="60" y="50" width="680" height="500" fill="#F5F5F5" stroke="none" />

  <!-- Walls -->
  <!-- Top wall -->
  <rect x="60" y="50" width="680" height="10" fill="url(#wall-grad)" stroke="#616161" stroke-width="0.5" />
  <!-- Bottom wall (with door opening) -->
  <rect x="60" y="540" width="280" height="10" fill="url(#wall-grad)" stroke="#616161" stroke-width="0.5" />
  <rect x="500" y="540" width="240" height="10" fill="url(#wall-grad)" stroke="#616161" stroke-width="0.5" />
  <!-- Left wall -->
  <rect x="60" y="50" width="10" height="500" fill="url(#wall-grad)" stroke="#616161" stroke-width="0.5" />
  <!-- Right wall -->
  <rect x="730" y="50" width="10" height="500" fill="url(#wall-grad)" stroke="#616161" stroke-width="0.5" />

  <!-- Door opening indicators -->
  <rect x="340" y="540" width="160" height="10" fill="#F5F5F5" stroke="#9E9E9E" stroke-width="0.5" stroke-dasharray="4,3" />

  <!-- Door swing arc -->
  <path d="M420,540 A140,140 0 0,1 280,400" fill="none" stroke="#9E9E9E" stroke-width="1" stroke-dasharray="6,4" />
  <!-- Door leaf -->
  <line x1="420" y1="540" x2="420" y2="400" stroke="#8D6E63" stroke-width="3" />
  <line x1="420" y1="400" x2="280" y2="400" stroke="#8D6E63" stroke-width="3" />

  <!-- Exit sign above door -->
  <rect x="365" y="525" width="110" height="15" rx="2" fill="#1B5E20" />
  <text x="420" y="536" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="700" fill="white">SALIDA</text>

  <!-- Floor grid (subtle) -->
  <g stroke="#EEEEEE" stroke-width="0.5">
    <line x1="60" y1="150" x2="730" y2="150" />
    <line x1="60" y1="250" x2="730" y2="250" />
    <line x1="60" y1="350" x2="730" y2="350" />
    <line x1="60" y1="450" x2="730" y2="450" />
    <line x1="160" y1="50" x2="160" y2="540" />
    <line x1="260" y1="50" x2="260" y2="540" />
    <line x1="360" y1="50" x2="360" y2="540" />
    <line x1="460" y1="50" x2="460" y2="540" />
    <line x1="560" y1="50" x2="560" y2="540" />
    <line x1="660" y1="50" x2="660" y2="540" />
  </g>

  <!-- ==================== EVACUATION ROUTE ==================== -->
  <!-- Dashed path from center going toward door -->
  <path d="M400,420 L420,380 L420,300 L380,240 L350,180 L320,130 L340,60"
        fill="none" stroke="#43A047" stroke-width="2.5" stroke-dasharray="8,5"
        marker-end="url(#arrow-evac-end)" />

  <!-- Evacuation route waypoints -->
  <circle cx="400" cy="420" r="4" fill="#43A047" opacity="0.6" />
  <circle cx="420" cy="380" r="3" fill="#43A047" opacity="0.4" />
  <circle cx="420" cy="300" r="3" fill="#43A047" opacity="0.4" />

  <!-- ==================== 1. SMOKE DETECTOR (ceiling) ==================== -->
  <g transform="translate(240, 120)" filter="url(#shadow)">
    <!-- Ceiling mounting line -->
    <line x1="-15" y1="-25" x2="15" y2="-25" stroke="#757575" stroke-width="1" />
    <line x1="0" y1="-25" x2="0" y2="-18" stroke="#757575" stroke-width="1" />
    <!-- Detector body -->
    <circle cx="0" cy="0" r="16" fill="#ECEFF1" stroke="#90A4AE" stroke-width="1.5" />
    <circle cx="0" cy="0" r="12" fill="url(#smoke-pattern)" stroke="#B0BEC5" stroke-width="0.5" />
    <!-- Inner ring -->
    <circle cx="0" cy="0" r="7" fill="none" stroke="#78909C" stroke-width="0.8" />
    <!-- Center LED -->
    <circle cx="0" cy="0" r="2.5" fill="#D32F2F" />
    <!-- Label -->
    <text x="0" y="30" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#37474F" font-weight="600">Detector de humo</text>
    <!-- ID tag -->
    <rect x="-10" y="34" width="20" height="10" rx="1" fill="#FFF9C4" stroke="#F9A825" stroke-width="0.5" />
    <text x="0" y="42" text-anchor="middle" font-family="monospace" font-size="6" fill="#F57F17">DH-01</text>
  </g>

  <!-- ==================== 2. MANUAL PULL STATION ==================== -->
  <g transform="translate(85, 220)" filter="url(#shadow)">
    <!-- Wall mounting bracket -->
    <rect x="-4" y="-20" width="8" height="20" fill="#BDBDBD" stroke="#9E9E9E" stroke-width="0.5" />
    <!-- Pull station body -->
    <rect x="-16" y="-14" width="32" height="40" rx="3" fill="#D32F2F" stroke="#B71C1C" stroke-width="1.5" />
    <!-- Inner panel -->
    <rect x="-12" y="-10" width="24" height="32" rx="2" fill="#E53935" stroke="#C62828" stroke-width="0.5" />
    <!-- Handle -->
    <rect x="-4" y="-6" width="8" height="12" rx="1" fill="#FFEB3B" stroke="#F9A825" stroke-width="0.5" />
    <!-- Instruction text -->
    <text x="0" y="15" text-anchor="middle" font-family="sans-serif" font-size="5" fill="white" font-weight="700">TIRAR</text>
    <!-- Label -->
    <text x="0" y="52" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#37474F" font-weight="600">Alarma manual</text>
    <rect x="-10" y="56" width="20" height="10" rx="1" fill="#FFF9C4" stroke="#F9A825" stroke-width="0.5" />
    <text x="0" y="64" text-anchor="middle" font-family="monospace" font-size="6" fill="#F57F17">PM-01</text>
  </g>

  <!-- ==================== 3. FIRE EXTINGUISHER ==================== -->
  <g transform="translate(700, 220)" filter="url(#shadow)">
    <!-- Wall bracket -->
    <rect x="-8" y="-30" width="16" height="8" rx="1" fill="#757575" stroke="#616161" stroke-width="0.5" />
    <!-- Extinguisher body (cylinder) -->
    <rect x="-10" y="-22" width="20" height="46" rx="4" fill="url(#extinguisher-grad)" stroke="#B71C1C" stroke-width="1" />
    <!-- Top neck -->
    <rect x="-5" y="-26" width="10" height="6" rx="2" fill="#B0BEC5" stroke="#78909C" stroke-width="0.5" />
    <!-- Handle -->
    <rect x="-3" y="-30" width="6" height="4" rx="1" fill="#E0E0E0" stroke="#9E9E9E" stroke-width="0.5" />
    <!-- Safety pin -->
    <circle cx="-6" cy="-28" r="1.5" fill="#FFEB3B" stroke="#F9A825" stroke-width="0.3" />
    <!-- Label on extinguisher -->
    <rect x="-7" y="-10" width="14" height="20" rx="1" fill="white" opacity="0.9" />
    <text x="0" y="-3" text-anchor="middle" font-family="sans-serif" font-size="5" font-weight="700" fill="#D32F2F">ABC</text>
    <text x="0" y="4" text-anchor="middle" font-family="sans-serif" font-size="3.5" fill="#424242">POLVO</text>
    <text x="0" y="8" text-anchor="middle" font-family="sans-serif" font-size="3" fill="#424242">5kg</text>
    <!-- Label -->
    <text x="0" y="38" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#37474F" font-weight="600">Matafuego ABC</text>
    <rect x="-10" y="42" width="20" height="10" rx="1" fill="#FFF9C4" stroke="#F9A825" stroke-width="0.5" />
    <text x="0" y="50" text-anchor="middle" font-family="monospace" font-size="6" fill="#F57F17">MF-01</text>
  </g>

  <!-- ==================== 4. SPRINKLER HEAD ==================== -->
  <g transform="translate(550, 100)" filter="url(#shadow)">
    <!-- Ceiling mounting -->
    <line x1="-15" y1="-30" x2="15" y2="-30" stroke="#757575" stroke-width="1" />
    <line x1="0" y1="-30" x2="0" y2="-20" stroke="#757575" stroke-width="1" />
    <!-- Sprinkler head body -->
    <rect x="-6" y="-20" width="12" height="8" rx="2" fill="#BDBDBD" stroke="#9E9E9E" stroke-width="1" />
    <!-- Deflector plate -->
    <path d="M-10,-12 L10,-12 L8,-8 L-8,-8 Z" fill="#E0E0E0" stroke="#9E9E9E" stroke-width="0.8" />
    <!-- Water spray pattern -->
    <g opacity="0.5">
      <!-- Main spray arcs -->
      <path d="M-8,-8 Q-30,10 -25,40" fill="none" stroke="#4FC3F7" stroke-width="1.5" stroke-dasharray="3,3" />
      <path d="M8,-8 Q30,10 25,40" fill="none" stroke="#4FC3F7" stroke-width="1.5" stroke-dasharray="3,3" />
      <path d="M-4,-8 Q-20,15 -15,45" fill="none" stroke="#4FC3F7" stroke-width="1" stroke-dasharray="2,3" />
      <path d="M4,-8 Q20,15 15,45" fill="none" stroke="#4FC3F7" stroke-width="1" stroke-dasharray="2,3" />
      <path d="M0,-8 Q0,20 0,50" fill="none" stroke="#4FC3F7" stroke-width="1" stroke-dasharray="2,3" />
      <!-- Water droplets -->
      <circle cx="-22" cy="30" r="1" fill="#4FC3F7" opacity="0.6" />
      <circle cx="-18" cy="22" r="0.8" fill="#4FC3F7" opacity="0.5" />
      <circle cx="22" cy="28" r="1" fill="#4FC3F7" opacity="0.6" />
      <circle cx="15" cy="18" r="0.7" fill="#4FC3F7" opacity="0.5" />
      <circle cx="-5" cy="38" r="0.8" fill="#4FC3F7" opacity="0.5" />
      <circle cx="6" cy="35" r="0.9" fill="#4FC3F7" opacity="0.5" />
    </g>
    <!-- Label -->
    <text x="0" y="58" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#37474F" font-weight="600">Rociador</text>
    <rect x="-10" y="62" width="20" height="10" rx="1" fill="#FFF9C4" stroke="#F9A825" stroke-width="0.5" />
    <text x="0" y="70" text-anchor="middle" font-family="monospace" font-size="6" fill="#F57F17">SP-01</text>
  </g>

  <!-- ==================== 5. FIRE HOSE CABINET ==================== -->
  <g transform="translate(708, 380)" filter="url(#shadow)">
    <!-- Wall outline -->
    <rect x="-3" y="-22" width="6" height="22" fill="#9E9E9E" />
    <!-- Cabinet body -->
    <rect x="-22" y="-20" width="44" height="56" rx="2" fill="url(#cabinet-grad)" stroke="#B71C1C" stroke-width="1.5" />
    <!-- Cabinet door frame -->
    <rect x="-18" y="-16" width="36" height="48" rx="1" fill="white" fill-opacity="0.15" stroke="white" stroke-width="0.5" />
    <!-- Glass pane lines -->
    <line x1="-18" y1="8" x2="18" y2="8" stroke="white" stroke-width="0.3" opacity="0.4" />
    <!-- Hose icon (simplified) -->
    <rect x="-12" y="-8" width="8" height="24" rx="2" fill="#E8EAF6" stroke="#7986CB" stroke-width="0.5" />
    <circle cx="-8" cy="-12" r="4" fill="#E8EAF6" stroke="#7986CB" stroke-width="0.5" />
    <!-- Nozzle -->
    <rect x="5" y="-6" width="6" height="18" rx="1" fill="#E0E0E0" stroke="#9E9E9E" stroke-width="0.5" />
    <rect x="11" y="-2" width="4" height="10" rx="1" fill="#BDBDBD" stroke="#9E9E9E" stroke-width="0.5" />
    <!-- Handle bar -->
    <line x1="-18" y1="-2" x2="-12" y2="-2" stroke="white" stroke-width="1.5" stroke-dasharray="2,1" />
    <!-- Label -->
    <text x="0" y="48" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#37474F" font-weight="600">Boca de incendio</text>
    <rect x="-10" y="52" width="20" height="10" rx="1" fill="#FFF9C4" stroke="#F9A825" stroke-width="0.5" />
    <text x="0" y="60" text-anchor="middle" font-family="monospace" font-size="6" fill="#F57F17">BI-01</text>
  </g>

  <!-- ==================== 6. EVACUATION ROUTE LABEL ==================== -->
  <g transform="translate(460, 140)">
    <!-- Route legend box -->
    <rect x="-40" y="-12" width="80" height="18" rx="3" fill="white" stroke="#43A047" stroke-width="1" stroke-dasharray="4,3" />
    <line x1="-30" y1="-3" x2="-10" y2="-3" stroke="#43A047" stroke-width="2" stroke-dasharray="5,3" />
    <marker id="arrow-evac-sm" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L6,2.5 L0,5 Z" fill="#43A047" />
    </marker>
    <line x1="-10" y1="-3" x2="0" y2="-3" stroke="#43A047" stroke-width="2" marker-end="url(#arrow-evac-sm)" />
    <text x="15" y="-0.5" font-family="sans-serif" font-size="7" fill="#43A047" font-weight="600">Ruta de evacuación</text>
  </g>

  <!-- ==================== COMPASS / NORTH ARROW ==================== -->
  <g transform="translate(80, 520)">
    <circle cx="0" cy="0" r="12" fill="none" stroke="#BDBDBD" stroke-width="0.8" />
    <polygon points="0,-10 -4,4 0,0 4,4" fill="#D32F2F" />
    <polygon points="0,10 -4,-4 0,0 4,-4" fill="#BDBDBD" />
    <text x="0" y="-15" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#757575" font-weight="700">N</text>
  </g>

  <!-- ==================== LEGEND ==================== -->
  <g transform="translate(570, 515)">
    <rect x="0" y="0" width="170" height="85" rx="4" fill="white" stroke="#E0E0E0" stroke-width="1" />
    <text x="85" y="14" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="700" fill="#37474F">REFERENCIAS</text>
    <circle cx="12" cy="26" r="4" fill="#ECEFF1" stroke="#90A4AE" stroke-width="0.8" />
    <text x="22" y="29" font-family="sans-serif" font-size="7" fill="#616161">Detector / Sensor</text>
    <rect x="6" y="36" width="8" height="8" rx="1" fill="#D32F2F" />
    <text x="22" y="43" font-family="sans-serif" font-size="7" fill="#616161">Equipo activo</text>
    <line x1="6" y1="55" x2="16" y2="55" stroke="#43A047" stroke-width="2" stroke-dasharray="5,3" />
    <text x="22" y="58" font-family="sans-serif" font-size="7" fill="#616161">Ruta de evacuación</text>
    <line x1="6" y1="67" x2="16" y2="67" stroke="#4FC3F7" stroke-width="1.5" stroke-dasharray="3,3" />
    <text x="22" y="70" font-family="sans-serif" font-size="7" fill="#616161">Agua de rociadores</text>
  </g>

  <!-- Scale bar -->
  <g transform="translate(180, 558)">
    <line x1="0" y1="0" x2="80" y2="0" stroke="#757575" stroke-width="1" />
    <line x1="0" y1="-3" x2="0" y2="3" stroke="#757575" stroke-width="1" />
    <line x1="40" y1="-2" x2="40" y2="2" stroke="#757575" stroke-width="0.5" />
    <line x1="80" y1="-3" x2="80" y2="3" stroke="#757575" stroke-width="1" />
    <text x="0" y="10" text-anchor="middle" font-family="sans-serif" font-size="6" fill="#757575">0</text>
    <text x="40" y="10" text-anchor="middle" font-family="sans-serif" font-size="6" fill="#757575">5m</text>
    <text x="80" y="10" text-anchor="middle" font-family="sans-serif" font-size="6" fill="#757575">10m</text>
  </g>

</svg>
