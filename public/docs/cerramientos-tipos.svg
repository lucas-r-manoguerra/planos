<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#FAF9F6" rx="8"/>
  <text x="400" y="30" text-anchor="middle" font-family="system-ui" font-size="15" font-weight="bold" fill="#1A1A1A">Tipos de Cerramientos</text>

  <!-- === 1. Ventana Corrediza === -->
  <rect x="20" y="50" width="185" height="410" fill="#F5F3EF" stroke="#E0DDD6" rx="6"/>
  <text x="112" y="75" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="bold" fill="#1A1A1A">Ventana Corrediza</text>

  <!-- Wall opening -->
  <rect x="40" y="100" width="145" height="260" fill="#D4C5B5" stroke="#4A4A4A" stroke-width="2" rx="2"/>
  <!-- Frame -->
  <rect x="48" y="110" width="129" height="240" fill="#E0E0E0" stroke="#6B6B6B" stroke-width="2" rx="1"/>
  <!-- Glass panel left -->
  <rect x="54" y="116" width="55" height="228" fill="#B3D4E0" stroke="#8A8A8A" stroke-width="1.5" rx="1" opacity="0.8"/>
  <!-- Glass panel right -->
  <rect x="113" y="116" width="58" height="228" fill="#B3D4E0" stroke="#8A8A8A" stroke-width="1.5" rx="1" opacity="0.8"/>

  <!-- Handle on right panel -->
  <rect x="162" y="220" width="4" height="30" fill="#6B6B6B" stroke="#2D2D2D" stroke-width="0.5" rx="2"/>
  <!-- Handle on left panel -->
  <rect x="103" y="220" width="4" height="30" fill="#6B6B6B" stroke="#2D2D2D" stroke-width="0.5" rx="2"/>

  <!-- Track indication -->
  <line x1="48" y1="355" x2="177" y2="355" stroke="#6B6B6B" stroke-width="2"/>
  <line x1="48" y1="360" x2="177" y2="360" stroke="#6B6B6B" stroke-width="2"/>

  <!-- Sliding arrow -->
  <text x="85" y="350" text-anchor="middle" font-family="system-ui" font-size="10" fill="#2B7BE4">→</text>
  <text x="150" y="390" text-anchor="middle" font-family="system-ui" font-size="8" fill="#E74C3C"></text>

  <text x="112" y="410" text-anchor="middle" font-family="system-ui" font-size="9" fill="#6B6B6B">Dos hojas deslizantes</text>
  <text x="112" y="425" text-anchor="middle" font-family="system-ui" font-size="9" fill="#6B6B6B">Marco de aluminio</text>
  <text x="112" y="445" text-anchor="middle" font-family="system-ui" font-size="9" fill="#2B7BE4">Ahorra espacio interior</text>

  <!-- === 2. Ventana Batiente === -->
  <rect x="210" y="50" width="185" height="410" fill="#F5F3EF" stroke="#E0DDD6" rx="6"/>
  <text x="302" y="75" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="bold" fill="#1A1A1A">Ventana Batiente</text>

  <!-- Wall opening -->
  <rect x="230" y="100" width="145" height="260" fill="#D4C5B5" stroke="#4A4A4A" stroke-width="2" rx="2"/>
  <!-- Frame -->
  <rect x="238" y="110" width="129" height="240" fill="#E0E0E0" stroke="#6B6B6B" stroke-width="2" rx="1"/>
  <!-- Glass -->
  <rect x="244" y="116" width="117" height="228" fill="#B3D4E0" stroke="#8A8A8A" stroke-width="1.5" rx="1" opacity="0.8"/>

  <!-- Hinges on left -->
  <rect x="235" y="140" width="6" height="14" fill="#6B6B6B" stroke="#2D2D2D" stroke-width="0.5" rx="1"/>
  <rect x="235" y="300" width="6" height="14" fill="#6B6B6B" stroke="#2D2D2D" stroke-width="0.5" rx="1"/>

  <!-- Handle on right -->
  <rect x="352" y="220" width="4" height="24" fill="#6B6B6B" stroke="#2D2D2D" stroke-width="0.5" rx="2"/>

  <!-- Opening arc (swing out) -->
  <path d="M244 200 Q210 200 200 300 Q195 350 244 350" stroke="#2B7BE4" stroke-width="1.5" fill="none" stroke-dasharray="4 3" opacity="0.6"/>
  <line x1="244" y1="116" x2="200" y2="300" stroke="#2B7BE4" stroke-width="1" stroke-dasharray="4 3" opacity="0.4"/>

  <!-- Arrow showing swing -->
  <path d="M240 180 Q210 240 220 290" stroke="#2B7BE4" stroke-width="1.5" fill="none" marker-end="url(#arrowBlue)"/>

  <text x="302" y="410" text-anchor="middle" font-family="system-ui" font-size="9" fill="#6B6B6B">Apertura hacia afuera</text>
  <text x="302" y="425" text-anchor="middle" font-family="system-ui" font-size="9" fill="#6B6B6B">Bisagras laterales</text>
  <text x="302" y="445" text-anchor="middle" font-family="system-ui" font-size="9" fill="#2B7BE4">Ventilación completa</text>

  <!-- === 3. Paño Fijo === -->
  <rect x="400" y="50" width="185" height="410" fill="#F5F3EF" stroke="#E0DDD6" rx="6"/>
  <text x="492" y="75" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="bold" fill="#1A1A1A">Paño Fijo</text>

  <!-- Wall opening -->
  <rect x="420" y="100" width="145" height="260" fill="#D4C5B5" stroke="#4A4A4A" stroke-width="2" rx="2"/>
  <!-- Frame -->
  <rect x="428" y="110" width="129" height="240" fill="#E0E0E0" stroke="#6B6B6B" stroke-width="2" rx="1"/>
  <!-- Large glass panel -->
  <rect x="434" y="116" width="117" height="228" fill="#87CEEB" stroke="#8A8A8A" stroke-width="1.5" rx="1" opacity="0.7"/>

  <!-- Glass reflection lines -->
  <line x1="450" y1="130" x2="450" y2="330" stroke="white" stroke-width="1" opacity="0.4"/>
  <line x1="520" y1="130" x2="520" y2="330" stroke="white" stroke-width="1" opacity="0.4"/>

  <!-- Sun icon -->
  <circle cx="540" cy="140" r="12" fill="#F9D71C" opacity="0.7"/>
  <line x1="540" y1="124" x2="540" y2="120" stroke="#F9D71C" stroke-width="1.5"/>
  <line x1="540" y1="156" x2="540" y2="160" stroke="#F9D71C" stroke-width="1.5"/>
  <line x1="524" y1="140" x2="520" y2="140" stroke="#F9D71C" stroke-width="1.5"/>
  <line x1="556" y1="140" x2="560" y2="140" stroke="#F9D71C" stroke-width="1.5"/>

  <text x="492" y="410" text-anchor="middle" font-family="system-ui" font-size="9" fill="#6B6B6B">Vidrio fijo sin apertura</text>
  <text x="492" y="425" text-anchor="middle" font-family="system-ui" font-size="9" fill="#6B6B6B">Marco perimetral</text>
  <text x="492" y="445" text-anchor="middle" font-family="system-ui" font-size="9" fill="#2B7BE4">Máxima iluminación</text>

  <!-- === 4. Cortina de Enrollar === -->
  <rect x="590" y="50" width="185" height="410" fill="#F5F3EF" stroke="#E0DDD6" rx="6"/>
  <text x="682" y="75" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="bold" fill="#1A1A1A">Cortina de Enrollar</text>

  <!-- Wall opening -->
  <rect x="610" y="100" width="145" height="260" fill="#D4C5B5" stroke="#4A4A4A" stroke-width="2" rx="2"/>

  <!-- Roller box at top -->
  <rect x="608" y="100" width="149" height="30" fill="#6B6B6B" stroke="#2D2D2D" stroke-width="2" rx="3"/>
  <text x="682" y="118" text-anchor="middle" font-family="system-ui" font-size="8" fill="white">Tambor / Eje</text>

  <!-- Roller shutter slats -->
  <rect x="616" y="130" width="133" height="8" fill="#8A8A8A" stroke="#5A5A5A" stroke-width="0.5" rx="0"/>
  <rect x="616" y="140" width="133" height="8" fill="#7A7A7A" stroke="#5A5A5A" stroke-width="0.5" rx="0"/>
  <rect x="616" y="150" width="133" height="8" fill="#8A8A8A" stroke="#5A5A5A" stroke-width="0.5" rx="0"/>
  <rect x="616" y="160" width="133" height="8" fill="#7A7A7A" stroke="#5A5A5A" stroke-width="0.5" rx="0"/>
  <rect x="616" y="170" width="133" height="8" fill="#8A8A8A" stroke="#5A5A5A" stroke-width="0.5" rx="0"/>
  <rect x="616" y="180" width="133" height="8" fill="#7A7A7A" stroke="#5A5A5A" stroke-width="0.5" rx="0"/>
  <rect x="616" y="190" width="133" height="8" fill="#8A8A8A" stroke="#5A5A5A" stroke-width="0.5" rx="0"/>
  <rect x="616" y="200" width="133" height="8" fill="#7A7A7A" stroke="#5A5A5A" stroke-width="0.5" rx="0"/>
  <rect x="616" y="210" width="133" height="8" fill="#8A8A8A" stroke="#5A5A5A" stroke-width="0.5" rx="0"/>
  <rect x="616" y="220" width="133" height="8" fill="#7A7A7A" stroke="#5A5A5A" stroke-width="0.5" rx="0"/>
  <rect x="616" y="230" width="133" height="8" fill="#8A8A8A" stroke="#5A5A5A" stroke-width="0.5" rx="0"/>
  <rect x="616" y="240" width="133" height="8" fill="#7A7A7A" stroke="#5A5A5A" stroke-width="0.5" rx="0"/>
  <rect x="616" y="250" width="133" height="8" fill="#8A8A8A" stroke="#5A5A5A" stroke-width="0.5" rx="0"/>
  <rect x="616" y="260" width="133" height="8" fill="#7A7A7A" stroke="#5A5A5A" stroke-width="0.5" rx="0"/>
  <rect x="616" y="270" width="133" height="8" fill="#8A8A8A" stroke="#5A5A5A" stroke-width="0.5" rx="0"/>
  <rect x="616" y="280" width="133" height="8" fill="#7A7A7A" stroke="#5A5A5A" stroke-width="0.5" rx="0"/>
  <rect x="616" y="290" width="133" height="8" fill="#8A8A8A" stroke="#5A5A5A" stroke-width="0.5" rx="0"/>
  <rect x="616" y="300" width="133" height="8" fill="#7A7A7A" stroke="#5A5A5A" stroke-width="0.5" rx="0"/>
  <rect x="616" y="308" width="133" height="8" fill="#8A8A8A" stroke="#5A5A5A" stroke-width="0.5" rx="0"/>
  <rect x="616" y="316" width="133" height="8" fill="#7A7A7A" stroke="#5A5A5A" stroke-width="0.5" rx="0"/>
  <rect x="616" y="324" width="133" height="8" fill="#8A8A8A" stroke="#5A5A5A" stroke-width="0.5" rx="0"/>
  <rect x="616" y="332" width="133" height="8" fill="#7A7A7A" stroke="#5A5A5A" stroke-width="0.5" rx="0"/>
  <rect x="616" y="340" width="133" height="8" fill="#8A8A8A" stroke="#5A5A5A" stroke-width="0.5" rx="0"/>
  <rect x="616" y="348" width="133" height="8" fill="#7A7A7A" stroke="#5A5A5A" stroke-width="0.5" rx="0"/>

  <!-- Bottom bar -->
  <rect x="614" y="356" width="137" height="10" fill="#5A5A5A" stroke="#2D2D2D" stroke-width="1" rx="2"/>

  <!-- Guide rails -->
  <rect x="610" y="100" width="6" height="260" fill="#6B6B6B" stroke="#2D2D2D" stroke-width="0.5" rx="0"/>
  <rect x="749" y="100" width="6" height="260" fill="#6B6B6B" stroke="#2D2D2D" stroke-width="0.5" rx="0"/>

  <!-- Pull cord -->
  <line x1="680" y1="366" x2="680" y2="385" stroke="#6B6B6B" stroke-width="1.5"/>
  <circle cx="680" cy="390" r="4" fill="#6B6B6B"/>

  <text x="682" y="420" text-anchor="middle" font-family="system-ui" font-size="9" fill="#6B6B6B">Lamas de aluminio o PVC</text>
  <text x="682" y="435" text-anchor="middle" font-family="system-ui" font-size="9" fill="#6B6B6B">Enrollable en tambor</text>
  <text x="682" y="455" text-anchor="middle" font-family="system-ui" font-size="9" fill="#2B7BE4">Seguridad y aislamiento</text>

  <defs>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2B7BE4"/>
    </marker>
  </defs>
</svg>
