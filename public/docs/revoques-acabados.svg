  <line x1="545" y1="65" x2="545" y2="275" stroke="#C0B090" stroke-width="1.2"/>
  <line x1="555" y1="65" x2="555" y2="275" stroke="#C0B090" stroke-width="1.2"/>
  <line x1="565" y1="65" x2="565" y2="275" stroke="#C0B090" stroke-width="1.2"/>
  <line x1="575" y1="65" x2="575" y2="275" stroke="#C0B090" stroke-width="1.2"/>

