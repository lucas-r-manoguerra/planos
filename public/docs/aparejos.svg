  <rect x="435" y="202" width="310" height="40" fill="#C17A57" stroke="#2D2D2D" stroke-width="1.5" rx="1"/>
  <line x1="495" y1="202" x2="495" y2="242" stroke="#2D2D2D" stroke-width="1.5"/>
  <line x1="555" y1="202" x2="555" y2="242" stroke="#2D2D2D" stroke-width="1.5"/>
  <line x1="615" y1="202" x2="615" y2="242" stroke="#2D2D2D" stroke-width="1.5"/>
  <line x1="675" y1="202" x2="675" y2="242" stroke="#2D2D2D" stroke-width="1.5"/>
  <rect x="490" y="202" width="8" height="40" fill="#B8A99A" stroke="none"/>
  <rect x="550" y="202" width="8" height="40" fill="#B8A99A" stroke="none"/>
  <rect x="610" y="202" width="8" height="40" fill="#B8A99A" stroke="none"/>
  <rect x="670" y="202" width="8" height="40" fill="#B8A99A" stroke="none"/>

  <text x="605" y="268" text-anchor="middle" font-family="system-ui" font-size="10" fill="#6B6B6B">Ladrillos de punta, ancho doble</text>

  <!-- Dimensional annotations for Soga -->
  <line x1="70" y1="253" x2="70" y2="280" stroke="#3B65A3" stroke-width="1"/>
  <line x1="350" y1="253" x2="350" y2="280" stroke="#3B65A3" stroke-width="1"/>
  <line x1="70" y1="275" x2="350" y2="275" stroke="#3B65A3" stroke-width="1"/>
