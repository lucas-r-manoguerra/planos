<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#FAF9F6" rx="8"/>
  <text x="400" y="30" text-anchor="middle" font-family="system-ui" font-size="15" font-weight="bold" fill="#1A1A1A">Armaduras Típicas de Acero en Hormigón Armado</text>

  <!-- === IZQUIERDA: Columna (corte) === -->
  <rect x="30" y="50" width="350" height="420" fill="#F5F3EF" stroke="#E0DDD6" rx="6"/>
  <text x="205" y="75" text-anchor="middle" font-family="system-ui" font-size="13" font-weight="bold" fill="#1A1A1A">Columna — Corte Transversal</text>

  <!-- Concrete column section -->
  <rect x="90" y="100" width="230" height="230" fill="#A8B5A0" stroke="#2D2D2D" stroke-width="2" rx="4"/>

  <!-- Stirrups (estribos) — outer ring -->
  <rect x="118" y="128" width="174" height="174" fill="none" stroke="#8B4513" stroke-width="2" stroke-dasharray="4,3" rx="2"/>

  <!-- Stirrups — inner ring -->
  <rect x="126" y="136" width="158" height="158" fill="none" stroke="#8B4513" stroke-width="2" stroke-dasharray="4,3" rx="2"/>

  <!-- 4 longitudinal bars at corners -->
  <circle cx="130" cy="140" r="6" fill="#8B4513" stroke="#5C2E0A" stroke-width="1.5"/>
  <circle cx="280" cy="140" r="6" fill="#8B4513" stroke="#5C2E0A" stroke-width="1.5"/>
  <circle cx="130" cy="290" r="6" fill="#8B4513" stroke="#5C2E0A" stroke-width="1.5"/>
  <circle cx="280" cy="290" r="6" fill="#8B4513" stroke="#5C2E0A" stroke-width="1.5"/>

  <!-- Additional stirrup marks on sides -->
  <text x="86" y="160" font-family="system-ui" font-size="8" fill="#6B6B6B">estribos</text>
  <text x="86" y="172" font-family="system-ui" font-size="8" fill="#6B6B6B">Ø 6 c/20</text>

  <!-- Vertical stirrup spacing diagram -->
  <line x1="335" y1="120" x2="335" y2="310" stroke="#2D2D2D" stroke-width="1"/>
  <line x1="330" y1="140" x2="340" y2="140" stroke="#2D2D2D" stroke-width="1"/>
  <line x1="330" y1="160" x2="340" y2="160" stroke="#2D2D2D" stroke-width="1"/>
  <line x1="330" y1="180" x2="340" y2="180" stroke="#2D2D2D" stroke-width="1"/>
  <line x1="330" y1="200" x2="340" y2="200" stroke="#2D2D2D" stroke-width="1"/>
  <line x1="330" y1="220" x2="340" y2="220" stroke="#2D2D2D" stroke-width="1"/>
  <line x1="330" y1="240" x2="340" y2="240" stroke="#2D2D2D" stroke-width="1"/>
  <line x1="330" y1="260" x2="340" y2="260" stroke="#2D2D2D" stroke-width="1"/>
  <line x1="330" y1="280" x2="340" y2="280" stroke="#2D2D2D" stroke-width="1"/>
  <line x1="330" y1="300" x2="340" y2="300" stroke="#2D2D2D" stroke-width="1"/>
  <text x="325" y="335" text-anchor="end" font-family="system-ui" font-size="8" fill="#6B6B6B">c/20 cm</text>

  <!-- Recubrimiento annotation -->
  <line x1="80" y1="100" x2="80" y2="80" stroke="#E74C3C" stroke-width="1.5"/>
  <line x1="130" y1="100" x2="130" y2="80" stroke="#E74C3C" stroke-width="1.5"/>
  <line x1="80" y1="80" x2="130" y2="80" stroke="#E74C3C" stroke-width="1.5"/>
  <text x="105" y="75" text-anchor="middle" font-family="system-ui" font-size="8" fill="#E74C3C">recub.</text>

  <!-- Label -->
  <text x="205" y="380" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="bold" fill="#2D2D2D">Columna: 4 Ø 12</text>
  <text x="205" y="398" text-anchor="middle" font-family="system-ui" font-size="10" fill="#6B6B6B">+ estribos Ø 6 c/20</text>
  <text x="205" y="420" text-anchor="middle" font-family="system-ui" font-size="10" fill="#6B6B6B">4 barras principales en esquinas</text>
  <text x="205" y="436" text-anchor="middle" font-family="system-ui" font-size="10" fill="#6B6B6B">Estribos rectangulares cerrados</text>

  <!-- === DERECHA: Viga (corte) === -->
  <rect x="420" y="50" width="350" height="420" fill="#F5F3EF" stroke="#E0DDD6" rx="6"/>
  <text x="595" y="75" text-anchor="middle" font-family="system-ui" font-size="13" font-weight="bold" fill="#1A1A1A">Viga — Corte Transversal</text>

  <!-- Concrete beam section (horizontal rectangle) -->
  <rect x="465" y="140" width="260" height="180" fill="#A8B5A0" stroke="#2D2D2D" stroke-width="2" rx="4"/>

  <!-- Stirrups (estribos) -->
  <rect x="485" y="160" width="220" height="140" fill="none" stroke="#8B4513" stroke-width="2" stroke-dasharray="4,3" rx="2"/>

  <!-- 2 top bars (Ø 8) -->
  <circle cx="500" cy="170" r="5" fill="#8B4513" stroke="#5C2E0A" stroke-width="1.5"/>
  <circle cx="690" cy="170" r="5" fill="#8B4513" stroke="#5C2E0A" stroke-width="1.5"/>
  <!-- Top bars annotation -->
  <text x="595" y="165" text-anchor="middle" font-family="system-ui" font-size="7" fill="#5C2E0A">2 Ø 8 sup.</text>

  <!-- 4 bottom bars (Ø 12) -->
  <circle cx="510" cy="305" r="6" fill="#8B4513" stroke="#5C2E0A" stroke-width="1.5"/>
  <circle cx="540" cy="305" r="6" fill="#8B4513" stroke="#5C2E0A" stroke-width="1.5"/>
  <circle cx="650" cy="305" r="6" fill="#8B4513" stroke="#5C2E0A" stroke-width="1.5"/>
  <circle cx="680" cy="305" r="6" fill="#8B4513" stroke="#5C2E0A" stroke-width="1.5"/>
  <!-- Bottom bars annotation -->
  <text x="595" y="320" text-anchor="middle" font-family="system-ui" font-size="7" fill="#5C2E0A">4 Ø 12 inf.</text>

  <!-- Compression / Tension arrows -->
  <!-- Compression (top) -->
  <line x1="470" y1="145" x2="720" y2="145" stroke="#2D2D2D" stroke-width="1.5"/>
  <polygon points="720,145 715,140 715,150" fill="#2D2D2D"/>
  <text x="595" y="138" text-anchor="middle" font-family="system-ui" font-size="10" font-weight="bold" fill="#2D2D2D">COMPRESIÓN</text>

  <!-- Tension (bottom) -->
  <line x1="470" y1="345" x2="720" y2="345" stroke="#E74C3C" stroke-width="1.5"/>
  <polygon points="470,345 475,340 475,350" fill="#E74C3C"/>
  <text x="595" y="360" text-anchor="middle" font-family="system-ui" font-size="10" font-weight="bold" fill="#E74C3C">TRACCIÓN</text>

  <!-- Arrow labels -->
  <text x="595" y="130" text-anchor="middle" font-family="system-ui" font-size="8" fill="#2D2D2D">(hormigón resiste)</text>
  <text x="595" y="372" text-anchor="middle" font-family="system-ui" font-size="8" fill="#E74C3C">(acero resiste)</text>

  <!-- Label -->
  <text x="595" y="405" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="bold" fill="#2D2D2D">Viga: 4 Ø 12 inferior</text>
  <text x="595" y="423" text-anchor="middle" font-family="system-ui" font-size="10" fill="#6B6B6B">+ 2 Ø 8 superior + estribos Ø 6</text>

  <!-- === Footer annotation === -->
  <rect x="100" y="470" width="600" height="24" fill="#F5F3EF" stroke="#E0DDD6" rx="4"/>
  <text x="400" y="486" text-anchor="middle" font-family="system-ui" font-size="10" fill="#E74C3C">Recubrimiento mínimo: 3 cm interiores, 5 cm exteriores — IRAM-IAS U 500-502</text>
</svg>
