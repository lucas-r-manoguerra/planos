<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <text x="400" y="30" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#444">Rampa Accesible — Corte Lateral</text>
  <!-- Ground -->
  <line x1="20" y1="420" x2="780" y2="420" stroke="#888" stroke-width="2"/>
  <!-- Bottom landing 1.50m -->
  <rect x="40" y="380" width="100" height="40" fill="#d6e8f0" stroke="#3a7ca5" stroke-width="2"/>
  <text x="90" y="410" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#3a7ca5">descanso 1.50m</text>
  <!-- Ramp 8% -->
  <polygon points="140,380 140,420 700,340 700,380" fill="#b0d4e8" stroke="#3a7ca5" stroke-width="2"/>
  <text x="420" y="395" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#2a5c7a" font-weight="bold">Pendiente 8% máx.</text>
  <text x="420" y="410" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#3a7ca5">(8 cm por cada metro)</text>
  <!-- Top landing 1.50m -->
  <rect x="700" y="300" width="80" height="40" fill="#d6e8f0" stroke="#3a7ca5" stroke-width="2"/>
  <text x="740" y="330" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#3a7ca5">descanso 1.50m</text>
  <!-- Handrails -->
  <line x1="140" y1="360" x2="700" y2="320" stroke="#666" stroke-width="3"/>
  <line x1="140" y1="370" x2="700" y2="330" stroke="#888" stroke-width="2"/>
  <line x1="100" y1="360" x2="140" y2="360" stroke="#666" stroke-width="3"/>
  <line x1="100" y1="370" x2="140" y2="370" stroke="#888" stroke-width="2"/>
  <line x1="700" y1="320" x2="740" y2="320" stroke="#666" stroke-width="3"/>
  <line x1="700" y1="330" x2="740" y2="330" stroke="#888" stroke-width="2"/>
  <text x="155" y="355" font-family="sans-serif" font-size="9" fill="#666">pasamanos doble</text>
  <!-- Wheelchair person -->
  <circle cx="90" cy="365" r="10" fill="none" stroke="#555" stroke-width="1.5"/>
  <line x1="90" y1="375" x2="90" y2="400" stroke="#555" stroke-width="1.5"/>
  <line x1="75" y1="380" x2="105" y2="380" stroke="#555" stroke-width="1.5"/>
  <circle cx="75" cy="386" r="7" stroke="#555" stroke-width="1.5" fill="none"/>
  <circle cx="105" cy="386" r="7" stroke="#555" stroke-width="1.5" fill="none"/>
  <line x1="90" y1="400" x2="75" y2="386" stroke="#555" stroke-width="1.5"/>
  <line x1="90" y1="400" x2="105" y2="386" stroke="#555" stroke-width="1.5"/>
  <!-- Height dimension -->
  <line x1="760" y1="300" x2="760" y2="420" stroke="#999" stroke-width="1"/>
  <path d="M 760 300 L 755 310 M 760 420 L 755 410" fill="none" stroke="#999" stroke-width="1"/>
  <text x="770" y="365" font-family="sans-serif" font-size="10" fill="#888">H</text>
  <!-- Length dimension -->
  <path d="M 140 435 L 148 440 M 700 435 L 692 440" fill="none" stroke="#999" stroke-width="1"/>
  <line x1="145" y1="437" x2="695" y2="437" stroke="#999" stroke-width="1"/>
  <text x="420" y="450" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#888">Largo rampa (variable según altura)</text>
</svg>