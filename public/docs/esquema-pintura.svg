<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#FAF9F6" rx="8"/>
  <text x="400" y="30" text-anchor="middle" font-family="system-ui" font-size="15" font-weight="bold" fill="#1A1A1A">Esquema de Pintura — Capas en Pared</text>

  <!-- === WALL STACK (horizontal cross-section, left side) === -->

  <!-- Layer 1: Wall / Plaster (base) — warm beige -->
  <rect x="50" y="80" width="120" height="360" fill="#E8D5B7" stroke="#A0896A" stroke-width="2" rx="2"/>

  <!-- Layer 2: Enduido / Masilla — light gray -->
  <rect x="170" y="80" width="40" height="360" fill="#D5D5D5" stroke="#999" stroke-width="2" rx="1"/>

  <!-- Layer 3: Primer / Primer — white -->
  <rect x="210" y="80" width="25" height="360" fill="#F5F5F5" stroke="#CCC" stroke-width="2" rx="1"/>

  <!-- Layer 4: Mano 1 (first coat) — light blue, slightly uneven top -->
  <path d="M235 80 Q245 78 248 82 Q252 79 255 80 Q258 77 260 80 L260 440 Q258 443 255 440 Q252 443 248 440 Q245 443 235 440 Z" fill="#B3D9F2" stroke="#7BAFD4" stroke-width="2"/>

  <!-- Layer 5: Mano 2 (second coat) — solid blue, smooth top -->
  <rect x="260" y="80" width="35" height="360" fill="#4A90D9" stroke="#2B6CB0" stroke-width="2" rx="1"/>

  <!-- === LABELS WITH LINES === -->

  <!-- Layer 1 label -->
  <line x1="110" y1="400" x2="110" y2="470" stroke="#A0896A" stroke-width="1.5"/>
  <line x1="50" y1="470" x2="170" y2="470" stroke="#A0896A" stroke-width="1.5"/>
  <circle cx="110" cy="400" r="3" fill="#A0896A"/>
  <text x="110" y="483" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="bold" fill="#A0896A">Pared / Yeso</text>

  <!-- Layer 2 label -->
  <line x1="190" y1="350" x2="190" y2="500" stroke="#999" stroke-width="1.5"/>
  <circle cx="190" cy="350" r="3" fill="#999"/>
  <text x="190" y="513" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="bold" fill="#666">Enduido / Masilla</text>

  <!-- Layer 3 label -->
  <line x1="222" y1="300" x2="222" y2="440" stroke="#AAA" stroke-width="1.5"/>
  <line x1="170" y1="440" x2="300" y2="440" stroke="#AAA" stroke-width="1.5"/>
  <circle cx="222" cy="300" r="3" fill="#AAA"/>
  <text x="235" y="453" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="bold" fill="#666">Imprimación / Sellador</text>

  <!-- Layer 4 label -->
  <line x1="247" y1="280" x2="247" y2="420" stroke="#7BAFD4" stroke-width="1.5"/>
  <line x1="210" y1="420" x2="320" y2="420" stroke="#7BAFD4" stroke-width="1.5"/>
  <circle cx="247" cy="280" r="3" fill="#7BAFD4"/>
  <text x="265" y="433" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="bold" fill="#7BAFD4">Mano 1 (base)</text>

  <!-- Layer 5 label -->
  <line x1="277" y1="200" x2="277" y2="390" stroke="#2B6CB0" stroke-width="1.5"/>
  <line x1="260" y1="390" x2="350" y2="390" stroke="#2B6CB0" stroke-width="1.5"/>
  <circle cx="277" cy="200" r="3" fill="#2B6CB0"/>
  <text x="315" y="403" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="bold" fill="#2B6CB0">Mano 2 (terminación)</text>

  <!-- === RIGHT SIDE: illustrative detail === -->
  <!-- Magnified detail box -->
  <rect x="440" y="70" width="320" height="380" fill="#F8F6F2" stroke="#E0DDD6" stroke-width="1.5" rx="6"/>
  <text x="600" y="95" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="bold" fill="#1A1A1A">Detalle ampliado</text>

  <!-- Magnified layers -->
  <rect x="470" y="120" width="70" height="280" fill="#E8D5B7" stroke="#A0896A" stroke-width="1.5" rx="1"/>
  <rect x="540" y="120" width="35" height="280" fill="#D5D5D5" stroke="#999" stroke-width="1.5" rx="1"/>
  <rect x="575" y="120" width="20" height="280" fill="#F5F5F5" stroke="#CCC" stroke-width="1.5" rx="1"/>
  <path d="M595 120 Q600 118 603 122 Q606 119 610 120 Q613 118 615 120 L615 400 Q613 402 610 400 Q606 402 603 400 Q600 402 595 400 Z" fill="#B3D9F2" stroke="#7BAFD4" stroke-width="1.5"/>
  <rect x="615" y="120" width="30" height="280" fill="#4A90D9" stroke="#2B6CB0" stroke-width="1.5" rx="1"/>

  <!-- Detail labels -->
  <text x="600" y="430" text-anchor="middle" font-family="system-ui" font-size="9" fill="#A0896A">Yeso</text>
  <text x="600" y="445" text-anchor="middle" font-family="system-ui" font-size="9" fill="#666">Masilla</text>
  <text x="600" y="460" text-anchor="middle" font-family="system-ui" font-size="9" fill="#666">Sellador</text>
  <text x="600" y="475" text-anchor="middle" font-family="system-ui" font-size="9" fill="#7BAFD4">Mano 1</text>
  <text x="600" y="490" text-anchor="middle" font-family="system-ui" font-size="9" fill="#2B6CB0">Mano 2</text>

  <!-- === BRUSH ICON === -->
  <g transform="translate(500, 360)">
    <rect x="0" y="0" width="50" height="12" fill="#4A90D9" stroke="#2B6CB0" stroke-width="1" rx="2"/>
    <rect x="10" y="12" width="30" height="25" fill="#8B6914" stroke="#6B4F1A" stroke-width="1" rx="1"/>
    <path d="M10 37 Q10 42 0 45" stroke="#6B4F1A" stroke-width="1" fill="none"/>
    <path d="M40 37 Q40 42 50 45" stroke="#6B4F1A" stroke-width="1" fill="none"/>
    <text x="25" y="55" text-anchor="middle" font-family="system-ui" font-size="8" fill="#666">Pincel</text>
  </g>

  <!-- === TIPS box === -->
  <rect x="440" y="410" width="150" height="45" fill="#FFF8E1" stroke="#F0C060" stroke-width="1" rx="4"/>
  <text x="515" y="428" text-anchor="middle" font-family="system-ui" font-size="8" font-weight="bold" fill="#B8860B">Consejo</text>
  <text x="515" y="443" text-anchor="middle" font-family="system-ui" font-size="8" fill="#8B6914">Lijar entre capas para</text>
  <text x="515" y="453" text-anchor="middle" font-family="system-ui" font-size="8" fill="#8B6914">mejor adherencia</text>
</svg>
