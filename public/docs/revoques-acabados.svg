  <!-- ============================================ -->
  <rect x="40" y="60" width="170" height="220" fill="#E8D5B7" stroke="#2D2D2D" stroke-width="1.5" rx="6"/>
  <!-- Subtle horizontal fratás lines -->
  <line x1="50" y1="90" x2="200" y2="90" stroke="#D4C0A0" stroke-width="0.7"/>
  <line x1="50" y1="110" x2="200" y2="110" stroke="#D4C0A0" stroke-width="0.7"/>
  <line x1="50" y1="130" x2="200" y2="130" stroke="#D4C0A0" stroke-width="0.7"/>
  <line x1="50" y1="150" x2="200" y2="150" stroke="#D4C0A0" stroke-width="0.7"/>
  <line x1="50" y1="170" x2="200" y2="170" stroke="#D4C0A0" stroke-width="0.7"/>
  <line x1="50" y1="190" x2="200" y2="190" stroke="#D4C0A0" stroke-width="0.7"/>
  <line x1="50" y1="210" x2="200" y2="210" stroke="#D4C0A0" stroke-width="0.7"/>
  <line x1="50" y1="230" x2="200" y2="230" stroke="#D4C0A0" stroke-width="0.7"/>
