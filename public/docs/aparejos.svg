  <line x1="525" y1="156" x2="525" y2="196" stroke="#2D2D2D" stroke-width="1.5"/>
  <line x1="585" y1="156" x2="585" y2="196" stroke="#2D2D2D" stroke-width="1.5"/>
  <line x1="645" y1="156" x2="645" y2="196" stroke="#2D2D2D" stroke-width="1.5"/>
  <line x1="705" y1="156" x2="705" y2="196" stroke="#2D2D2D" stroke-width="1.5"/>
  <rect x="460" y="156" width="8" height="40" fill="#B8A99A" stroke="none"/>
  <rect x="520" y="156" width="8" height="40" fill="#B8A99A" stroke="none"/>
  <rect x="580" y="156" width="8" height="40" fill="#B8A99A" stroke="none"/>
  <rect x="640" y="156" width="8" height="40" fill="#B8A99A" stroke="none"/>
  <rect x="700" y="156" width="8" height="40" fill="#B8A99A" stroke="none"/>

  <rect x="435" y="196" width="310" height="6" fill="#B8A99A" stroke="none"/>

