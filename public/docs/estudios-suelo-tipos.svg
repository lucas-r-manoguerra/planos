<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#FAF9F6" rx="8"/>
  <text x="400" y="30" text-anchor="middle" font-family="system-ui" font-size="15" font-weight="bold" fill="#1A1A1A">Tipos de Suelo y Ensayos</text>
  <text x="400" y="48" text-anchor="middle" font-family="system-ui" font-size="11" fill="#6B6B6B">Características de suelos típicos y métodos de análisis</text>

  <!-- === SUELO ARENOSO === -->
  <rect x="25" y="65" width="230" height="395" fill="#FFFFFF" stroke="#E0DDD6" stroke-width="1.5" rx="6"/>
  <text x="140" y="90" text-anchor="middle" font-family="system-ui" font-size="13" font-weight="bold" fill="#6B5A3A">Suelo Arenoso</text>

  <!-- Soil profile -->
  <rect x="45" y="100" width="190" height="100" fill="#E8DCC8" stroke="#B8A99A" stroke-width="1" rx="2"/>
  <!-- Sand dots -->
  <circle cx="70" cy="115" r="2" fill="#C8B898"/>
  <circle cx="100" cy="125" r="1.5" fill="#C8B898"/>
  <circle cx="130" cy="110" r="2" fill="#C8B898"/>
  <circle cx="160" cy="130" r="1.5" fill="#C8B898"/>
  <circle cx="85" cy="145" r="2" fill="#C8B898"/>
  <circle cx="115" cy="160" r="1.5" fill="#C8B898"/>
  <circle cx="145" cy="150" r="2" fill="#C8B898"/>
  <circle cx="175" cy="140" r="1.5" fill="#C8B898"/>
  <circle cx="60" cy="170" r="2" fill="#C8B898"/>
  <circle cx="200" cy="165" r="1.5" fill="#C8B898"/>
  <circle cx="90" cy="185" r="2" fill="#C8B898"/>
  <circle cx="160" cy="180" r="1.5" fill="#C8B898"/>
  <circle cx="120" cy="190" r="2" fill="#C8B898"/>
  <circle cx="210" cy="120" r="1.5" fill="#C8B898"/>

  <text x="140" y="220" text-anchor="middle" font-family="system-ui" font-size="10" fill="#6B5A3A">Partículas gruesas</text>
  <text x="140" y="234" text-anchor="middle" font-family="system-ui" font-size="10" fill="#6B5A3A">(0.05 – 2 mm)</text>

  <!-- Properties -->
  <rect x="45" y="248" width="190" height="75" fill="#F5F3EF" stroke="#E0DDD6" stroke-width="1" rx="4"/>
  <text x="140" y="268" text-anchor="middle" font-family="system-ui" font-size="10" font-weight="bold" fill="#1A1A1A">Propiedades</text>
  <text x="55" y="285" font-family="system-ui" font-size="9" fill="#5A5A5A">✓ Buen drenaje</text>
  <text x="55" y="300" font-family="system-ui" font-size="9" fill="#5A5A5A">✗ Baja capacidad portante</text>
  <text x="55" y="315" font-family="system-ui" font-size="9" fill="#5A5A5A">✓ Fácil de excavar</text>

  <!-- Test tube icon -->
  <rect x="85" y="340" width="110" height="100" fill="#F0F4F8" stroke="#C0D0E0" stroke-width="1.5" rx="6"/>
  <!-- Test tube shape -->
  <rect x="125" y="355" width="30" height="55" fill="none" stroke="#3B65A3" stroke-width="1.5" rx="3"/>
  <rect x="122" y="352" width="36" height="8" fill="#3B65A3" rx="2"/>
  <rect x="132" y="385" width="16" height="20" fill="#E8DCC8" stroke="#3B65A3" stroke-width="1" rx="1"/>
  <!-- Sand fill -->
  <circle cx="136" cy="390" r="1.5" fill="#C8B898"/>
  <circle cx="144" cy="396" r="1.5" fill="#C8B898"/>
  <circle cx="138" cy="400" r="1.5" fill="#C8B898"/>
  <text x="140" y="425" text-anchor="middle" font-family="system-ui" font-size="9" fill="#3B65A3">Granulometría</text>

  <!-- === SUELO ARCILLOSO === -->
  <rect x="285" y="65" width="230" height="395" fill="#FFFFFF" stroke="#E0DDD6" stroke-width="1.5" rx="6"/>
  <text x="400" y="90" text-anchor="middle" font-family="system-ui" font-size="13" font-weight="bold" fill="#8B4A3A">Suelo Arcilloso</text>

  <!-- Soil profile -->
  <rect x="305" y="100" width="190" height="100" fill="#C8A088" stroke="#9A7868" stroke-width="1" rx="2"/>
  <!-- Clay tight pattern -->
  <line x1="305" y1="115" x2="495" y2="115" stroke="#B89078" stroke-width="0.5"/>
  <line x1="305" y1="130" x2="495" y2="130" stroke="#B89078" stroke-width="0.5"/>
  <line x1="305" y1="145" x2="495" y2="145" stroke="#B89078" stroke-width="0.5"/>
  <line x1="305" y1="160" x2="495" y2="160" stroke="#B89078" stroke-width="0.5"/>
  <line x1="305" y1="175" x2="495" y2="175" stroke="#B89078" stroke-width="0.5"/>
  <line x1="305" y1="190" x2="495" y2="190" stroke="#B89078" stroke-width="0.5"/>
  <!-- Micro cracks -->
  <line x1="350" y1="100" x2="355" y2="110" stroke="#9A7868" stroke-width="0.5"/>
  <line x1="420" y1="130" x2="415" y2="140" stroke="#9A7868" stroke-width="0.5"/>

  <text x="400" y="220" text-anchor="middle" font-family="system-ui" font-size="10" fill="#8B4A3A">Partículas microscópicas</text>
  <text x="400" y="234" text-anchor="middle" font-family="system-ui" font-size="10" fill="#8B4A3A">(&lt; 0.002 mm)</text>

  <!-- Properties -->
  <rect x="305" y="248" width="190" height="75" fill="#F5F3EF" stroke="#E0DDD6" stroke-width="1" rx="4"/>
  <text x="400" y="268" text-anchor="middle" font-family="system-ui" font-size="10" font-weight="bold" fill="#1A1A1A">Propiedades</text>
  <text x="315" y="285" font-family="system-ui" font-size="9" fill="#5A5A5A">✗ Mal drenaje</text>
  <text x="315" y="300" font-family="system-ui" font-size="9" fill="#5A5A5A">✗ Expansivo (cambia volumen)</text>
  <text x="315" y="315" font-family="system-ui" font-size="9" fill="#5A5A5A">✓ Buena capacidad (seca)</text>

  <!-- Test tube icon -->
  <rect x="345" y="340" width="110" height="100" fill="#F0F4F8" stroke="#C0D0E0" stroke-width="1.5" rx="6"/>
  <rect x="385" y="355" width="30" height="55" fill="none" stroke="#3B65A3" stroke-width="1.5" rx="3"/>
  <rect x="382" y="352" width="36" height="8" fill="#3B65A3" rx="2"/>
  <rect x="392" y="385" width="16" height="20" fill="#C8A088" stroke="#3B65A3" stroke-width="1" rx="1"/>
  <text x="400" y="425" text-anchor="middle" font-family="system-ui" font-size="9" fill="#3B65A3">Límites de</text>
  <text x="400" y="437" text-anchor="middle" font-family="system-ui" font-size="9" fill="#3B65A3">Atterberg</text>

  <!-- === SUELO ROCOSO === -->
  <rect x="545" y="65" width="230" height="395" fill="#FFFFFF" stroke="#E0DDD6" stroke-width="1.5" rx="6"/>
  <text x="660" y="90" text-anchor="middle" font-family="system-ui" font-size="13" font-weight="bold" fill="#4A5A6A">Suelo Rocoso</text>

  <!-- Soil profile -->
  <rect x="565" y="100" width="190" height="100" fill="#A0A8B0" stroke="#707880" stroke-width="1" rx="2"/>
  <!-- Rock pattern -->
  <polygon points="580,110 600,115 595,130 575,125" fill="#889098"/>
  <polygon points="610,120 640,115 635,135 615,138" fill="#889098"/>
  <polygon points="650,108 680,112 675,128 655,126" fill="#889098"/>
  <polygon points="690,118 720,115 725,130 695,132" fill="#889098"/>
  <polygon points="585,145 615,140 620,158 590,160" fill="#889098"/>
  <polygon points="635,150 665,148 670,165 640,168" fill="#889098"/>
  <polygon points="685,142 720,140 725,155 690,158" fill="#889098"/>
  <polygon points="600,170 630,168 635,185 605,188" fill="#889098"/>
  <polygon points="660,175 690,172 695,190 665,192" fill="#889098"/>

  <text x="660" y="220" text-anchor="middle" font-family="system-ui" font-size="10" fill="#4A5A6A">Roca madre o</text>
  <text x="660" y="234" text-anchor="middle" font-family="system-ui" font-size="10" fill="#4A5A6A">afloramiento rocoso</text>

  <!-- Properties -->
  <rect x="565" y="248" width="190" height="75" fill="#F5F3EF" stroke="#E0DDD6" stroke-width="1" rx="4"/>
  <text x="660" y="268" text-anchor="middle" font-family="system-ui" font-size="10" font-weight="bold" fill="#1A1A1A">Propiedades</text>
  <text x="575" y="285" font-family="system-ui" font-size="9" fill="#5A5A5A">✓ Excelente capacidad portante</text>
  <text x="575" y="300" font-family="system-ui" font-size="9" fill="#5A5A5A">✗ Difícil excavación</text>
  <text x="575" y="315" font-family="system-ui" font-size="9" fill="#5A5A5A">✗ Requiere voladura o corte</text>

  <!-- Test tube icon -->
  <rect x="605" y="340" width="110" height="100" fill="#F0F4F8" stroke="#C0D0E0" stroke-width="1.5" rx="6"/>
  <rect x="645" y="355" width="30" height="55" fill="none" stroke="#3B65A3" stroke-width="1.5" rx="3"/>
  <rect x="642" y="352" width="36" height="8" fill="#3B65A3" rx="2"/>
  <rect x="652" y="385" width="16" height="20" fill="#A0A8B0" stroke="#3B65A3" stroke-width="1" rx="1"/>
  <text x="660" y="425" text-anchor="middle" font-family="system-ui" font-size="9" fill="#3B65A3">Compresión</text>
  <text x="660" y="437" text-anchor="middle" font-family="system-ui" font-size="9" fill="#3B65A3">simple</text>

  <!-- Footer note -->
  <text x="400" y="490" text-anchor="middle" font-family="system-ui" font-size="9" fill="#6B6B6B">Fuente: CIRSOC 201 · CIRSOC 301 · Estudio geotécnico obligatorio según IRAM</text>
</svg>