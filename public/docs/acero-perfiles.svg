<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" fill="#FAF9F6" rx="8"/>
  <text x="400" y="30" text-anchor="middle" font-family="system-ui" font-size="15" font-weight="bold" fill="#1A1A1A">Perfiles de Acero Estructural</text>

  <!-- === Perfil 1: IPN / Doble T === -->
  <rect x="20" y="50" width="145" height="370" fill="#F5F3EF" stroke="#E0DDD6" rx="6"/>
  <text x="92" y="75" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="bold" fill="#1A1A1A">I / Doble T</text>

  <!-- IPN cross-section -->
  <rect x="47" y="105" width="90" height="14" fill="#6B7B8D" stroke="#2D2D2D" stroke-width="1.5" rx="1"/>
  <rect x="82" y="119" width="20" height="130" fill="#6B7B8D" stroke="#2D2D2D" stroke-width="1.5" rx="1"/>
  <rect x="47" y="249" width="90" height="14" fill="#6B7B8D" stroke="#2D2D2D" stroke-width="1.5" rx="1"/>

  <text x="92" y="300" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="bold" fill="#2D2D2D">IPN / IPE</text>
  <text x="92" y="318" text-anchor="middle" font-family="system-ui" font-size="10" fill="#6B6B6B">Vigas, columnas</text>
  <text x="92" y="340" text-anchor="middle" font-family="system-ui" font-size="8" fill="#6B6B6B">Ala angosta (IPN)</text>
  <text x="92" y="354" text-anchor="middle" font-family="system-ui" font-size="8" fill="#6B6B6B">Ala ancha (IPE)</text>

  <!-- === Perfil 2: Canal UPN === -->
  <rect x="175" y="50" width="145" height="370" fill="#F5F3EF" stroke="#E0DDD6" rx="6"/>
  <text x="247" y="75" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="bold" fill="#1A1A1A">U / Canal</text>

  <!-- UPN cross-section -->
  <rect x="192" y="105" width="10" height="160" fill="#6B7B8D" stroke="#2D2D2D" stroke-width="1.5" rx="1"/>
  <rect x="192" y="105" width="100" height="12" fill="#6B7B8D" stroke="#2D2D2D" stroke-width="1.5" rx="1"/>
  <rect x="192" y="253" width="100" height="12" fill="#6B7B8D" stroke="#2D2D2D" stroke-width="1.5" rx="1"/>

  <text x="247" y="300" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="bold" fill="#2D2D2D">UPN / C</text>
  <text x="247" y="318" text-anchor="middle" font-family="system-ui" font-size="10" fill="#6B6B6B">Correas, canaletas</text>
  <text x="247" y="340" text-anchor="middle" font-family="system-ui" font-size="8" fill="#6B6B6B">Perfiles secundarios</text>

  <!-- === Perfil 3: Ángulo L === -->
  <rect x="330" y="50" width="145" height="370" fill="#F5F3EF" stroke="#E0DDD6" rx="6"/>
  <text x="402" y="75" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="bold" fill="#1A1A1A">L / Ángulo</text>

  <!-- L cross-section -->
  <rect x="357" y="105" width="90" height="12" fill="#6B7B8D" stroke="#2D2D2D" stroke-width="1.5" rx="1"/>
  <rect x="357" y="105" width="12" height="90" fill="#6B7B8D" stroke="#2D2D2D" stroke-width="1.5" rx="1"/>

  <text x="402" y="300" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="bold" fill="#2D2D2D">L</text>
  <text x="402" y="318" text-anchor="middle" font-family="system-ui" font-size="10" fill="#6B6B6B">Riendas, ménsulas</text>
  <text x="402" y="340" text-anchor="middle" font-family="system-ui" font-size="8" fill="#6B6B6B">Arriostramientos</text>
  <text x="402" y="354" text-anchor="middle" font-family="system-ui" font-size="8" fill="#6B6B6B">Alas iguales y desiguales</text>

  <!-- === Perfil 4: Tubo cuadrado TCA === -->
  <rect x="485" y="50" width="145" height="370" fill="#F5F3EF" stroke="#E0DDD6" rx="6"/>
  <text x="557" y="75" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="bold" fill="#1A1A1A">Tubo Cuadrado</text>

  <!-- TCA cross-section -->
  <rect x="512" y="105" width="90" height="90" fill="none" stroke="#6B7B8D" stroke-width="12" rx="2"/>
  <rect x="524" y="117" width="66" height="66" fill="#FAF9F6" stroke="none" rx="1"/>

  <text x="557" y="300" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="bold" fill="#2D2D2D">TCA</text>
  <text x="557" y="318" text-anchor="middle" font-family="system-ui" font-size="10" fill="#6B6B6B">Columnas livianas</text>
  <text x="557" y="340" text-anchor="middle" font-family="system-ui" font-size="8" fill="#6B6B6B">Pérgolas, barandas</text>
  <text x="557" y="354" text-anchor="middle" font-family="system-ui" font-size="8" fill="#6B6B6B">Mobiliario urbano</text>

  <!-- === Perfil 5: Tubo circular TCO === -->
  <rect x="640" y="50" width="145" height="370" fill="#F5F3EF" stroke="#E0DDD6" rx="6"/>
  <text x="712" y="75" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="bold" fill="#1A1A1A">Tubo Circular</text>

  <!-- TCO cross-section -->
  <circle cx="712" cy="150" r="45" fill="none" stroke="#6B7B8D" stroke-width="12"/>
  <circle cx="712" cy="150" r="33" fill="#FAF9F6" stroke="none"/>

  <text x="712" y="300" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="bold" fill="#2D2D2D">TCO</text>
  <text x="712" y="318" text-anchor="middle" font-family="system-ui" font-size="10" fill="#6B6B6B">Barandas, columnas</text>
  <text x="712" y="340" text-anchor="middle" font-family="system-ui" font-size="8" fill="#6B6B6B">Pasamanos</text>
  <text x="712" y="354" text-anchor="middle" font-family="system-ui" font-size="8" fill="#6B6B6B">Cañerías estructurales</text>

  <!-- Footer -->
  <text x="400" y="430" text-anchor="middle" font-family="system-ui" font-size="9" fill="#6B6B6B">Normas: IRAM 2615, CIRSOC 201 — Perfiles laminados en caliente</text>
</svg>
