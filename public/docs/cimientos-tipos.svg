    <line x1="64" y1="328" x2="76" y2="328" stroke="#8B4513" stroke-width="1"/>
    <line x1="64" y1="356" x2="76" y2="356" stroke="#8B4513" stroke-width="1"/>

    <rect x="107" y="253" width="30" height="145" fill="#A8B5A0" stroke="#8A9A84" stroke-width="1" rx="4"/>
    <line x1="115" y1="258" x2="115" y2="393" stroke="#8B4513" stroke-width="1.5"/>
    <line x1="129" y1="258" x2="129" y2="393" stroke="#8B4513" stroke-width="1.5"/>
