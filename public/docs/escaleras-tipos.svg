<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#FAF9F6" rx="8"/>
  <text x="400" y="30" text-anchor="middle" font-family="system-ui" font-size="15" font-weight="bold" fill="#1A1A1A">Tipos de Escalera</text>

  <line x1="0" y1="245" x2="800" y2="245" stroke="#D4C5B5" stroke-width="2"/>
  <line x1="400" y1="45" x2="400" y2="455" stroke="#D4C5B5" stroke-width="2"/>

  <!-- ===== RECTA ===== -->
  <g transform="translate(55, 65)">
    <text x="145" y="20" text-anchor="middle" font-family="system-ui" font-size="13" font-weight="bold" fill="#1A1A1A">Recta</text>

    <rect x="15" y="35" width="260" height="55" fill="#F5F3EF" stroke="#C17A57" stroke-width="1.5" rx="3"/>
    <line x1="15" y1="49" x2="275" y2="49" stroke="#C17A57" stroke-width="1"/>
    <line x1="15" y1="63" x2="275" y2="63" stroke="#C17A57" stroke-width="1"/>
    <line x1="15" y1="77" x2="275" y2="77" stroke="#C17A57" stroke-width="1"/>
    <line x1="15" y1="35" x2="15" y2="90" stroke="#C17A57" stroke-width="2"/>

    <polygon points="265,40 265,85 278,62" fill="#6B7B8D"/>
    <line x1="265" y1="40" x2="265" y2="85" stroke="#6B7B8D" stroke-width="1.5"/>

    <text x="145" y="130" text-anchor="middle" font-family="system-ui" font-size="11" fill="#6B6B6B">— tramo único</text>
  </g>

  <!-- ===== EN L ===== -->
  <g transform="translate(455, 65)">
    <text x="145" y="20" text-anchor="middle" font-family="system-ui" font-size="13" font-weight="bold" fill="#1A1A1A">En L</text>

    <rect x="20" y="35" width="45" height="75" fill="#F5F3EF" stroke="#C17A57" stroke-width="1.5" rx="2"/>
    <line x1="33" y1="40" x2="33" y2="105" stroke="#C17A57" stroke-width="1"/>
    <line x1="46" y1="40" x2="46" y2="105" stroke="#C17A57" stroke-width="1"/>
    <line x1="20" y1="105" x2="65" y2="105" stroke="#C17A57" stroke-width="2"/>

    <rect x="65" y="35" width="40" height="40" fill="#EDE5D5" stroke="#C17A57" stroke-width="1.5" rx="2"/>
    <text x="85" y="60" text-anchor="middle" font-family="system-ui" font-size="9" fill="#6B6B6B">D</text>

    <rect x="105" y="35" width="110" height="40" fill="#F5F3EF" stroke="#C17A57" stroke-width="1.5" rx="2"/>
    <line x1="115" y1="35" x2="115" y2="75" stroke="#C17A57" stroke-width="1"/>
    <line x1="130" y1="35" x2="130" y2="75" stroke="#C17A57" stroke-width="1"/>
    <line x1="145" y1="35" x2="145" y2="75" stroke="#C17A57" stroke-width="1"/>
    <line x1="160" y1="35" x2="160" y2="75" stroke="#C17A57" stroke-width="1"/>
    <line x1="175" y1="35" x2="175" y2="75" stroke="#C17A57" stroke-width="1"/>
    <line x1="190" y1="35" x2="190" y2="75" stroke="#C17A57" stroke-width="1"/>
    <line x1="215" y1="35" x2="215" y2="75" stroke="#C17A57" stroke-width="2"/>

    <text x="145" y="130" text-anchor="middle" font-family="system-ui" font-size="11" fill="#6B6B6B">— con descanso</text>
  </g>

  <!-- ===== CARACOL ===== -->
  <g transform="translate(55, 280)">
    <text x="145" y="20" text-anchor="middle" font-family="system-ui" font-size="13" font-weight="bold" fill="#1A1A1A">Caracol</text>

    <circle cx="145" cy="80" r="55" fill="#F5F3EF" stroke="#C17A57" stroke-width="1.5"/>
    <circle cx="145" cy="80" r="9" fill="#6B7B8D"/>

    <line x1="145" y1="25" x2="145" y2="135" stroke="#C17A57" stroke-width="1"/>
    <line x1="90" y1="80" x2="200" y2="80" stroke="#C17A57" stroke-width="1"/>
    <line x1="106" y1="41" x2="184" y2="119" stroke="#C17A57" stroke-width="1"/>
    <line x1="184" y1="41" x2="106" y2="119" stroke="#C17A57" stroke-width="1"/>
    <line x1="97" y1="56" x2="193" y2="104" stroke="#C17A57" stroke-width="1"/>
    <line x1="193" y1="56" x2="97" y2="104" stroke="#C17A57" stroke-width="1"/>

    <text x="145" y="160" text-anchor="middle" font-family="system-ui" font-size="11" fill="#6B6B6B">— mínimo espacio</text>
  </g>

  <!-- ===== COMPENSADA ===== -->
  <g transform="translate(455, 280)">
    <text x="145" y="20" text-anchor="middle" font-family="system-ui" font-size="13" font-weight="bold" fill="#1A1A1A">Compensada</text>

    <rect x="25" y="30" width="45" height="65" fill="#F5F3EF" stroke="#C17A57" stroke-width="1.5" rx="2"/>
    <line x1="38" y1="35" x2="38" y2="90" stroke="#C17A57" stroke-width="1"/>
    <line x1="51" y1="35" x2="51" y2="90" stroke="#C17A57" stroke-width="1"/>

    <polygon points="70,85 90,100 25,100" fill="#E8DCC8" stroke="#C17A57" stroke-width="1.5"/>
    <line x1="73" y1="92" x2="45" y2="100" stroke="#C17A57" stroke-width="1"/>

    <rect x="70" y="80" width="120" height="20" fill="#F5F3EF" stroke="#C17A57" stroke-width="1.5" rx="2"/>
    <line x1="85" y1="80" x2="85" y2="100" stroke="#C17A57" stroke-width="1"/>
    <line x1="105" y1="80" x2="105" y2="100" stroke="#C17A57" stroke-width="1"/>
    <line x1="125" y1="80" x2="125" y2="100" stroke="#C17A57" stroke-width="1"/>
    <line x1="145" y1="80" x2="145" y2="100" stroke="#C17A57" stroke-width="1"/>

    <polygon points="190,85 160,100 195,100" fill="#E8DCC8" stroke="#C17A57" stroke-width="1.5"/>
    <line x1="183" y1="92" x2="195" y2="100" stroke="#C17A57" stroke-width="1"/>

    <rect x="180" y="30" width="45" height="65" fill="#F5F3EF" stroke="#C17A57" stroke-width="1.5" rx="2"/>
    <line x1="193" y1="35" x2="193" y2="90" stroke="#C17A57" stroke-width="1"/>
    <line x1="206" y1="35" x2="206" y2="90" stroke="#C17A57" stroke-width="1"/>

    <polygon points="48,30 48,38 202,30 202,38" fill="#6B7B8D"/>
    <polygon points="48,30 56,34 48,38" fill="#6B7B8D"/>

    <text x="145" y="130" text-anchor="middle" font-family="system-ui" font-size="11" fill="#6B6B6B">— sin descanso</text>
  </g>
</svg>