<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <rect width="800" height="400" fill="#FAF9F6" rx="8"/>
  <text x="400" y="30" text-anchor="middle" font-family="system-ui" font-size="15" font-weight="bold" fill="#1A1A1A">Pendientes y Diámetros Sanitarios Recomendados</text>

  <!-- Helper: row height = 60, starting at y=60, labels at x=60 -->

  <!-- ROW 1: Colector principal / Inodoro -->
  <line x1="80" y1="90" x2="440" y2="120" stroke="#C17A57" stroke-width="6" stroke-linecap="round"/>
  <circle cx="80" cy="90" r="5" fill="#C17A57"/>
  <circle cx="440" cy="120" r="5" fill="#C17A57"/>
  <text x="60" y="95" text-anchor="end" font-family="system-ui" font-size="11" font-weight="bold" fill="#2D2D2D">Inodoro / Colector principal</text>
  <rect x="460" y="78" width="140" height="28" fill="#F5F3EF" stroke="#E0DDD6" stroke-width="1.5" rx="4"/>
  <text x="530" y="97" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="bold" fill="#C17A57">Ø 110 mm</text>
  <rect x="620" y="78" width="140" height="28" fill="#F5F3EF" stroke="#E0DDD6" stroke-width="1.5" rx="4"/>
  <text x="690" y="97" text-anchor="middle" font-family="system-ui" font-size="11" fill="#2D2D2D">Pendiente 1-2%</text>

  <!-- Arrow showing slope -->
  <line x1="220" y1="102" x2="260" y2="108" stroke="#6B6B6B" stroke-width="1.5"/>
  <line x1="260" y1="108" x2="255" y2="104" stroke="#6B6B6B" stroke-width="1.5"/>
  <line x1="260" y1="108" x2="256" y2="112" stroke="#6B6B6B" stroke-width="1.5"/>

  <!-- Separator line -->
  <line x1="60" y1="123" x2="750" y2="123" stroke="#E0DDD6" stroke-width="1"/>

  <!-- ROW 2: Ducha / Tina -->
  <line x1="80" y1="155" x2="440" y2="180" stroke="#C17A57" stroke-width="6" stroke-linecap="round"/>
  <circle cx="80" cy="155" r="5" fill="#C17A57"/>
  <circle cx="440" cy="180" r="5" fill="#C17A57"/>
  <text x="60" y="160" text-anchor="end" font-family="system-ui" font-size="11" font-weight="bold" fill="#2D2D2D">Ducha / Tina</text>
  <rect x="460" y="143" width="140" height="28" fill="#F5F3EF" stroke="#E0DDD6" stroke-width="1.5" rx="4"/>
  <text x="530" y="162" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="bold" fill="#C17A57">Ø 50 mm</text>
  <rect x="620" y="143" width="140" height="28" fill="#F5F3EF" stroke="#E0DDD6" stroke-width="1.5" rx="4"/>
  <text x="690" y="162" text-anchor="middle" font-family="system-ui" font-size="11" fill="#2D2D2D">Pendiente 1-2%</text>

  <line x1="220" y1="167" x2="260" y2="173" stroke="#6B6B6B" stroke-width="1.5"/>
  <line x1="260" y1="173" x2="255" y2="169" stroke="#6B6B6B" stroke-width="1.5"/>
  <line x1="260" y1="173" x2="256" y2="177" stroke="#6B6B6B" stroke-width="1.5"/>

  <line x1="60" y1="188" x2="750" y2="188" stroke="#E0DDD6" stroke-width="1"/>

  <!-- ROW 3: Lavatorio / Bidet -->
  <line x1="80" y1="220" x2="440" y2="250" stroke="#C17A57" stroke-width="6" stroke-linecap="round"/>
  <circle cx="80" cy="220" r="5" fill="#C17A57"/>
  <circle cx="440" cy="250" r="5" fill="#C17A57"/>
  <text x="60" y="225" text-anchor="end" font-family="system-ui" font-size="11" font-weight="bold" fill="#2D2D2D">Lavatorio / Bidet</text>
  <rect x="460" y="208" width="140" height="28" fill="#F5F3EF" stroke="#E0DDD6" stroke-width="1.5" rx="4"/>
  <text x="530" y="227" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="bold" fill="#C17A57">Ø 43 mm</text>
  <rect x="620" y="208" width="140" height="28" fill="#F5F3EF" stroke="#E0DDD6" stroke-width="1.5" rx="4"/>
  <text x="690" y="227" text-anchor="middle" font-family="system-ui" font-size="11" fill="#2D2D2D">Pendiente 1-3%</text>

  <line x1="220" y1="232" x2="260" y2="238" stroke="#6B6B6B" stroke-width="1.5"/>
  <line x1="260" y1="238" x2="255" y2="234" stroke="#6B6B6B" stroke-width="1.5"/>
  <line x1="260" y1="238" x2="256" y2="242" stroke="#6B6B6B" stroke-width="1.5"/>

  <line x1="60" y1="253" x2="750" y2="253" stroke="#E0DDD6" stroke-width="1"/>

  <!-- ROW 4: Bajada pluvial -->
  <line x1="80" y1="285" x2="440" y2="305" stroke="#5B9BD5" stroke-width="6" stroke-linecap="round"/>
  <circle cx="80" cy="285" r="5" fill="#5B9BD5"/>
  <circle cx="440" cy="305" r="5" fill="#5B9BD5"/>
  <text x="60" y="290" text-anchor="end" font-family="system-ui" font-size="11" font-weight="bold" fill="#2D2D2D">Bajada pluvial</text>
  <rect x="460" y="273" width="140" height="28" fill="#F5F3EF" stroke="#E0DDD6" stroke-width="1.5" rx="4"/>
  <text x="530" y="292" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="bold" fill="#5B9BD5">Ø 63 mm</text>
  <rect x="620" y="273" width="140" height="28" fill="#F5F3EF" stroke="#E0DDD6" stroke-width="1.5" rx="4"/>
  <text x="690" y="292" text-anchor="middle" font-family="system-ui" font-size="11" fill="#2D2D2D">Pendiente 0.5-1%</text>

  <line x1="220" y1="297" x2="260" y2="302" stroke="#6B6B6B" stroke-width="1.5"/>
  <line x1="260" y1="302" x2="255" y2="298" stroke="#6B6B6B" stroke-width="1.5"/>
  <line x1="260" y1="302" x2="256" y2="306" stroke="#6B6B6B" stroke-width="1.5"/>

  <line x1="60" y1="318" x2="750" y2="318" stroke="#E0DDD6" stroke-width="1"/>

  <!-- ROW 5: Ventilación -->
  <line x1="80" y1="360" x2="440" y2="345" stroke="#8DB58D" stroke-width="6" stroke-linecap="round"/>
  <circle cx="80" cy="360" r="5" fill="#8DB58D"/>
  <circle cx="440" cy="345" r="5" fill="#8DB58D"/>
  <text x="60" y="365" text-anchor="end" font-family="system-ui" font-size="11" font-weight="bold" fill="#2D2D2D">Ventilación</text>
  <rect x="460" y="338" width="140" height="28" fill="#F5F3EF" stroke="#E0DDD6" stroke-width="1.5" rx="4"/>
  <text x="530" y="357" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="bold" fill="#8DB58D">Ø 50 mm</text>
  <rect x="620" y="338" width="140" height="28" fill="#F5F3EF" stroke="#E0DDD6" stroke-width="1.5" rx="4"/>
  <text x="690" y="357" text-anchor="middle" font-family="system-ui" font-size="11" fill="#2D2D2D">Vertical (sin pendiente)</text>

  <!-- Arrow up for ventilation -->
  <line x1="250" y1="340" x2="250" y2="310" stroke="#6B6B6B" stroke-width="1.5"/>
  <polygon points="250,306 245,314 255,314" fill="#6B6B6B"/>

  <!-- Legend -->
  <rect x="60" y="375" width="10" height="10" fill="#C17A57" rx="2"/>
  <text x="75" y="385" font-family="system-ui" font-size="9" fill="#2D2D2D">Cloacal</text>
  <rect x="140" y="375" width="10" height="10" fill="#5B9BD5" rx="2"/>
  <text x="155" y="385" font-family="system-ui" font-size="9" fill="#2D2D2D">Pluvial</text>
  <rect x="220" y="375" width="10" height="10" fill="#8DB58D" rx="2"/>
  <text x="235" y="385" font-family="system-ui" font-size="9" fill="#2D2D2D">Ventilación</text>
</svg>