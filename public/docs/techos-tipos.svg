<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#FAF9F6" rx="8"/>
  <text x="400" y="30" text-anchor="middle" font-family="system-ui" font-size="15" font-weight="bold" fill="#1A1A1A">Tipos de Techos</text>

  <!-- === Chapa (left) === -->
  <rect x="40" y="50" width="230" height="410" fill="#F5F3EF" stroke="#E0DDD6" rx="6"/>
  <text x="155" y="75" text-anchor="middle" font-family="system-ui" font-size="13" font-weight="bold" fill="#1A1A1A">Chapa</text>

  <!-- Corrugated roof -->
  <path d="M60 100 L70 95 L80 100 L90 95 L100 100 L110 95 L120 100 L130 95 L140 100 L150 95 L160 100 L170 95 L180 100 L190 95 L200 100 L210 95 L220 100 L230 95 L250 100" stroke="#6B6B6B" stroke-width="3" fill="none"/>
  <text x="155" y="115" text-anchor="middle" font-family="system-ui" font-size="9" fill="#3B65A3">Chapa ondulada</text>

  <!-- Metal beam -->
  <rect x="55" y="125" width="200" height="25" fill="#A09A91" stroke="#2D2D2D" stroke-width="1.5" rx="2"/>
  <text x="155" y="142" text-anchor="middle" font-family="system-ui" font-size="10" fill="white">Perfil metálico IPN</text>

  <!-- Support post -->
  <rect x="80" y="150" width="15" height="200" fill="#A09A91" stroke="#2D2D2D" stroke-width="1.5" rx="1"/>
  <rect x="200" y="150" width="15" height="200" fill="#A09A91" stroke="#2D2D2D" stroke-width="1.5" rx="1"/>

  <!-- Wall base -->
  <rect x="55" y="350" width="200" height="40" fill="#D4C5B5" stroke="#2D2D2D" stroke-width="1.5" rx="2"/>

  <text x="155" y="420" text-anchor="middle" font-family="system-ui" font-size="10" fill="#E74C3C">Pendiente: ≥ 10%</text>
  <text x="155" y="440" text-anchor="middle" font-family="system-ui" font-size="9" fill="#6B6B6B">Económico, liviano</text>

  <!-- === Teja (center) === -->
  <rect x="285" y="50" width="230" height="410" fill="#F5F3EF" stroke="#E0DDD6" rx="6"/>
  <text x="400" y="75" text-anchor="middle" font-family="system-ui" font-size="13" font-weight="bold" fill="#1A1A1A">Teja</text>

  <!-- Roof tiles -->
  <path d="M300 140 L320 100 L340 140 L360 100 L380 140 L400 100 L420 140 L440 100 L460 140 L480 100 L500 140" fill="none" stroke="#C75B39" stroke-width="4" stroke-linejoin="round"/>
  <text x="400" y="155" text-anchor="middle" font-family="system-ui" font-size="9" fill="#C75B39">Teja cerámica</text>

  <!-- Battens -->
  <rect x="290" y="165" width="220" height="6" fill="#B8A99A" stroke="none" rx="1"/>
  <rect x="290" y="185" width="220" height="6" fill="#B8A99A" stroke="none" rx="1"/>

  <!-- Wooden truss -->
  <line x1="295" y1="200" x2="400" y2="280" stroke="#8B6914" stroke-width="3"/>
  <line x1="505" y1="200" x2="400" y2="280" stroke="#8B6914" stroke-width="3"/>
  <line x1="400" y1="280" x2="400" y2="350" stroke="#8B6914" stroke-width="3"/>
  <text x="400" y="295" text-anchor="middle" font-family="system-ui" font-size="10" fill="#8B6914">Cercha de madera</text>

  <!-- Wall -->
  <rect x="295" y="310" width="20" height="80" fill="#D4C5B5" stroke="#2D2D2D" stroke-width="1.5" rx="1"/>
  <rect x="485" y="310" width="20" height="80" fill="#D4C5B5" stroke="#2D2D2D" stroke-width="1.5" rx="1"/>
  <rect x="295" y="350" width="210" height="40" fill="#D4C5B5" stroke="#2D2D2D" stroke-width="1.5" rx="2"/>

  <text x="400" y="420" text-anchor="middle" font-family="system-ui" font-size="10" fill="#E74C3C">Pendiente: ≥ 30%</text>
  <text x="400" y="440" text-anchor="middle" font-family="system-ui" font-size="9" fill="#6B6B6B">Estético, aislante</text>

  <!-- === Losa (right) === -->
  <rect x="530" y="50" width="230" height="410" fill="#F5F3EF" stroke="#E0DDD6" rx="6"/>
  <text x="645" y="75" text-anchor="middle" font-family="system-ui" font-size="13" font-weight="bold" fill="#1A1A1A">Losa</text>

  <!-- Insulation -->
  <rect x="545" y="95" width="200" height="20" fill="#E8D5B7" stroke="#2D2D2D" stroke-width="1" rx="1"/>
  <text x="645" y="109" text-anchor="middle" font-family="system-ui" font-size="9" fill="#2D2D2D">Aislación térmica</text>

  <!-- Waterproofing -->
  <rect x="545" y="115" width="200" height="8" fill="#1A1A1A" stroke="none" rx="1"/>
  <text x="645" y="130" text-anchor="middle" font-family="system-ui" font-size="9" fill="#2D2D2D">Membrana impermeable</text>

  <!-- Concrete slab -->
  <rect x="545" y="140" width="200" height="40" fill="#B8A99A" stroke="#2D2D2D" stroke-width="1.5" rx="2"/>
  <text x="645" y="165" text-anchor="middle" font-family="system-ui" font-size="10" fill="white">Hormigón armado</text>

  <!-- Column -->
  <rect x="575" y="180" width="18" height="170" fill="#B8A99A" stroke="#2D2D2D" stroke-width="1.5" rx="1"/>
  <rect x="697" y="180" width="18" height="170" fill="#B8A99A" stroke="#2D2D2D" stroke-width="1.5" rx="1"/>

  <rect x="545" y="350" width="200" height="40" fill="#D4C5B5" stroke="#2D2D2D" stroke-width="1.5" rx="2"/>

  <text x="645" y="420" text-anchor="middle" font-family="system-ui" font-size="10" fill="#E74C3C">Pendiente: ≥ 2%</text>
  <text x="645" y="440" text-anchor="middle" font-family="system-ui" font-size="9" fill="#6B6B6B">Terraza utilizable</text>
</svg>