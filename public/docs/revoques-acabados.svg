  <text x="125" y="315" text-anchor="middle" font-family="system-ui" font-size="13" font-weight="bold" fill="#1A1A1A">Liso</text>
  <text x="125" y="332" text-anchor="middle" font-family="system-ui" font-size="10" fill="#6B6B6B">Interiores, paredes</text>
  <text x="125" y="346" text-anchor="middle" font-family="system-ui" font-size="10" fill="#6B6B6B">para pintar</text>

