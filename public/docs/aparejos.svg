  <!-- Hilada 1: Soga -->
  <rect x="435" y="340" width="310" height="30" fill="#C17A57" stroke="#2D2D2D" stroke-width="1.5" rx="1"/>
  <line x1="502" y1="340" x2="502" y2="370" stroke="#2D2D2D" stroke-width="1.5"/>
  <line x1="569" y1="340" x2="569" y2="370" stroke="#2D2D2D" stroke-width="1.5"/>
  <line x1="636" y1="340" x2="636" y2="370" stroke="#2D2D2D" stroke-width="1.5"/>
  <line x1="703" y1="340" x2="703" y2="370" stroke="#2D2D2D" stroke-width="1.5"/>
  <rect x="497" y="340" width="8" height="30" fill="#B8A99A" stroke="none"/>
  <rect x="564" y="340" width="8" height="30" fill="#B8A99A" stroke="none"/>
  <rect x="631" y="340" width="8" height="30" fill="#B8A99A" stroke="none"/>
  <rect x="698" y="340" width="8" height="30" fill="#B8A99A" stroke="none"/>
  <rect x="435" y="370" width="310" height="5" fill="#B8A99A" stroke="none"/>

  <!-- Hilada 2: Alternados soga/tizón offset -->
  <rect x="435" y="375" width="310" height="30" fill="#C17A57" stroke="#2D2D2D" stroke-width="1.5" rx="1"/>
  <line x1="469" y1="375" x2="469" y2="405" stroke="#2D2D2D" stroke-width="1.5"/>
  <rect x="464" y="375" width="8" height="30" fill="#B8A99A" stroke="none"/>
  <line x1="502" y1="375" x2="502" y2="405" stroke="#2D2D2D" stroke-width="1.5"/>
  <line x1="569" y1="375" x2="569" y2="405" stroke="#2D2D2D" stroke-width="1.5"/>
  <rect x="564" y="375" width="8" height="30" fill="#B8A99A" stroke="none"/>
  <line x1="636" y1="375" x2="636" y2="405" stroke="#2D2D2D" stroke-width="1.5"/>
  <line x1="703" y1="375" x2="703" y2="405" stroke="#2D2D2D" stroke-width="1.5"/>
  <rect x="631" y="375" width="8" height="30" fill="#B8A99A" stroke="none"/>
  <rect x="698" y="375" width="8" height="30" fill="#B8A99A" stroke="none"/>
  <rect x="435" y="405" width="310" height="5" fill="#B8A99A" stroke="none"/>

  <!-- Hilada 3: Soga -->
  <rect x="435" y="410" width="310" height="30" fill="#C17A57" stroke="#2D2D2D" stroke-width="1.5" rx="1"/>
  <line x1="502" y1="410" x2="502" y2="440" stroke="#2D2D2D" stroke-width="1.5"/>
  <line x1="569" y1="410" x2="569" y2="440" stroke="#2D2D2D" stroke-width="1.5"/>
  <line x1="636" y1="410" x2="636" y2="440" stroke="#2D2D2D" stroke-width="1.5"/>
  <line x1="703" y1="410" x2="703" y2="440" stroke="#2D2D2D" stroke-width="1.5"/>
  <rect x="497" y="410" width="8" height="30" fill="#B8A99A" stroke="none"/>
  <rect x="564" y="410" width="8" height="30" fill="#B8A99A" stroke="none"/>
  <rect x="631" y="410" width="8" height="30" fill="#B8A99A" stroke="none"/>
  <rect x="698" y="410" width="8" height="30" fill="#B8A99A" stroke="none"/>

  <text x="605" y="468" text-anchor="middle" font-family="system-ui" font-size="10" fill="#6B6B6B">Soga y tizón alternados en cada hilada</text>
</svg>
