<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#FAF9F6" rx="8"/>
  <text x="400" y="30" text-anchor="middle" font-family="system-ui" font-size="15" font-weight="bold" fill="#1A1A1A">Detalle de Carpintería — Ventana y Puerta</text>

  <text x="220" y="55" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="bold" fill="#8B6914">VENTANA</text>
  <text x="620" y="55" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="bold" fill="#8B6914">PUERTA</text>

  <!-- === VENTANA (left half) === -->
  <!-- Wall -->
  <rect x="40" y="80" width="350" height="380" fill="#F5F3EF" stroke="#E0DDD6" rx="4"/>

  <!-- Wall opening -->
  <rect x="70" y="100" width="290" height="340" fill="#FAF9F6" stroke="none"/>

  <!-- Window frame -->
  <rect x="90" y="120" width="250" height="300" fill="#DEB887" stroke="#2D2D2D" stroke-width="2" rx="3"/>
  <text x="215" y="275" text-anchor="middle" font-family="system-ui" font-size="10" font-weight="bold" fill="#2D2D2D">Marco</text>

  <!-- Glass -->
  <rect x="110" y="140" width="210" height="260" fill="#AED6F1" stroke="#3B65A3" stroke-width="1.5" rx="2" opacity="0.6"/>
  <text x="215" y="275" text-anchor="middle" font-family="system-ui" font-size="10" fill="#1A5276" opacity="0.8">Vidrio</text>

  <!-- Seal -->
  <rect x="90" y="115" width="250" height="8" fill="#2D2D2D" rx="2"/>
  <text x="215" y="112" text-anchor="middle" font-family="system-ui" font-size="9" fill="#2D2D2D">Burlete / Sellado</text>

  <!-- Labels -->
  <line x1="40" y1="150" x2="90" y2="150" stroke="#E74C3C" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="55" y="145" text-anchor="end" font-family="system-ui" font-size="9" fill="#E74C3C">Muro</text>

  <line x1="340" y1="420" x2="380" y2="420" stroke="#E74C3C" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="385" y="424" font-family="system-ui" font-size="9" fill="#E74C3C">Junta de</text>
  <text x="385" y="436" font-family="system-ui" font-size="9" fill="#E74C3C">montaje</text>

  <!-- === PUERTA (right half) === -->
  <!-- Wall -->
  <rect x="420" y="80" width="340" height="380" fill="#F5F3EF" stroke="#E0DDD6" rx="4"/>

  <!-- Door frame -->
  <rect x="435" y="100" width="310" height="340" fill="#DEB887" stroke="#2D2D2D" stroke-width="2" rx="3"/>
  <text x="590" y="455" text-anchor="middle" font-family="system-ui" font-size="10" font-weight="bold" fill="#2D2D2D">Marco de puerta</text>

  <!-- Door leaf -->
  <rect x="455" y="120" width="270" height="300" fill="#C49A3C" stroke="#2D2D2D" stroke-width="2" rx="2"/>
  <text x="590" y="275" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="bold" fill="#2D2D2D">Hoja</text>
  <text x="590" y="295" text-anchor="middle" font-family="system-ui" font-size="10" fill="#2D2D2D">de puerta</text>

  <!-- Panel detail -->
  <rect x="475" y="145" width="230" height="80" fill="none" stroke="#8B6914" stroke-width="1.5" rx="3"/>
  <rect x="475" y="250" width="230" height="60" fill="none" stroke="#8B6914" stroke-width="1.5" rx="3"/>

  <!-- Hinge -->
  <circle cx="455" cy="160" r="6" fill="#6B6B6B" stroke="#2D2D2D" stroke-width="1"/>
  <circle cx="455" cy="200" r="6" fill="#6B6B6B" stroke="#2D2D2D" stroke-width="1"/>
  <circle cx="455" cy="240" r="6" fill="#6B6B6B" stroke="#2D2D2D" stroke-width="1"/>
  <text x="445" y="225" text-anchor="end" font-family="system-ui" font-size="9" fill="#6B6B6B">Bisagras</text>

  <!-- Handle -->
  <circle cx="710" cy="270" r="5" fill="#2D2D2D"/>
  <rect x="708" y="265" width="20" height="10" fill="none" stroke="#2D2D2D" stroke-width="1.5" rx="2"/>
  <text x="725" y="275" font-family="system-ui" font-size="9" fill="#2D2D2D">Picaporte</text>
</svg>